<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b1015">
<title>레지스트리 포렌식 탐색기 · 디지털포렌식 2급 실기</title>
<style>
:root{
  --bg:#f3f5f8; --bg2:#ffffff; --card:#ffffff; --text:#0f1720; --muted:#5b6b7b;
  --line:#e2e7ed; --line2:#eef1f5; --code-bg:#eef2f6; --sel:#e2f2ef;
  --accent:#0f766e; --accent-soft:#d9efeb;
  --exec:#c2680a; --file:#0369a1; --usb:#6d28d9; --system:#047857; --account:#be123c;
  --shadow:0 10px 30px rgba(15,23,32,.10); --shadow-s:0 2px 8px rgba(15,23,32,.06);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0b1015; --bg2:#101820; --card:#141c25; --text:#e8eef5; --muted:#94a3b3;
    --line:#22303d; --line2:#1a2530; --code-bg:#0d141b; --sel:#12322d;
    --accent:#2dd4bf; --accent-soft:#0e2b28;
    --exec:#fbbf24; --file:#38bdf8; --usb:#a78bfa; --system:#34d399; --account:#fb7185;
    --shadow:0 12px 34px rgba(0,0,0,.5); --shadow-s:0 2px 8px rgba(0,0,0,.35);
  }
}
html[data-theme="light"]{
  --bg:#f3f5f8; --bg2:#ffffff; --card:#ffffff; --text:#0f1720; --muted:#5b6b7b;
  --line:#e2e7ed; --line2:#eef1f5; --code-bg:#eef2f6; --sel:#e2f2ef;
  --accent:#0f766e; --accent-soft:#d9efeb;
  --exec:#c2680a; --file:#0369a1; --usb:#6d28d9; --system:#047857; --account:#be123c;
  --shadow:0 10px 30px rgba(15,23,32,.10); --shadow-s:0 2px 8px rgba(15,23,32,.06);
}
html[data-theme="dark"]{
  --bg:#0b1015; --bg2:#101820; --card:#141c25; --text:#e8eef5; --muted:#94a3b3;
  --line:#22303d; --line2:#1a2530; --code-bg:#0d141b; --sel:#12322d;
  --accent:#2dd4bf; --accent-soft:#0e2b28;
  --exec:#fbbf24; --file:#38bdf8; --usb:#a78bfa; --system:#34d399; --account:#fb7185;
  --shadow:0 12px 34px rgba(0,0,0,.5); --shadow-s:0 2px 8px rgba(0,0,0,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic",system-ui,sans-serif;
  -webkit-text-size-adjust:100%; overflow-x:hidden;
}
code,.mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
h1,h2,h3,p{margin:0}
.wrap{max-width:1120px;margin:0 auto;padding:0 14px}

/* ---------- header ---------- */
header.brand{
  background:linear-gradient(180deg,var(--bg2),var(--bg));
  border-bottom:1px solid var(--line);
  padding:calc(10px + env(safe-area-inset-top)) 0 10px;
}
.brandrow{display:flex;align-items:center;gap:11px}
.logo{
  width:38px;height:38px;border-radius:11px;flex:0 0 auto;
  background:linear-gradient(145deg,var(--accent),#0d9488);
  color:#fff;display:flex;align-items:center;justify-content:center;
  font-size:19px;box-shadow:var(--shadow-s)
}
.brandtxt{min-width:0;flex:1}
.brandtxt h1{font-size:17px;font-weight:750;letter-spacing:-.02em;line-height:1.25}
.brandtxt p{font-size:11.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.themeBtn{
  flex:0 0 auto;width:36px;height:36px;border-radius:10px;border:1px solid var(--line);
  background:var(--card);display:flex;align-items:center;justify-content:center;font-size:15px;
}
.meta{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.meta span{
  font-size:11px;color:var(--muted);background:var(--bg2);border:1px solid var(--line);
  padding:2px 8px;border-radius:99px
}
.meta span b{color:var(--accent);font-weight:700}

/* ---------- sticky tabs + search ---------- */
.stickybar{position:sticky;top:0;z-index:40;background:var(--bg);padding-top:8px;border-bottom:1px solid var(--line);padding-bottom:8px}
.tabbar{display:flex;gap:4px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:4px}
.tabbar button{
  flex:1;padding:8px 4px;border-radius:9px;font-size:13px;font-weight:650;color:var(--muted);
  transition:background .15s,color .15s;white-space:nowrap
}
.tabbar button.on{background:var(--accent);color:#fff;box-shadow:var(--shadow-s)}
html[data-theme="dark"] .tabbar button.on, .tabbar button.on{color:#fff}
.searchbox{position:relative;margin-top:8px}
.searchbox svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);opacity:.45}
.searchbox input{
  width:100%;padding:10px 34px 10px 34px;border-radius:11px;border:1px solid var(--line);
  background:var(--bg2);color:var(--text);font-size:14px;outline:none;-webkit-appearance:none
}
.searchbox input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.searchbox input::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
.searchbox .clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:28px;height:28px;border-radius:99px;display:none;align-items:center;justify-content:center;color:var(--muted);font-size:14px}
.searchbox.has .clear{display:flex}

/* ---------- pills ---------- */
.pills{display:flex;gap:7px;overflow-x:auto;padding:10px 0 2px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pill{
  flex:0 0 auto;padding:6px 12px;border-radius:99px;border:1px solid var(--line);
  background:var(--bg2);color:var(--muted);font-size:12.5px;font-weight:600;white-space:nowrap
}
.pill .n{opacity:.55;font-weight:500;margin-left:4px;font-size:11.5px}
.pill.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.pill .pdot{display:inline-block;width:6px;height:6px;border-radius:99px;margin-right:6px;vertical-align:1px;background:var(--c)}
.pill[data-cat="exec"]{--c:var(--exec)} .pill[data-cat="file"]{--c:var(--file)}
.pill[data-cat="usb"]{--c:var(--usb)} .pill[data-cat="system"]{--c:var(--system)}
.pill[data-cat="account"]{--c:var(--account)} .pill[data-cat="all"]{--c:var(--muted)}

/* ---------- cards ---------- */
main{padding:4px 0 40px}
.group{margin-top:16px}
.group-h{display:flex;align-items:center;gap:8px;padding:2px 2px 8px}
.group-h h2{font-size:13px;font-weight:750;letter-spacing:-.01em}
.group-h .gdot{width:8px;height:8px;border-radius:99px;background:var(--c)}
.group-h .gcount{font-size:11px;color:var(--muted);margin-left:auto}
.cards{display:grid;gap:9px}
@media (min-width:760px){.cards{grid-template-columns:1fr 1fr}}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 13px;
  box-shadow:var(--shadow-s);text-align:left;width:100%;display:block;cursor:pointer;
  transition:transform .12s,border-color .12s
}
.card:active{transform:scale(.988)}
.card-top{display:flex;align-items:center;gap:7px;min-width:0}
.card-top .dot{width:8px;height:8px;border-radius:99px;background:var(--c);flex:0 0 auto}
.card-top h3{font-size:15px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-sub{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.45}
.hot{
  flex:0 0 auto;font-size:9.5px;font-weight:800;letter-spacing:.02em;color:#fff;background:var(--account);
  padding:1.5px 6px;border-radius:99px
}
.card .pathrow{
  display:flex;align-items:center;gap:6px;margin-top:9px;background:var(--code-bg);
  border-radius:9px;padding:6px 7px 6px 9px
}
.card .pathrow code{
  flex:1;min-width:0;font-size:11.5px;line-height:1.35;color:var(--text);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-all
}
.card-foot{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:11px;color:var(--muted)}
.card-foot .more{margin-left:auto;color:var(--accent);font-weight:700}

/* ---------- copy buttons ---------- */
.cbtn{
  flex:0 0 auto;display:inline-flex;align-items:center;gap:4px;
  font-size:11px;font-weight:700;color:var(--accent);background:var(--bg2);
  border:1px solid var(--line);border-radius:8px;padding:5px 8px;line-height:1;cursor:pointer
}
.cbtn:active{background:var(--accent-soft)}
.cbtn.sm{padding:4px 7px;font-size:10.5px}

/* ---------- tree ---------- */
.treewrap{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-top:10px;overflow:hidden;box-shadow:var(--shadow-s)}
.treebar{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line2);background:var(--bg2)}
.treebar .hint{font-size:11px;color:var(--muted);flex:1;line-height:1.35}
.treebar .tbtn{font-size:11px;font-weight:700;color:var(--accent);border:1px solid var(--line);border-radius:8px;padding:4px 7px;background:var(--card)}
.tree{padding:6px 4px 10px;font-size:13.5px}
.tree ul{list-style:none;margin:0;padding:0}
.tree li{position:relative}
.tree ul.children{margin-left:11px;border-left:1px solid var(--line2);padding-left:2px}
.tree ul.children[hidden]{display:none}
.row{
  display:flex;align-items:center;gap:2px;padding:5px 6px 5px 0;border-radius:8px;
  position:relative;cursor:pointer
}
.row:active{background:var(--line2)}
.tw{
  flex:0 0 auto;width:22px;height:22px;display:flex;align-items:center;justify-content:center;
  font-size:10px;color:var(--muted);transition:transform .15s
}
.tw[aria-expanded="true"]{transform:rotate(90deg)}
.tw.leaf{opacity:.28;font-size:8px}
.row .kname{
  font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0
}
.row .cnt{
  flex:0 0 auto;font-size:9.5px;font-weight:800;color:var(--accent);background:var(--accent-soft);
  border-radius:99px;padding:1px 5px;min-width:16px;text-align:center
}
.row .sub{flex:0 0 auto;font-size:9px;color:var(--muted);opacity:.8}
.row.has::after{content:"";position:absolute;right:8px;width:4px;height:4px;border-radius:99px;background:var(--accent);opacity:.45}
.row.sel{background:var(--sel)}
.row.sel::before{
  content:"";position:absolute;left:-2px;top:4px;bottom:4px;width:3px;border-radius:99px;background:var(--accent)
}
.row.sel .kname{font-weight:700}
.rootrow .kname{font-weight:750;font-size:13px}
.rootrow{background:var(--bg2)}
.rootrow .rhint{font-size:9.5px;color:var(--muted);display:block;margin-top:1px;font-family:inherit;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- detail sheet ---------- */
#detail{
  position:fixed;left:0;right:0;bottom:0;z-index:60;
  height:min(74vh,660px);height:min(74dvh,660px);
  background:var(--card);border-top:1px solid var(--line);border-radius:20px 20px 0 0;
  box-shadow:0 -12px 40px rgba(0,0,0,.28);
  transform:translateY(105%);transition:transform .28s cubic-bezier(.22,.8,.3,1),visibility 0s linear .28s;
  display:flex;flex-direction:column;visibility:hidden
}
#detail.open{transform:translateY(0);visibility:visible;transition:transform .28s cubic-bezier(.22,.8,.3,1)}
.handle{height:22px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;touch-action:none;cursor:grab}
.handle span{width:38px;height:4px;border-radius:99px;background:var(--line);display:block}
.dclose{
  position:absolute;top:8px;right:10px;z-index:3;width:34px;height:34px;border-radius:99px;
  display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--muted);background:var(--bg2);border:1px solid var(--line)
}
.dscroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:2px 16px calc(26px + env(safe-area-inset-bottom))}

@media (min-width:900px){
  #detail{
    top:0;bottom:0;left:auto;right:0;width:min(560px,48vw);height:100%;border-radius:0;
    border-top:0;border-left:1px solid var(--line);transform:translateX(105%);box-shadow:-14px 0 40px rgba(0,0,0,.18)
  }
  #detail.open{transform:translateX(0)}
  .handle{display:none}
  .dscroll{padding-top:20px}
}

/* ---------- detail content ---------- */
.hivechip{
  display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.02em;
  color:var(--accent);background:var(--accent-soft);padding:3px 8px;border-radius:7px;
  font-family:ui-monospace,Menlo,monospace;margin-bottom:9px
}
.nodeh2{font-size:16px;font-weight:750;letter-spacing:-.02em;word-break:break-all;line-height:1.3}
.pbox{margin-top:10px}
.plabel{font-size:10.5px;font-weight:700;color:var(--muted);letter-spacing:.02em;margin-bottom:4px}
.prow{display:flex;align-items:flex-start;gap:7px;background:var(--code-bg);border:1px solid var(--line2);border-radius:10px;padding:8px 8px 8px 10px}
.prow code{flex:1;min-width:0;font-size:12px;line-height:1.45;word-break:break-all;color:var(--text)}
.fileline{display:flex;align-items:center;gap:7px;margin-top:8px;flex-wrap:wrap}
.fileline .k{font-size:10.5px;font-weight:700;color:var(--muted);flex:0 0 auto}
.fileline code{font-size:11.5px;color:var(--text);word-break:break-all;flex:1;min-width:0}
.note{font-size:12px;color:var(--muted);margin-top:8px;padding-left:10px;border-left:2px solid var(--line)}
.art{margin-top:16px;padding-top:14px;border-top:1px solid var(--line2)}
.art:first-of-type{border-top:0;padding-top:2px}
.art-h{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.art-h .dot{width:9px;height:9px;border-radius:99px;background:var(--c)}
.art-h h2{font-size:18px;font-weight:760;letter-spacing:-.02em}
.art-sub{font-size:12.5px;color:var(--muted);margin-top:4px}
.what{font-size:13.5px;line-height:1.6;margin-top:11px;color:var(--text)}
.art h3,.dbody h3{font-size:11.5px;font-weight:800;color:var(--muted);letter-spacing:.03em;margin:16px 0 7px;text-transform:none}
.vals{display:flex;flex-direction:column;gap:7px}
.v{background:var(--bg2);border:1px solid var(--line2);border-radius:10px;padding:8px 10px}
.vh{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.vh code{font-size:12px;font-weight:700;color:var(--accent);word-break:break-all}
.fmt{
  font-size:9.5px;font-weight:800;letter-spacing:.02em;color:var(--muted);
  background:var(--code-bg);border:1px solid var(--line2);border-radius:5px;padding:1px 5px;
  white-space:nowrap
}
.v p{font-size:12.5px;line-height:1.55;color:var(--text);margin-top:4px;opacity:.92}
ul.tips{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px}
ul.tips li{position:relative;padding-left:17px;font-size:13px;line-height:1.58}
ul.tips li::before{content:"›";position:absolute;left:3px;top:-1px;color:var(--accent);font-weight:800}
.relrow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:14px}
.relrow>span{font-size:10.5px;font-weight:800;color:var(--muted)}
.relrow button{
  font-size:11.5px;font-weight:650;color:var(--accent);background:var(--bg2);
  border:1px solid var(--line);border-radius:99px;padding:4px 9px
}
.gototree{
  display:flex;align-items:center;justify-content:center;gap:6px;width:100%;margin-top:16px;
  padding:11px;border-radius:11px;background:var(--accent);color:#fff;font-size:13px;font-weight:750
}
.childlist{margin-top:14px;display:flex;flex-direction:column;gap:6px}
.childlist .cl-h{font-size:10.5px;font-weight:800;color:var(--muted)}
.childlist button{
  display:flex;align-items:center;gap:8px;text-align:left;padding:8px 10px;border-radius:9px;
  background:var(--bg2);border:1px solid var(--line2);font-size:12.5px
}
.childlist button code{font-size:12px;flex:1;min-width:0;word-break:break-all}
.childlist button .cnt{font-size:9.5px;font-weight:800;color:var(--accent);background:var(--accent-soft);border-radius:99px;padding:1px 5px}
code.inl{background:var(--code-bg);border-radius:4px;padding:1px 4px;font-size:12px;word-break:break-word}

/* ---------- cheat sheet ---------- */
.sheet{display:flex;flex-direction:column;gap:12px;margin-top:6px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow-s)}
.panel h2{font-size:14px;font-weight:750;letter-spacing:-.01em;display:flex;align-items:center;gap:7px}
.panel h2 .em{color:var(--accent)}
.panel p.lead{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.5}
.hrow{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:9px 0;border-top:1px solid var(--line2);align-items:center}
.hrow:first-of-type{border-top:0}
.hrow .hl{grid-column:1 / -1;font-size:12px;font-weight:750;line-height:1.4;word-break:break-all}
.hrow .hf{grid-column:1;min-width:0;font-size:11px;color:var(--muted);line-height:1.45;word-break:break-all;font-family:ui-monospace,Menlo,monospace}
.hrow .cbtn{grid-column:2;grid-row:2;align-self:start}
.fmtcard{display:flex;gap:9px;padding:9px 0;border-top:1px solid var(--line2)}
.fmtcard:first-of-type{border-top:0;padding-top:2px}
.fmtcard .tag{
  flex:0 0 auto;font-size:10px;font-weight:800;color:var(--accent);background:var(--accent-soft);
  border-radius:6px;padding:3px 6px;height:fit-content;white-space:nowrap
}
.fmtcard .txt{font-size:12.5px;line-height:1.55;min-width:0}
.fmtcard .txt b{font-weight:700}
ol.steps{margin:6px 0 0;padding-left:18px;font-size:13px;line-height:1.6}
ol.steps li{margin-bottom:6px}
ol.steps li b{color:var(--accent)}
ul.traps{list-style:none;padding:0;margin:6px 0 0;display:flex;flex-direction:column;gap:8px}
ul.traps li{display:flex;gap:8px;font-size:12.5px;line-height:1.55}
ul.traps li .num{
  flex:0 0 auto;width:18px;height:18px;border-radius:99px;background:var(--account);color:#fff;
  font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:1px
}

/* ---------- misc ---------- */
.empty{padding:40px 16px;text-align:center;color:var(--muted);font-size:13px}
.empty .big{font-size:26px;margin-bottom:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:14px}
.chips button{font-size:12px;font-weight:650;color:var(--accent);background:var(--bg2);border:1px solid var(--line);border-radius:99px;padding:6px 11px}
.reshead .resline b{color:var(--text);font-size:13px;margin-right:1px}
.reshead{display:flex;align-items:center;gap:6px;margin:14px 0 2px;font-size:12px;color:var(--muted)}
mark{background:var(--accent-soft);color:inherit;border-radius:3px;padding:0 1px}
#toast{
  position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translate(-50%,16px);
  background:#111827;color:#fff;font-size:12.5px;font-weight:650;padding:9px 15px;border-radius:99px;
  box-shadow:0 8px 24px rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:90;white-space:nowrap
}
#toast.show{opacity:1;transform:translate(-50%,0)}
.foot{font-size:10.5px;color:var(--muted);text-align:center;padding:18px 10px calc(28px + env(safe-area-inset-bottom));line-height:1.6}
[hidden]{display:none!important}
</style>
</head>
<body>

<header class="brand">
  <div class="wrap">
    <div class="brandrow">
      <div class="logo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8h6l2-2h10v11H3z"></path><path d="M8 12h8M8 15h5"></path></svg></div>
      <div class="brandtxt">
        <h1>레지스트리 포렌식 탐색기</h1>
        <p>디지털포렌식 2급 실기 · 경로·값 형식·실기 팁</p>

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

ART.forEach(a=>{ART_BY_ID[a.id]=a;});

const md = s => esc(s).replace(/`([^`]+)`/g,'<code class="inl">$1</code>');
const bt = s => String(s).replace(/`([^`]+)`/g,'<code class="inl">$1</code>');

function hiveOf(p){
  if(p.startsWith('HKLM\\SYSTEM')) return {key:'HKLM\\SYSTEM', label:'HKLM\\SYSTEM', file:'C:\\Windows\\System32\\config\\SYSTEM'};
  if(p.startsWith('HKLM\\SOFTWARE')) return {key:'HKLM\\SOFTWARE', label:'HKLM\\SOFTWARE', file:'C:\\Windows\\System32\\config\\SOFTWARE'};
  if(p.startsWith('HKLM\\SAM')) return {key:'HKLM\\SAM', label:'HKLM\\SAM', file:'C:\\Windows\\System32\\config\\SAM'};
  if(p.startsWith('UsrClass.dat')) return {key:'UsrClass.dat', label:'UsrClass.dat', file:'C:\\Users\\{계정}\\AppData\\Local\\Microsoft\\Windows\\UsrClass.dat'};
  if(p.startsWith('Amcache.hve')) return {key:'Amcache.hve', label:'Amcache.hve', file:'C:\\Windows\\AppCompat\\Programs\\Amcache.hve'};
  if(p.startsWith('HKCU')) return {key:'HKCU', label:'HKCU (NTUSER.DAT)', file:'C:\\Users\\{계정}\\NTUSER.DAT'};
  return {key:'', label:'', file:''};
}

function copyText(text, done){
  const fallback = () => {
    try{
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position='fixed'; ta.style.top='0'; ta.style.opacity='0';
      document.body.appendChild(ta);
      ta.focus(); ta.select(); ta.setSelectionRange(0, text.length);
      const ok = document.execCommand('copy');
      document.body.removeChild(ta);
      toast(ok ? '경로를 복사했어요' : '복사 실패 — 길게 눌러 선택하세요');
    }catch(e){ toast('복사 실패 — 길게 눌러 선택하세요'); }
    if(done) done();
  };
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text).then(()=>{toast('경로를 복사했어요'); if(done) done();}, fallback);
  } else fallback();
}

let toastT;
function toast(msg){
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastT);
  toastT = setTimeout(()=>t.classList.remove('show'), 1700);
}

const state = {view:'evidence', cat:'all', q:'', sel:null, open:new Set(['HKLM','HKLM\\SYSTEM','HKLM\\SYSTEM\\CurrentControlSet','HKCU','HKCU\\Software'])};

function setView(v){
  state.view = v;
  $('#view-evidence').hidden = v!=='evidence';
  $('#view-tree').hidden = v!=='tree';
  $('#view-cheat').hidden = v!=='cheat';
  $('#view-search').hidden = !(state.q && v!=='cheat');
  if(state.q && v!=='cheat') $('#view-evidence').hidden = true, $('#view-tree').hidden = true;
  $('#tab-evidence').classList.toggle('on', v==='evidence');
  $('#tab-tree').classList.toggle('on', v==='tree');
  $('#tab-cheat').classList.toggle('on', v==='cheat');
  ['tab-evidence','tab-tree','tab-cheat'].forEach(id=>{
    document.getElementById(id).setAttribute('aria-selected', document.getElementById(id).classList.contains('on')?'true':'false');
  });
  window.scrollTo(0,0);
}
$('#tab-evidence').onclick = ()=>{clearSearch(); setView('evidence');};
$('#tab-tree').onclick = ()=>{clearSearch(); setView('tree');};
$('#tab-cheat').onclick = ()=>{clearSearch(); setView('cheat');};

function pillHtml(cat, label, n){
  return `<button class="pill ${state.cat===cat?'on':''}" data-cat="${cat}" data-pill="${cat}">
    ${cat!=='all'?'<i class="pdot"></i>':''}${label}<span class="n">${n}</span></button>`;
}
function renderPills(){
  const counts = {all:ART.length};
  CAT_ORDER.forEach(c=>counts[c]=ART.filter(a=>a.cat===c).length);
  $('#pills').innerHTML = pillHtml('all','전체',counts.all) + CAT_ORDER.map(c=>pillHtml(c,CATS[c].label,counts[c])).join('');
}
$('#pills').addEventListener('click', e=>{
  const b = e.target.closest('[data-pill]');
  if(!b) return;
  state.cat = b.dataset.pill;
  renderPills(); renderEvidence();
});

function cardHtml(a, withCat){
  const h = hiveOf(a.path);
  return `<div class="card" role="button" tabindex="0" data-open="${a.id}" style="--c:var(--${a.cat})">
    <div class="card-top">
      <span class="dot"></span>
      <h3>${esc(a.title)}</h3>
      ${a.hot?'<span class="hot">단골</span>':''}
    </div>
    <p class="card-sub">${esc(a.sub)}</p>
    <div class="pathrow">
      <code>${esc(a.path)}</code>
      <span class="cbtn" data-copy="${esc(a.path)}" role="button" tabindex="0" aria-label="경로 복사">복사</span>
    </div>
    <div class="card-foot">
      ${withCat?`<span>${CATS[a.cat].short}</span><span>·</span>`:''}<span>값 ${a.values.length}</span><span>·</span><span>팁 ${a.tips.length}</span>
      <span class="more">자세히 ›</span>
    </div>
  </div>`;
}

function renderEvidence(){
  const list = state.cat==='all' ? ART : ART.filter(a=>a.cat===state.cat);
  let html = '';
  CAT_ORDER.forEach(c=>{
    const items = list.filter(a=>a.cat===c);
    if(!items.length) return;
    html += `<section class="group" style="--c:var(--${c})">
      <div class="group-h"><i class="gdot"></i><h2>${CATS[c].label}</h2><span class="gcount">${items.length}개</span></div>
      <div class="cards">${items.map(cardHtml).join('')}</div>
    </section>`;
  });
  if(!html) html = `<div class="empty"><div class="big">🔍</div>해당 카테고리에 아티팩트가 없어요.</div>`;
  $('#evidenceList').innerHTML = html;
}

/* =========================================================
   검색
   ========================================================= */
const HAY = ART.map(a=>({
  id:a.id,
  text:[a.title,a.sub,a.path,a.what,CATS[a.cat].label,
    ...a.values.map(v=>v.n+' '+v.t+' '+v.d),
    ...a.tips].join(' ').toLowerCase()
}));
const HAY_BY_ID = {}; HAY.forEach(h=>HAY_BY_ID[h.id]=h.text);

function hl(text, q){
  const s = esc(text);
  if(!q) return s;
  const lower = text.toLowerCase(), ql = q.toLowerCase();
  let out='', i=0, idx;
  while((idx = lower.indexOf(ql, i)) !== -1){
    out += esc(text.slice(i, idx)) + '<mark>' + esc(text.slice(idx, idx+ql.length)) + '</mark>';
    i = idx + ql.length;
  }
  return out + esc(text.slice(i));
}

function runSearch(q){
  const ql = q.trim().toLowerCase();
  if(!ql){ clearSearch(); return; }
  state.q = q;
  const hits = HAY.filter(h=>h.text.includes(ql)).map(h=>ART_BY_ID[h.id]);
  $('#resCount').textContent = hits.length;
  $('#resQ').textContent = `"${q}"`;
  $('#searchList').innerHTML = hits.length
    ? hits.map(a=>cardHtml(a,true)).join('')
    : `<div class="empty"><div class="big">🤔</div>검색 결과가 없어요.<div class="chips">
        <button data-suggest="USB">USB</button><button data-suggest="UserAssist">UserAssist</button>
        <button data-suggest="FILETIME">FILETIME</button><button data-suggest="Shellbags">Shellbags</button>
        <button data-suggest="로그온">로그온</button></div></div>`;
  // 하이라이트: 제목/경로
  if(hits.length){
    document.querySelectorAll('#searchList .card').forEach(card=>{
      const id = card.dataset.open, a = ART_BY_ID[id];
      const h3 = card.querySelector('h3'); if(h3) h3.innerHTML = hl(a.title, q.trim());
      const code = card.querySelector('.pathrow code'); if(code) code.innerHTML = hl(a.path, q.trim());
    });
  }
  $('#view-evidence').hidden = true;
  $('#view-tree').hidden = true;
  $('#view-cheat').hidden = true;
  $('#view-search').hidden = false;
  $('#searchbox').classList.add('has');
}

function clearSearch(){
  if(!state.q && !$('#q').value) { $('#searchbox').classList.remove('has'); return; }
  state.q = '';
  $('#q').value = '';
  $('#searchbox').classList.remove('has');
  $('#view-search').hidden = true;
  if(state.view!=='cheat'){ 
    $('#view-evidence').hidden = state.view!=='evidence';
    $('#view-tree').hidden = state.view!=='tree';
  }
  $('#tab-evidence').classList.toggle('on', state.view==='evidence');
  $('#tab-tree').classList.toggle('on', state.view==='tree');
  $('#tab-cheat').classList.toggle('on', state.view==='cheat');
}

let searchT;
$('#q').addEventListener('input', e=>{
  clearTimeout(searchT);
  const v = e.target.value;
  searchT = setTimeout(()=>{
    if(!v.trim()){ clearSearch(); return; }
    runSearch(v);
  }, 90);
});
$('#qClear').onclick = ()=>{ clearSearch(); $('#q').blur(); };
$('#view-search').addEventListener('click', e=>{
  const s = e.target.closest('[data-suggest]');
  if(s){ $('#q').value = s.dataset.suggest; runSearch(s.dataset.suggest); }
});

/* =========================================================
   트리
   ========================================================= */
const nodes = new Map();
function ensure(path){
  if(nodes.has(path)) return nodes.get(path);
  const i = path.lastIndexOf('\\');
  const parent = i<0 ? null : path.slice(0,i);
  const n = {path, name: i<0?path:path.slice(i+1), parent, children:[], ids:[]};
  nodes.set(path, n);
  if(parent) ensure(parent).children.push(n);
  return n;
}
ART.forEach(a=>{ ensure(a.path).ids.push(a.id); });

function descCount(n){
  let c = n.ids.length;
  n.children.forEach(k=>{ c += descCount(k); });
  return c;
}
const DESC = new Map();
nodes.forEach(n=>DESC.set(n.path, descCount(n)));

const roots = [...nodes.values()].filter(n=>n.parent===null);
const ROOT_ORDER = ['HKLM','HKLM\\SYSTEM','HKLM\\SOFTWARE','HKLM\\SAM','HKLM\\SECURITY','HKCU','HKCU\\Software','UsrClass.dat','Amcache.hve'];
const rank = p => { const i = ROOT_ORDER.indexOf(p); return i<0?99:i; };
roots.sort((a,b)=>rank(a.path)-rank(b.path) || a.path.localeCompare(b.path));

function sortTree(n){
  n.children.sort((a,b)=>rank(a.path)-rank(b.path) || a.name.localeCompare(b.name,'en',{numeric:true,sensitivity:'base'}));
  n.children.forEach(sortTree);
}
roots.forEach(sortTree);

function nodeHtml(n, depth){
  const isRoot = depth===0;
  const meta = isRoot ? ROOT_META[n.path] : null;
  const name = meta ? meta.label : n.name;
  const hasKids = n.children.length>0;
  const cnt = n.ids.length;
  const desc = DESC.get(n.path)||0;
  return `<li>
    <div class="row ${isRoot?'rootrow':''} ${state.sel===n.path?'sel':''} ${hasKids?'':'nochild'}" data-path="${esc(n.path)}" role="button" tabindex="0">
      ${hasKids
        ? `<button class="tw" aria-expanded="${state.open.has(n.path)?'true':'false'}" data-tw="${esc(n.path)}" aria-label="펼치기">▶</button>`
        : `<span class="tw leaf">•</span>`}
      <span class="kname">${esc(name)}${meta?`<span class="rhint">${esc(meta.hint)}</span>`:''}</span>
      ${cnt?`<span class="cnt">${cnt}</span>`:(desc?'<span class="has"></span>':'')}
    </div>
    ${hasKids?`<ul class="children" ${state.open.has(n.path)?'':'hidden'}>${n.children.map(c=>nodeHtml(c,depth+1)).join('')}</ul>`:''}
  </li>`;
}

function renderTree(){
  $('#tree').innerHTML = `<ul>${roots.map(n=>nodeHtml(n,0)).join('')}</ul>`;
}

$('#tree').addEventListener('click', e=>{
  const tw = e.target.closest('[data-tw]');
  if(tw){
    e.stopPropagation();
    const p = tw.dataset.tw;
    if(state.open.has(p)) state.open.delete(p); else state.open.add(p);
    const li = tw.closest('li');
    const ul = li.querySelector(':scope > ul.children');
    if(ul) ul.hidden = !state.open.has(p);
    tw.setAttribute('aria-expanded', state.open.has(p)?'true':'false');
    return;
  }
  const row = e.target.closest('[data-path]');
  if(row) selectPath(row.dataset.path, true);
});
$('#tree').addEventListener('keydown', e=>{
  if(e.key!=='Enter' && e.key!==' ') return;
  const row = e.target.closest('[data-path]');
  if(row){ e.preventDefault(); selectPath(row.dataset.path, true); }
});

$('#expandAll').onclick = ()=>{
  nodes.forEach(n=>state.open.add(n.path));
  renderTree();
  if(state.sel) scrollToSel();
};
$('#collapseAll').onclick = ()=>{
  state.open.clear();
  renderTree();
};

function expandTo(path){
  let p = path, guard=0;
  while(p && guard++<40){
    state.open.add(p);
    const i = p.lastIndexOf('\\');
    p = i<0?null:p.slice(0,i);
  }
}
function scrollToSel(){
  const row = document.querySelector('.row.sel');
  if(row) row.scrollIntoView({block:'nearest'});
}

function highlightPath(path){
  document.querySelectorAll('.row.sel').forEach(r=>r.classList.remove('sel'));
  const row = [...document.querySelectorAll('.row')].find(r=>r.dataset.path===path);
  if(row) row.classList.add('sel');
}

function selectPath(path, scroll){
  state.sel = path;
  expandTo(path);
  renderTree();
  highlightPath(path);
  // 펼침 상태 반영
  document.querySelectorAll('[data-tw]').forEach(tw=>{
    const on = state.open.has(tw.dataset.tw);
    tw.setAttribute('aria-expanded', on?'true':'false');
    const ul = tw.closest('li').querySelector(':scope > ul.children');
    if(ul) ul.hidden = !on;
  });
  openNodeDetail(path);
  if(scroll){
    const row = [...document.querySelectorAll('.row')].find(r=>r.dataset.path===path);
    if(row) row.scrollIntoView({block:'nearest'});
  }
}

/* =========================================================
   상세 패널
   ========================================================= */
function pathBox(path){

function artBlock(a, opts){
  const h = hiveOf(a.path);
  const o = opts || {};
  const showPath = o.showPath !== false;
  const showFile = o.showFile !== false;
  return `<section class="art" style="--c:var(--${a.cat})">
    <div class="art-h">
      <span class="dot"></span><h2>${esc(a.title)}</h2>

    <h3>확인할 값 · 데이터 형식</h3>
    <div class="vals">
      ${a.values.map(v=>`<div class="v"><div class="vh"><code>${esc(v.n)}</code><span class="fmt">${esc(v.t)}</span></div><p>${md(v.d)}</p></div>`).join('')}

function openArtifact(id){
  const a = ART_BY_ID[id];
  if(!a) return;
  const h = hiveOf(a.path);
  $('#dScroll').innerHTML = `<div class="dbody">
    <span class="hivechip">${esc(h.label)}</span>
    ${artBlock(a,{showPath:true})}
    <button class="gototree" data-goto="${a.id}">하이브 트리에서 이 위치 보기 →</button>
  </div>`;
  $('#dScroll').scrollTop = 0;
  openSheet();
}

function descendantsOf(n, out){
  out = out || [];
  n.children.forEach(k=>{ k.ids.forEach(id=>out.push(ART_BY_ID[id])); descendantsOf(k,out); });
  return out;
}
function descArtsHtml(n){
  const list = descendantsOf(n).filter((a,i,arr)=>arr.indexOf(a)===i);
  if(!list.length) return '';
  return `<div class="childlist"><div class="cl-h">이 아래 아티팩트 ${list.length}개 · 눌러서 보기</div>
    ${list.slice(0,9).map(a=>`<button data-open="${a.id}"><span style="flex:0 0 auto;width:7px;height:7px;border-radius:99px;background:var(--${a.cat})"></span><code style="font-family:inherit">${esc(a.title)}</code><span class="cnt">보기</span></button>`).join('')}
  </div>`;
}

function openNodeDetail(path){
  const n = nodes.get(path);
  if(!n) return;
  const h = hiveOf(path);
  const arts = n.ids.map(id=>ART_BY_ID[id]);
  const meta = ROOT_META[path];
  const kids = n.children;
  const single = arts.length===1 && arts[0].title===n.name;
  let html = `<div class="dbody">
    ${h.label?`<span class="hivechip">${esc(h.label)}</span>`:''}
    ${single?'':`<h2 class="nodeh2">${esc(meta?meta.label:n.name)}</h2>`}
    ${pathBox(path)}
    ${h.file && path!=='HKLM' ? fileLine(h.file) : ''}
    ${meta?`<p class="note">${md(meta.note)}</p>`:''}
    ${arts.length ? arts.map(a=>artBlock(a,{showPath:false,showFile:false})).join('') : `<p class="what">${kids.some(k=>DESC.get(k.path))?'이 키 아래에 아티팩트가 있어요. 아래 목록에서 눌러 확인하세요.':'이 키 자체는 핵심 아티팩트 위치가 아니에요.'}</p>${descArtsHtml(n)}`}
    ${kids.length?`<div class="childlist"><div class="cl-h">하위 키 ${kids.length}개</div>
      ${kids.slice(0,14).map(k=>`<button data-path-nav="${esc(k.path)}"><code>${esc(k.name)}</code>${k.ids.length?`<span class="cnt">${k.ids.length}</span>`:''}</button>`).join('')}
    </div>`:''}
  </div>`;
  $('#dScroll').innerHTML = html;
  $('#dScroll').scrollTop = 0;
  openSheet();
}

function openSheet(){
  const d = $('#detail');
  d.classList.add('open');
  d.setAttribute('aria-hidden','false');
  d.style.transform='';
}
function closeSheet(){
  const d = $('#detail');
  d.classList.remove('open');
  d.setAttribute('aria-hidden','true');
  d.style.transform='';
}
$('#dClose').onclick = closeSheet;
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeSheet(); });

/* 바텀시트 스와이프 다운 */
(function(){
  const d = $('#detail'), h = $('#handle');
  let sy=0, dy=0, dragging=false;
  const start = e=>{
    if(window.innerWidth>=900) return;
    dragging=true; sy = (e.touches?e.touches[0].clientY:e.clientY); dy=0;
    d.style.transition='none';
  };
  const move = e=>{
    if(!dragging) return;
    const y = (e.touches?e.touches[0].clientY:e.clientY);
    dy = Math.max(0, y - sy);
    d.style.transform = `translateY(${dy}px)`;
  };
  const end = ()=>{
    if(!dragging) return;
    dragging=false;
    d.style.transition='';
    if(dy>110){ closeSheet(); } else { d.style.transform=''; }
  };
  h.addEventListener('touchstart', start, {passive:true});
  h.addEventListener('touchmove', move, {passive:true});
  h.addEventListener('touchend', end);
  h.addEventListener('mousedown', start);
  window.addEventListener('mousemove', move);
  window.addEventListener('mouseup', end);
})();

    return;
  }
  const nav = e.target.closest('[data-path-nav]');
  if(nav){ selectPath(nav.dataset.pathNav, true); }
});

      <ul class="traps">${traps.map((t,i)=>`<li><span class="num">${i+1}</span><span>${bt(t)}</span></li>`).join('')}</ul>
    </section>`;
}

/* =========================================================
   테마
   ========================================================= */
function applyTheme(t){
  if(t==='light'||t==='dark') document.documentElement.setAttribute('data-theme',t);
  else document.documentElement.removeAttribute('data-theme');
}
let theme = null;
try{ theme = localStorage.getItem('rfx-theme'); }catch(e){}
if(theme) applyTheme(theme);
$('#themeBtn').onclick = ()=>{
  const cur = document.documentElement.getAttribute('data-theme')
    || (window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
  const next = cur==='dark'?'light':'dark';
  applyTheme(next);
  try{ localStorage.setItem('rfx-theme', next); }catch(e){}
  toast(next==='dark'?'다크 모드':'라이트 모드');
};

   시작
   ========================================================= */
renderPills();
renderEvidence();
renderTree();
renderCheat();
setView('evidence');
</script>
