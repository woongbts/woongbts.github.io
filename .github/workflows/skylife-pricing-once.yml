name: Skylife pricing once

on:
  push:
    branches: [tmp-skylife-20260921-work]
    paths:
      - '.github/workflows/skylife-pricing-once.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Skylife pricing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re

          path = Path('data/internet.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          products = {p['id']: p for p in data.get('internet_products', [])}

          direct = {
              'INT-SKYLIFE-INTERNET_100M_REGULAR': ('sky WiFi 100M · 다이렉트 요금제', 24200),
              'INT-SKYLIFE-INTERNET_GIGA_200M_REGULAR': ('sky WiFi 200M · 다이렉트 요금제', 25300),
              'INT-SKYLIFE-INTERNET_GIGA_500M': ('sky WiFi 500M · 다이렉트 요금제', 30800),
              'INT-SKYLIFE-INTERNET_GIGA_1G': ('sky WiFi 1G · 다이렉트 요금제', 36300),
          }
          for pid, (name, fee) in direct.items():
              p = products[pid]
              p['name'] = name
              p['monthly_fee'] = fee

          # 30% 요금할인 번들은 빨간 표시된 IPTV 베이직 100M/200M만 반영.
          bundle30 = {
              'INT-SKYLIFE-INTERNET_100M': ('sky WiFi 100M · 30% 요금할인 번들 (IPTV 베이직)', 15400),
              'INT-SKYLIFE-INTERNET_GIGA_200M': ('sky WiFi 200M · 30% 요금할인 번들 (IPTV 베이직)', 16500),
          }
          for pid, (name, fee) in bundle30.items():
              p = products[pid]
              p['name'] = name
              p['monthly_fee'] = fee
              p['product_group'] = 'BUNDLE30'

          data.setdefault('meta', {})['updated_at'] = '2026-09-21'
          data['meta']['skylife_note'] = (
              '스카이라이프는 빨간 표시된 상품만 반영. '
              '다이렉트 단독요금은 100M 24,200원, 200M 25,300원, 500M 30,800원, 1G 36,300원. '
              '일반 IPTV 베이직 결합은 인터넷+TV 자동결합 5,500원 할인을 반영해 '
              '100M 34,100원, 200M 35,200원, 500M 40,700원, 1G 46,200원. '
              '30% 요금할인 번들은 IPTV 베이직 100M 25,300원, 200M 26,400원이며 고객사은품은 미지급.'
          )
          path.write_text(json.dumps(data, ensure_ascii=False, separators=(',', ':')) + '\n', encoding='utf-8')

          src_path = Path('src/rates.js')
          src = src_path.read_text(encoding='utf-8')

          old = 'SKYLIFE:{settopNames:["지니TV STB A"],fallbackSettopFee:3300,internetDiscount:0,tvDiscount:0}'
          new = 'SKYLIFE:{settopNames:["지니TV STB A"],fallbackSettopFee:3300,internetDiscount:5500,tvDiscount:0}'
          if old not in src:
              raise SystemExit('SKYLIFE bundle config marker not found')
          src = src.replace(old, new, 1)

          old = 'bundle30:{none:{100:10,200:12},tv:{}}'
          new = 'bundle30:{none:{100:0,200:0},tv:{TV_IPIT_BASIC:{100:0,200:0}}}'
          if old not in src:
              raise SystemExit('SKYLIFE bundle30 gift marker not found')
          src = src.replace(old, new, 1)

          old = 'function cn(t){return n(t)?`최대 ${e(1e4*Number(t))}`:"매장 확인"}'
          new = 'function cn(t){return n(t)?0===Number(t)?"미지급":`최대 ${e(1e4*Number(t))}`:"매장 확인"}'
          if old not in src:
              raise SystemExit('gift formatter marker not found')
          src = src.replace(old, new, 1)

          old = 'function mn(){dn(It,"wired"),dn(Kt,"mobile"),hn()}'
          new = 'function mn(){const e=Gt();"SKYLIFE"===e?.provider_id&&"BUNDLE30"===String(e?.product_group||"").toUpperCase()&&(At.value="TV-SKYLIFE-TV_IPIT_BASIC"),dn(It,"wired"),dn(Kt,"mobile"),hn()}'
          if old not in src:
              raise SystemExit('wired refresh marker not found')
          src = src.replace(old, new, 1)

          src, count = re.subn(r'data/internet\.json\?v=\d{8}-\d+', 'data/internet.json?v=20260921-6', src, count=1)
          if count != 1:
              raise SystemExit('internet cache marker not found or duplicated')
          src_path.write_text(src, encoding='utf-8')

          rates_path = Path('rates.html')
          html = rates_path.read_text(encoding='utf-8')
          html, count = re.subn(r'assets/rates\.min\.js\?v=\d{8}-\d+', 'assets/rates.min.js?v=20260921-6', html, count=1)
          if count != 1:
              raise SystemExit('rates asset cache marker not found or duplicated')
          rates_path.write_text(html, encoding='utf-8')

          # 이미지 기준 검증
          tv_basic = 12100
          settop = 3300
          combo_discount = 5500
          assert 24200 == direct['INT-SKYLIFE-INTERNET_100M_REGULAR'][1]
          assert 24200 + tv_basic + settop - combo_discount == 34100
          assert 25300 + tv_basic + settop - combo_discount == 35200
          assert 30800 + tv_basic + settop - combo_discount == 40700
          assert 36300 + tv_basic + settop - combo_discount == 46200
          assert 15400 + tv_basic + settop - combo_discount == 25300
          assert 16500 + tv_basic + settop - combo_discount == 26400
          PY

      - name: Rebuild production rates asset
        run: python .github/scripts/build_rates_asset.py

      - name: Validate site
        shell: bash
        run: |
          python -m json.tool data/internet.json >/dev/null
          node --check src/rates.js
          node --check assets/rates.min.js
          python .github/scripts/build_rates_asset.py --check
          python .github/scripts/validate_site.py
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('data/internet.json').read_text(encoding='utf-8'))
          p={x['id']:x for x in data['internet_products']}
          assert p['INT-SKYLIFE-INTERNET_100M_REGULAR']['monthly_fee']==24200
          assert p['INT-SKYLIFE-INTERNET_GIGA_200M_REGULAR']['monthly_fee']==25300
          assert p['INT-SKYLIFE-INTERNET_GIGA_500M']['monthly_fee']==30800
          assert p['INT-SKYLIFE-INTERNET_GIGA_1G']['monthly_fee']==36300
          assert p['INT-SKYLIFE-INTERNET_100M']['monthly_fee']==15400
          assert p['INT-SKYLIFE-INTERNET_GIGA_200M']['monthly_fee']==16500
          src=Path('src/rates.js').read_text(encoding='utf-8')
          assert 'SKYLIFE:{settopNames:["지니TV STB A"],fallbackSettopFee:3300,internetDiscount:5500,tvDiscount:0}' in src
          assert 'bundle30:{none:{100:0,200:0},tv:{TV_IPIT_BASIC:{100:0,200:0}}}' in src
          assert '0===Number(t)?"미지급"' in src
          print('Skylife pricing checks OK')
          PY

      - name: Commit update and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/skylife-pricing-once.yml
          git config user.name 'woongbts'
          git config user.email 'swb3301@gmail.com'
          git add -A
          git commit -m 'Update Skylife direct and 30 percent bundle pricing'
          git push origin HEAD:tmp-skylife-20260921-work
