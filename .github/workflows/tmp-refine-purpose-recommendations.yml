name: Refine purpose recommendations

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-refine-purpose-recommendations.yml'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply refinements
        run: python tmp_refine_purpose_recommendations.py
      - name: Check JavaScript syntax
        run: node --check assets/rates.js
      - name: Check duplicate HTML ids
        run: python -c "import re, pathlib, collections; t=pathlib.Path('rates.html').read_text(encoding='utf-8'); ids=re.findall(r'id=\"([^\"]+)\"', t); d=[k for k,v in collections.Counter(ids).items() if v>1]; assert not d, d"
      - name: Commit result
        run: |
          git config user.name woongbts
          git config user.email swb3301@gmail.com
          git add assets/rates.js
          git commit -m "Refine current phone recommendation ordering"
          git push
