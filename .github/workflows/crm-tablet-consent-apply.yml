name: CRM tablet consent apply
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/crm-tablet-consent-apply.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch CRM files
        run: python3 .github/scripts/crm_tablet_consent_step1.py
      - name: Validate CRM
        working-directory: .github/crm
        run: npm install --ignore-scripts && npm run check && npm run build
      - name: Commit CRM changes and push with retry
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "woongbts"
          git config user.email "swb3301@gmail.com"
          git add .github/crm
          git commit -m "Add CRM tablet consent capture"

          for attempt in $(seq 1 30); do
            echo "Push attempt ${attempt}/30"
            git fetch origin main
            if ! git merge-base --is-ancestor origin/main HEAD; then
              git merge origin/main --no-edit
            fi
            if git push origin HEAD:main; then
              echo "Push succeeded"
              exit 0
            fi
            sleep 2
          done

          echo "Failed to push CRM changes after retries" >&2
          exit 1
