name: Diagnose quote API new-domain access
on:
  push:
    branches: [main]
    paths: ['.github/workflows/check-quote-origin-20261104.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Assert live official-domain API CORS preflight
        shell: bash
        run: |
          set -euo pipefail
          URL="https://woongbi-quote-api.woongbts.workers.dev"
          for origin in "https://woongbts.github.io" "https://woongbts.kr"; do
            for path in "recommend/purpose" "quote/mobile" "recommend/quick" "recommend/plans"; do
              code=$(curl -sS --max-time 15 -D /tmp/headers -o /dev/null -w '%{http_code}' -X OPTIONS "$URL/$path" \
                -H "Origin: $origin" -H "Access-Control-Request-Method: POST" \
                -H "Access-Control-Request-Headers: content-type")
              echo "$origin $path -> HTTP $code"
              test "$code" = 204
              grep -iq "^access-control-allow-origin: $origin" /tmp/headers
            done
          done
      - name: Check verified public catalog reachability
        shell: bash
        run: |
          set -euo pipefail
          for path in data/catalog.json data/plans.json data/supports.json; do
            code=$(curl -sSL --max-time 15 -o /dev/null -w "%{http_code}" "https://woongbts.kr/$path")
            echo "$path -> HTTP $code"
            test "$code" = 200
          done
