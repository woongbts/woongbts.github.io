name: Diagnose quote API new-domain access
on:
  push:
    branches: [main]
    paths: ['.github/workflows/check-quote-origin-20261104.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check API CORS preflight for old vs new domain
        shell: bash
        run: |
          set -euo pipefail
          URL="https://woongbi-quote-api.woongbts.workers.dev/recommend/purpose"
          for origin in "https://woongbts.github.io" "https://woongbts.kr"; do
            echo "Checking Origin: $origin"
            curl -sS --max-time 15 -D /tmp/headers -o /tmp/payload -X OPTIONS "$URL"               -H "Origin: $origin" -H "Access-Control-Request-Method: POST"               -H "Access-Control-Request-Headers: content-type" || true
            grep -iE '^HTTP/|^access-control-allow-origin:|^access-control-allow-methods:|^access-control-allow-headers:' /tmp/headers || true
          done
      - name: Check public catalog and support payload reachability
        shell: bash
        run: |
          for path in data/catalog.json data/plans.json data/supports.json; do
            printf "%s " "$path"
            curl --max-time 15 -sSL -o /dev/null -w "%{http_code} (%{size_download} bytes)\n" "https://woongbts.kr/$path"
          done
