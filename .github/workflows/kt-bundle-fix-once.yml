name: KT bundle fix once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kt-bundle-fix-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply KT mobile bundle correction
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          internet_path = Path('data/internet.json')
          data = json.loads(internet_path.read_text(encoding='utf-8'))
          rules = {rule['id']: rule for rule in data.get('bundle_rules', [])}

          updates = {
              'KT-TOTAL-100-L1': {
                  'discount': 1650,
                  'name': '총액결합 · 22,000원 미만 · 100M 1,650원 할인',
                  'notes': '모바일 월정액 합계 22,000원 미만 기준 · 인터넷 청구 1,650원 할인 · 휴대폰 청구 할인은 별도',
              },
              'KT-TOTAL-100-L2': {
                  'discount': 3300,
                  'name': '총액결합 · 22,000~64,899원 · 100M 3,300원 할인',
              },
              'KT-TOTAL-100-L3': {
                  'discount': 5500,
                  'name': '총액결합 · 64,900원 이상 · 100M 5,500원 할인',
              },
              'KT-TOTAL-500-L1': {
                  'discount': 2200,
                  'name': '총액결합 · 22,000원 미만 · 500M~1G 2,200원 할인',
                  'notes': '모바일 월정액 합계 22,000원 미만 기준 · 인터넷 청구 2,200원 할인 · 휴대폰 청구 할인은 별도',
              },
              'KT-TOTAL-500-L2': {
                  'discount': 5500,
                  'name': '총액결합 · 22,000원 이상 · 500M~1G 5,500원 할인',
              },
          }

          for rule_id, changes in updates.items():
              if rule_id not in rules:
                  raise SystemExit(f'missing bundle rule: {rule_id}')
              rules[rule_id].update(changes)

          data.setdefault('meta', {})['updated_at'] = '2026-09-21'
          data['meta']['mobile_bundle_note'] = (
              '인터넷/TV 청구서에 직접 적용되는 확인 가능한 할인만 자동 계산하며 휴대폰 청구 할인은 별도 안내한다. '
              'KT 총액결합은 모바일 월정액 합계 구간에 따라 100M 1,650/3,300/5,500원, '
              '500M~1G 2,200/5,500원 할인으로 구분한다.'
          )
          internet_path.write_text(json.dumps(data, ensure_ascii=False, separators=(',', ':')) + '\n', encoding='utf-8')

          src_path = Path('src/rates.js')
          src = src_path.read_text(encoding='utf-8')
          old_data_url = 'data/internet.json?v=20260916-2'
          new_data_url = 'data/internet.json?v=20260921-1'
          if old_data_url not in src:
              raise SystemExit('internet data cache key marker not found in src/rates.js')
          src_path.write_text(src.replace(old_data_url, new_data_url), encoding='utf-8')

          html_path = Path('rates.html')
          html = html_path.read_text(encoding='utf-8')
          old_script = 'assets/rates.min.js?v=20260919-8'
          new_script = 'assets/rates.min.js?v=20260921-1'
          if old_script not in html:
              raise SystemExit('rates script cache key marker not found in rates.html')
          html_path.write_text(html.replace(old_script, new_script), encoding='utf-8')

          # Exact values requested for the KT under-22,000-won mobile total tier.
          assert rules['KT-TOTAL-100-L1']['discount'] == 1650
          assert rules['KT-TOTAL-500-L1']['discount'] == 2200
          assert 23100 - rules['KT-TOTAL-100-L1']['discount'] == 21450
          assert 34100 - rules['KT-TOTAL-500-L1']['discount'] == 31900
          PY

      - name: Rebuild production rates asset
        run: python .github/scripts/build_rates_asset.py

      - name: Validate site
        run: |
          python -m json.tool data/internet.json >/dev/null
          node --check src/rates.js
          node --check assets/rates.min.js
          python .github/scripts/build_rates_asset.py --check
          python .github/scripts/validate_site.py

      - name: Commit correction and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/kt-bundle-fix-once.yml
          git config user.name 'woongbts'
          git config user.email 'swb3301@gmail.com'
          git add -A
          git commit -m 'Fix KT low-tier mobile bundle discounts'
          git push origin HEAD:main
