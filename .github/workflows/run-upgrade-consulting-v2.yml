name: run-upgrade-consulting-v2

on:
  push:
    paths:
      - '.github/workflows/run-upgrade-consulting-v2.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Extract and run consultation patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src=Path('.github/workflows/upgrade-consulting-v2.yml').read_text(encoding='utf-8')
          token="          python3 - <<'PY'\n"
          start=src.index(token)+len(token)
          end=src.index("\n          PY",start)
          block=src[start:end]
          lines=block.splitlines()
          block='\n'.join(line[10:] if line.startswith('          ') else line for line in lines)+'\n'
          block=block.replace('</div>\\\\n          <div class="rate-grid">','</div>\\n          <div class="rate-grid">')
          Path('/tmp/upgrade_consulting_v2.py').write_text(block,encoding='utf-8')
          PY
          python3 /tmp/upgrade_consulting_v2.py
          node --check assets/rates.js
          grep -q 'id="quick-recommend"' rates.html
          grep -q 'id="device-compare-results"' rates.html
          grep -q 'function restoreQuoteFromUrl' assets/rates.js
      - name: Commit consultation upgrade
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'woongbts-ui-sync'
          git config user.email 'actions@users.noreply.github.com'
          git add rates.html assets/rates.js assets/rates.css
          if git diff --cached --quiet; then echo 'No changes'; exit 0; fi
          git commit -m 'Add quick recommendations sharable quotes and device comparison'
          git pull --rebase origin main
          git push origin HEAD:main

