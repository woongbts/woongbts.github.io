name: CRM tablet consent step 1
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/crm-tablet-consent-step1.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch CRM files
        run: python3 .github/scripts/crm_tablet_consent_step1.py
      - name: Validate CRM
        working-directory: .github/crm
        run: npm install --ignore-scripts && npm run check && npm run build
      - name: Commit changes and push with retry
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "woongbts"
          git config user.email "swb3301@gmail.com"
          rm -f .github/workflows/crm-tablet-consent-step1.yml .github/scripts/crm_tablet_consent_step1.py
          git add -A
          git commit -m "Add CRM tablet consent capture"

          for attempt in $(seq 1 20); do
            echo "Push attempt ${attempt}/20"
            git fetch origin main
            if ! git merge-base --is-ancestor origin/main HEAD; then
              git merge origin/main --no-edit
            fi

            # Concurrent sync commits can reintroduce these temporary files from main.
            rm -f .github/workflows/crm-tablet-consent-step1.yml .github/scripts/crm_tablet_consent_step1.py
            git add -A
            if ! git diff --cached --quiet; then
              git commit -m "Clean CRM tablet consent temporary files"
            fi

            if git push origin HEAD:main; then
              echo "Push succeeded"
              exit 0
            fi
            sleep 3
          done

          echo "Failed to push after retries" >&2
          exit 1
