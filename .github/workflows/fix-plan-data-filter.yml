name: Fix plan data filter

on:
  push:
    branches: [main]
    paths:
      - 'scripts/fix-plan-data-filter.py'
      - '.github/workflows/fix-plan-data-filter.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply plan filter fix
        run: python scripts/fix-plan-data-filter.py
      - name: Commit updated calculator
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rates.html assets/rates.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Fix mobile plan data filtering"
            git push origin main
          fi
