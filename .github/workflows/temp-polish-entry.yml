name: Temporary entry polish

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-polish-entry.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare tools
        run: |
          python -m pip install --quiet pillow
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk

      - name: Apply changes
        run: python .github/scripts/temp_polish_entry.py

      - name: Validate JavaScript and output
        run: |
          node --check assets/site-pro.min.js
          node --check assets/ai-chat.min.js
          node --check assets/rates.min.js
          test ! -e assets/ai-chat.js
          ! grep -q 'assets/ai-chat.js?v=20260915-1' index.html
          grep -q 'href="/rates.html">요금 계산</a>' index.html
          grep -q 'woongbi-rates-og-20260918.jpg' rates.html
          python -c "from PIL import Image; im=Image.open('assets/woongbi-rates-og-20260918.jpg'); assert im.size==(1200,630); print(im.size, im.mode)"

      - name: Remove temporary files and commit
        run: |
          rm -f .github/workflows/temp-polish-entry.yml .github/scripts/temp_polish_entry.py
          git config user.name 'woongbts-site-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html rates.html assets/woongbi-rates-og-20260918.jpg .github/workflows/temp-polish-entry.yml .github/scripts/temp_polish_entry.py
          git commit -m 'Polish rate entry and sharing previews'
          git push origin HEAD:main
