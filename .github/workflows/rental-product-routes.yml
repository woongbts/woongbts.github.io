name: Build rental product routes

on:
  push:
    branches: [main]
    paths:
      - 'rental/product.html'
      - 'rental/data/products.json'
      - 'rental/assets/product-generic.js'
      - 'scripts/build-rental-product-routes.py'
      - '.github/workflows/rental-product-routes.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rental-product-routes
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate clean product routes
        run: python scripts/build-rental-product-routes.py
      - name: Commit generated routes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'woongbi-rental-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A rental/product
          if git diff --cached --quiet; then
            echo 'clean product routes are already current.'
            exit 0
          fi
          git commit -m 'Build clean rental product routes'
          git pull --rebase origin main
          git push
