name: Build rental SEO routes

on:
  push:
    branches: [main]
    paths:
      - 'rental/product.html'
      - 'rental/data/products.json'
      - 'rental/assets/product-generic.js'
      - 'scripts/build-rental-product-routes.py'
      - 'scripts/build-rental-category-pages.py'
      - 'rental/assets/category.css'
      - '.github/workflows/rental-product-routes.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rental-product-routes
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate clean product routes
        run: python scripts/build-rental-product-routes.py
      - name: Generate category SEO pages
        run: python scripts/build-rental-category-pages.py
      - name: Commit generated routes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'woongbi-rental-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A rental/product rental/water-purifier rental/air-purifier rental/bidet rental/mattress rental/massage-chair rental/laundry rental/refrigerator rental/tv-digital rental/aircon-cleaner rental/kitchen-appliance rental/home-appliance rental/health-beauty rental/furniture-bed rental/leisure-auto
          if git diff --cached --quiet; then
            echo 'rental SEO routes are already current.'
            exit 0
          fi
          git commit -m 'Build rental SEO routes'
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push; then
              exit 0
            fi
            echo "push raced with another main update; retrying ($attempt/4)"
            sleep $((attempt * 2))
          done
          echo "failed to push generated rental SEO routes after retries" >&2
          exit 1
