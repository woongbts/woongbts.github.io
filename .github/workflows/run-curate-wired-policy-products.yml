name: run-curate-wired-policy-products

on:
  push:
    paths:
      - '.github/workflows/run-curate-wired-policy-products.yml'

permissions:
  contents: write

jobs:
  curate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Remove internal-source wording from customer page
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('rates.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('고객 사은품은 2026-09-15 정책표의 경품가이드 ‘최대’ 기준(현금+상품권 합산)입니다. 지역·상품·설치 및 가입 조건, 정책 변동에 따라 실제 지급액은 달라질 수 있어 최종 상담 시 확인됩니다.', '고객사은품은 선택한 상품 기준 최대 금액이며 지역·상품·설치 및 가입 조건에 따라 실제 지급액은 달라질 수 있어 최종 상담 시 확인됩니다.')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Curate wired products and customer gifts
        run: python scripts/curate-wired-policy-products.py
      - name: Validate JSON and customer-facing internals
        run: |
          python -m json.tool data/internet.json >/dev/null
          grep -q 'SK텔레콤' data/internet.json
          grep -q 'TV_IPIT_CHOICE' assets/rates.js
          ! grep -q '경품가이드' rates.html
          ! grep -q '수수료(부가세별도)' rates.html
          ! grep -q '정책표' rates.html
      - name: Commit generated changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/internet.json assets/rates.js rates.html
          if git diff --cached --quiet; then
            echo 'No generated changes'
          else
            git commit -m 'Curate wired products to supplied customer tables'
            git push origin HEAD:main
          fi
