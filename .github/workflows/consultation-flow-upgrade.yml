name: Consultation flow upgrade

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/consultation-flow-upgrade.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply upgrade
        run: python3 tmp_consultation_flow_upgrade.py
      - name: Validate
        shell: bash
        run: |
          node --check assets/rates.js
          python3 - <<'PY'
          import re
          from pathlib import Path
          html=Path('rates.html').read_text(encoding='utf-8')
          ids=re.findall(r'\bid="([^"]+)"',html)
          dup=sorted({x for x in ids if ids.count(x)>1})
          if dup:
              raise SystemExit('duplicate ids: '+', '.join(dup))
          required=['copy-studyphone-quote','copy-mvno-quote','copy-prepaid-quote','plan-quick-shortcuts','wired-compare-tool']
          missing=[x for x in required if f'id="{x}"' not in html]
          if missing:
              raise SystemExit('missing required ids: '+', '.join(missing))
          PY
          if grep -Eq '판매점 수수료|리베이트|제로노트|정책표' rates.html; then
            echo 'Internal-facing wording remains in customer HTML'
            exit 1
          fi
      - name: Commit upgrade
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rates.html assets/rates.js assets/rates.css
          git diff --cached --check
          git commit -m 'Improve customer consultation flow'
          git push origin main
