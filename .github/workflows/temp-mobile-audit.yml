name: Temporary mobile audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-mobile-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Audit mobile catalog mappings
        shell: bash
        run: |
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          c=json.loads(Path('data/catalog.json').read_text(encoding='utf-8'))
          p=json.loads(Path('data/plans.json').read_text(encoding='utf-8'))
          devices=c.get('devices') or []
          plans=p.get('mobile_plans') or []
          planmap={x['id']:x for x in plans}
          print('DEVICES',len(devices),'PLANS',len(plans))
          print('\nLGU+ MOTOROLA-LIKE DEVICES')
          for d in devices:
              txt=' '.join(str(d.get(k) or '') for k in ('name','manufacturer','model','model_code')).lower()
              if d.get('carrier')=='LGU+' and any(x in txt for x in ('motorola','모토로라','moto ')):
                  print(json.dumps({k:d.get(k) for k in ('id','carrier','name','manufacturer','model_code','release_date','source_order')},ensure_ascii=False))
          targets=[
              ('SKT','스타일폴더2','T플랜 세이브'),
              ('SKT','Galaxy A17 LTE','T플랜 세이브'),
              ('KT','Galaxy A37 5G','베이직 4GB'),
              ('SKT','Galaxy 퀀텀7','라이트 39'),
          ]
          def norm(s): return re.sub(r'\s+','',str(s or '')).lower()
          for carrier,dname,pname in targets:
              print('\nTARGET',carrier,dname,'/',pname)
              ds=[d for d in devices if d.get('carrier')==carrier and norm(dname) in norm(d.get('name'))]
              if not ds:
                  # fall back to token/model-ish matching
                  toks=[x for x in re.split(r'[^0-9a-z가-힣]+',dname.lower()) if len(x)>1]
                  ds=[d for d in devices if d.get('carrier')==carrier and all(t in (' '.join(str(d.get(k) or '') for k in ('name','model','model_code')).lower()) for t in toks[-2:])]
              for d in ds[:8]:
                  print('DEVICE',json.dumps({k:d.get(k) for k in ('id','name','model_code','manufacturer','release_date','eligible_plan_ids_by_join_type')},ensure_ascii=False))
                  for join,ids in (d.get('eligible_plan_ids_by_join_type') or {}).items():
                      matches=[planmap[i] for i in ids if i in planmap and norm(pname) in norm(planmap[i].get('name'))]
                      print(' JOIN',join,'plan matches',[(x.get('id'),x.get('name'),x.get('monthly_fee'),x.get('source_order')) for x in matches[:8]])
          print('\nFIRST 25 LGU+ DEVICES')
          lg=sorted([d for d in devices if d.get('carrier')=='LGU+'],key=lambda d:(d.get('source_order',999999),d.get('name','')))
          for d in lg[:25]: print(d.get('source_order'),d.get('id'),d.get('name'),d.get('manufacturer'),d.get('model_code'))
          PY
