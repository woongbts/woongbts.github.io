name: Temporary mobile repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-mobile-audit.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply and validate mobile repairs
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/temp_mobile_repair_wrapper.py
          node --check assets/rates.min.js
          node --check assets/site-pro.min.js
          grep -q 'assets/rates.css?v=20260918-4' rates.html
          grep -q 'assets/rates.min.js?v=20260918-4' rates.html
          grep -q 'assets/site-pro.min.js?v=20260918-1' index.html
      - name: Publish and clean temporary files
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/temp-mobile-audit.yml .github/scripts/temp_mobile_repair.py .github/scripts/temp_mobile_repair_wrapper.py
          git config user.name 'woongbts-site-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -u
          git add assets/rates.min.js assets/rates.css assets/site-pro.min.js rates.html index.html
          git status --short
          git commit -m 'Repair mobile recommendations filters and calculator links'
          git push origin HEAD:main

# retry with verified current cache tokens
