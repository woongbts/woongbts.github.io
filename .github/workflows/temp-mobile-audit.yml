name: Temporary mobile audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-mobile-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Audit senior handset candidates
        shell: bash
        run: |
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          c=json.loads(Path('data/catalog.json').read_text(encoding='utf-8'))
          p=json.loads(Path('data/plans.json').read_text(encoding='utf-8'))
          devices=c.get('devices') or []
          plans={x['id']:x for x in (p.get('mobile_plans') or [])}
          wanted=[]
          for d in devices:
              txt=' '.join(str(d.get(k) or '') for k in ('name','manufacturer','model','model_code')).lower()
              if d.get('carrier')=='SKT' and any(x in txt for x in ('wide9','와이드9','buddy5','버디5','folder','폴더')):
                  wanted.append(d)
          for d in wanted:
              ids=(d.get('eligible_plan_ids_by_join_type') or {}).get('기기변경') or []
              tplan=[plans[i] for i in ids if i in plans and str(plans[i].get('name') or '').strip()=='T플랜 세이브']
              print(json.dumps({k:d.get(k) for k in ('id','carrier','name','model_code','manufacturer','release_date','retail_price','source_order')},ensure_ascii=False))
              print(' TPLAN',[(x.get('id'),x.get('monthly_fee')) for x in tplan])
          PY
