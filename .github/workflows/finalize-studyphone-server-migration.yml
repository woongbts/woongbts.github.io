name: Finalize studyphone server migration

on:
  push:
    branches:
      - hardening/server-only-studyphone
    paths:
      - '.github/scripts/finalize_studyphone_server_migration.mjs'
      - '.github/workflows/finalize-studyphone-server-migration.yml'

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/server-only-studyphone
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Finalize public studyphone server migration
        run: node .github/scripts/finalize_studyphone_server_migration.mjs
      - name: Validate finalized site source
        run: |
          node --check src/rates.js
          node --check assets/rates.min.js
          node --check assets/studyphone-api-bridge.min.js
          node --check sw.js
          python3 .github/scripts/build_rates_asset.py --check
          python3 .github/scripts/validate_site.py
          test ! -e data/studyphone.json
          grep -q 'studyphone-api-bridge.min.js' rates.html
          grep -q '/quote/studyphone' assets/studyphone-api-bridge.min.js
          ! grep -q 'installment_apr' src/rates.js
          ! grep -q 'public_support' src/rates.js
      - name: Commit finalized migration
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rates.html sw.js src/rates.js assets/rates.min.js assets/studyphone-api-bridge.min.js .github/scripts/validate_site.py .github/workflows/site-regression.yml data/studyphone.json
          git diff --cached --quiet && exit 0
          git commit -m 'Finalize server-owned studyphone quotes'
          git push origin HEAD:hardening/server-only-studyphone
