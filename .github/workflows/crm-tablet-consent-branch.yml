name: CRM tablet consent branch
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/crm-tablet-consent-branch.yml'
permissions:
  contents: write
jobs:
  branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch CRM files
        run: python3 .github/scripts/crm_tablet_consent_step1.py
      - name: Validate CRM
        working-directory: .github/crm
        run: npm install --ignore-scripts && npm run check && npm run build
      - name: Commit CRM changes to temporary branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "woongbts"
          git config user.email "swb3301@gmail.com"
          git add .github/crm
          git commit -m "Add CRM tablet consent capture"
          git push --force origin HEAD:refs/heads/crm-tablet-consent-step1
