name: One-time remove legacy 2G plans

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-legacy-2g-once.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remove legacy 2G plans and extend guards
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import pathlib
          import re

          legacy_2g_re = re.compile(r'(^|[^A-Za-z0-9])2G([^A-Za-z0-9]|$)', re.IGNORECASE)
          legacy_2g3g_re = re.compile(r'(^|[^A-Za-z0-9])[23]G([^A-Za-z0-9]|$)', re.IGNORECASE)

          def load(path):
              return json.loads(path.read_text(encoding='utf-8'))

          def dump(path, obj):
              path.write_text(json.dumps(obj, ensure_ascii=False, separators=(',', ':')), encoding='utf-8')

          plans_path = pathlib.Path('data/plans.json')
          catalog_path = pathlib.Path('data/catalog.json')
          supports_path = pathlib.Path('data/supports.json')

          plans = load(plans_path)
          mobile_plans = plans.get('mobile_plans') or []
          removed_plans = [
              plan for plan in mobile_plans
              if plan.get('id') and legacy_2g_re.search(str(plan.get('name') or ''))
          ]
          removed = {plan.get('id') for plan in removed_plans}
          if not removed:
              raise SystemExit('No legacy 2G plans found; refusing unexpected no-op')

          plans['mobile_plans'] = [plan for plan in mobile_plans if plan.get('id') not in removed]
          if isinstance(plans.get('meta'), dict):
              plans['meta']['updated_at'] = '2026-09-19'
          dump(plans_path, plans)

          catalog = load(catalog_path)
          for device in catalog.get('devices') or []:
              ids = device.get('eligible_plan_ids')
              if isinstance(ids, list):
                  device['eligible_plan_ids'] = [pid for pid in ids if pid not in removed]
              mapping = device.get('eligible_plan_ids_by_join_type')
              if isinstance(mapping, dict):
                  for join_type, join_ids in list(mapping.items()):
                      if isinstance(join_ids, list):
                          mapping[join_type] = [pid for pid in join_ids if pid not in removed]
          supports_inline = catalog.get('mobile_supports')
          if isinstance(supports_inline, list):
              catalog['mobile_supports'] = [row for row in supports_inline if row.get('plan_id') not in removed]
          if isinstance(catalog.get('meta'), dict):
              catalog['meta']['updated_at'] = '2026-09-19'
          dump(catalog_path, catalog)

          supports = load(supports_path)
          for schedule in supports.get('support_schedules') or []:
              amounts = schedule.get('amounts')
              if isinstance(amounts, dict):
                  schedule['amounts'] = {pid: amount for pid, amount in amounts.items() if pid not in removed}
          if isinstance(supports.get('meta'), dict):
              supports['meta']['updated_at'] = '2026-09-19'
          dump(supports_path, supports)

          # Future daily refresh: reject both retired 2G and 3G plan names.
          sync_path = pathlib.Path('.github/scripts/daily_wireless_sync.py')
          sync = sync_path.read_text(encoding='utf-8')
          sync = sync.replace(r'(^|[^a-z0-9])3g([^a-z0-9]|$)', r'(^|[^a-z0-9])[23]g([^a-z0-9]|$)')
          sync = sync.replace('legacy 3G plan leaked into public catalog', 'legacy 2G/3G plan leaked into public catalog')
          if r'(^|[^a-z0-9])[23]g([^a-z0-9]|$)' not in sync:
              raise SystemExit('daily sync legacy-network guard patch failed')
          sync_path.write_text(sync, encoding='utf-8')

          # Direct/quick calculator: reject 2G/3G even if stale browser data survives.
          for path_string in ('src/rates.js', 'assets/rates.min.js'):
              path = pathlib.Path(path_string)
              text = path.read_text(encoding='utf-8')
              text = text.replace(r'(^|[^a-z0-9])3g([^a-z0-9]|$)', r'(^|[^a-z0-9])[23]g([^a-z0-9]|$)')
              text = text.replace('data/plans.json?v=20260919-1', 'data/plans.json?v=20260919-2')
              if r'(^|[^a-z0-9])[23]g([^a-z0-9]|$)' not in text:
                  raise SystemExit(f'calculator legacy-network guard patch failed: {path_string}')
              path.write_text(text, encoding='utf-8')

          # Purpose recommendation v2: same 2G/3G rejection.
          rec_path = pathlib.Path('assets/recommendation-engine-v2.js')
          rec = rec_path.read_text(encoding='utf-8')
          rec = rec.replace(r'(^|[^a-z0-9])3g([^a-z0-9]|$)', r'(^|[^a-z0-9])[23]g([^a-z0-9]|$)')
          rec = rec.replace('data/plans.json?v=20260919-1', 'data/plans.json?v=20260919-2')
          if r'(^|[^a-z0-9])[23]g([^a-z0-9]|$)' not in rec:
              raise SystemExit('recommendation legacy-network guard patch failed')
          rec_path.write_text(rec, encoding='utf-8')

          # Regression guard: no retired 2G/3G plan name may return.
          validator_path = pathlib.Path('.github/scripts/validate_site.py')
          validator = validator_path.read_text(encoding='utf-8')
          validator = validator.replace('# Legacy 3G plans are retired and must never return to customer-facing data.', '# Legacy 2G/3G plans are retired and must never return to customer-facing data.')
          validator = validator.replace('legacy_3g_plans', 'legacy_2g_3g_plans')
          validator = validator.replace(r'(^|[^a-z0-9])3g([^a-z0-9]|$)', r'(^|[^a-z0-9])[23]g([^a-z0-9]|$)')
          validator = validator.replace('legacy 3G plans leaked', 'legacy 2G/3G plans leaked')
          if 'legacy_2g_3g_plans' not in validator or r'(^|[^a-z0-9])[23]g([^a-z0-9]|$)' not in validator:
              raise SystemExit('site validator legacy-network guard patch failed')
          validator_path.write_text(validator, encoding='utf-8')

          # Cache-bust updated customer assets.
          rates_html_path = pathlib.Path('rates.html')
          rates_html = rates_html_path.read_text(encoding='utf-8')
          rates_html = re.sub(r'(assets/rates\.min\.js\?v=)[^"\']+', r'\g<1>20260919-2', rates_html)
          rates_html = re.sub(r'(recommendation-engine-v2\.js\?v=)[^"\']+', r'\g<1>20260919-2', rates_html)
          rates_html_path.write_text(rates_html, encoding='utf-8')

          print('Removed legacy 2G plans:')
          for plan in removed_plans:
              print(f" - {plan.get('id')}: {plan.get('name')}")
          print('removed_count=', len(removed_plans))
          PY

      - name: Validate cleanup
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          legacy_re = re.compile(r'(^|[^A-Za-z0-9])[23]G([^A-Za-z0-9]|$)', re.I)
          plans = json.loads(Path('data/plans.json').read_text(encoding='utf-8'))
          legacy = [p for p in plans.get('mobile_plans', []) if legacy_re.search(str(p.get('name') or ''))]
          if legacy:
              raise SystemExit(f"legacy 2G/3G plans remain: {[p.get('name') for p in legacy]}")

          removed_ids = {'LG-XP-1309','LG-XP-1310','LG-XP-1311','LG-XP-1312','LG-XP-1313','LG-XP-1314','LG-XP-1315'}
          catalog_text = Path('data/catalog.json').read_text(encoding='utf-8')
          supports_text = Path('data/supports.json').read_text(encoding='utf-8')
          leftovers = [pid for pid in removed_ids if pid in catalog_text or pid in supports_text]
          if leftovers:
              raise SystemExit(f'removed 2G plan IDs still referenced: {leftovers}')
          print('No legacy 2G/3G plans or removed 2G references remain')
          PY
          node --check assets/rates.min.js
          node --check assets/recommendation-engine-v2.js
          python3 .github/scripts/build_rates_asset.py --check
          python3 .github/scripts/validate_site.py

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git add data/plans.json data/catalog.json data/supports.json src/rates.js assets/rates.min.js assets/recommendation-engine-v2.js rates.html .github/scripts/daily_wireless_sync.py .github/scripts/validate_site.py
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'woongbts-maintenance'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Remove legacy 2G plans and allow only current LTE/5G catalog'
          git pull --rebase origin main
          git push origin HEAD:main
