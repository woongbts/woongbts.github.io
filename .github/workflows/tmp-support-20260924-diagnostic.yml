name: Apply 2026-09-24 wireless support changes

on:
  push:
    branches:
      - tmp-support-20260924-work

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      WIRELESS_SOURCE_BASE_URL: ${{ secrets.WIRELESS_SOURCE_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-support-20260924-work
          fetch-depth: 0

      - name: Snapshot current wireless data
        shell: bash
        run: |
          set -euo pipefail
          cp data/catalog.json "$RUNNER_TEMP/catalog-before.json"
          cp data/plans.json "$RUNNER_TEMP/plans-before.json"
          cp data/supports.json "$RUNNER_TEMP/supports-before.json"

      - name: Refresh from verified public source
        run: python3 .github/scripts/daily_wireless_sync.py

      - name: Validate website data and JavaScript
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile .github/scripts/report_wireless_changes.py .github/scripts/daily_wireless_sync.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          for path in ('data/catalog.json','data/plans.json','data/supports.json'):
              data=json.loads(Path(path).read_text(encoding='utf-8'))
              if not isinstance(data,dict):
                  raise SystemExit(f'invalid json root: {path}')
          print('JSON validation OK')
          PY
          node --check assets/rates.min.js
          node --check assets/site-pro.min.js
          python3 .github/scripts/build_rates_asset.py --check
          python3 .github/scripts/validate_site.py

      - name: Report verified changes
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/report_wireless_changes.py \
            --old-catalog "$RUNNER_TEMP/catalog-before.json" \
            --old-plans "$RUNNER_TEMP/plans-before.json" \
            --old-supports "$RUNNER_TEMP/supports-before.json" \
            --new-catalog data/catalog.json \
            --new-plans data/plans.json \
            --new-supports data/supports.json \
            --step-summary "$GITHUB_STEP_SUMMARY"

      - name: Assert 2026-09-24 notice values exactly
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          catalog=json.loads(Path('data/catalog.json').read_text(encoding='utf-8'))
          plans=json.loads(Path('data/plans.json').read_text(encoding='utf-8'))
          supports=json.loads(Path('data/supports.json').read_text(encoding='utf-8'))
          devices=catalog.get('devices') or []
          by_model={(d.get('carrier'), d.get('model_code')): d for d in devices}
          plan_by_id={p.get('id'):p for p in (plans.get('mobile_plans') or [])}
          expanded={}
          for rule in supports.get('support_schedules') or []:
              carrier=rule.get('carrier')
              for did in rule.get('device_ids') or []:
                  for jt in rule.get('join_types') or []:
                      for pid, amount in (rule.get('amounts') or {}).items():
                          expanded[(carrier,did,jt,pid)]=int(amount)

          refs={
              'SKT': ('SKT-XP-2901','베스트 109(T 우주)'),
              'KT': ('KT-XP-2582','초이스110 폰케어'),
              'LGU+': ('LG-XP-1097','플러스플랜115'),
          }
          models={
              'SKT':['SM-S948N_1T','SM-S948N_512G','SM-S948N','SM-S947N_512G','SM-S947N','SM-S942N_512G','SM-S942N'],
              'KT':['SM-S948NK1T','SM-S948NK512','SM-S948NK','SM-S947NK512','SM-S947NK','SM-S942NK512','SM-S942NK'],
              'LGU+':['SM-S948N1T','SM-S948N512','SM-S948N256','SM-S947N512','SM-S947N256','SM-S942N512','SM-S942N256'],
          }
          checked=0
          for carrier, model_codes in models.items():
              pid, expected_plan_name=refs[carrier]
              plan=plan_by_id.get(pid)
              assert plan and plan.get('name') == expected_plan_name, (carrier,pid,plan)
              for model_code in model_codes:
                  device=by_model.get((carrier,model_code))
                  assert device, f'missing target device: {carrier} {model_code}'
                  did=device['id']
                  values={jt:expanded.get((carrier,did,jt,pid)) for jt in ('기기변경','번호이동','신규가입')}
                  assert values['기기변경'] == 600000, (carrier,model_code,'기기변경',values)
                  assert values['번호이동'] == 500000, (carrier,model_code,'번호이동',values)
                  assert values['신규가입'] == 500000, (carrier,model_code,'신규가입',values)
                  checked += 1
                  print(f"OK S26 {carrier} {device['name']} | 기변 600,000 / 번호이동 500,000 / 신규 500,000")
          assert checked == 21, checked

          iphone_expected={
              'UIP17-512-NP':('아이폰 17 512GB(NEW)',1760000),
              'UIP17-256-NP':('아이폰 17 256GB(NEW)',1452000),
          }
          pid='LG-XP-1097'
          for model_code,(expected_name,expected_price) in iphone_expected.items():
              device=by_model.get(('LGU+',model_code))
              assert device, f'missing new LGU+ iPhone 17: {model_code}'
              assert device.get('name') == expected_name, device
              assert int(device.get('retail_price')) == expected_price, device
              did=device['id']
              values={jt:expanded.get(('LGU+',did,jt,pid)) for jt in ('기기변경','번호이동','신규가입')}
              assert values['번호이동'] == 550000, (model_code,values)
              assert values['기기변경'] == 450000, (model_code,values)
              assert values['신규가입'] == 450000, (model_code,values)
              print(f"OK iPhone17 LGU+ {expected_name} | 번호이동 550,000 / 기변·신규 450,000")

          print('2026-09-24 notice assertions OK')
          PY

      - name: Commit staging result
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/tmp-support-20260924-diagnostic.yml
          git add -A
          git config user.name 'woongbts-data-sync'
          git config user.email 'actions@users.noreply.github.com'
          if git diff --cached --quiet; then
            echo 'No staged changes after verified refresh'
            exit 0
          fi
          git commit -m 'Stage 2026-09-24 wireless subsidy refresh'
          git push origin HEAD:tmp-support-20260924-work
