name: run-studyphone-details

on:
  push:
    paths:
      - '.github/workflows/run-studyphone-details.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply detailed study phone calculator
        run: python scripts/upgrade-studyphone-details.py
      - name: Validate study phone calculator
        run: |
          node --check assets/rates.js
          python -m json.tool data/studyphone.json >/dev/null
          grep -q 'id="studyphone-plan"' rates.html
          grep -q 'id="studyphone-total"' rates.html
          grep -q 'studyphone-plan-list' rates.html
          grep -q '판매점 수수료·리베이트는 고객 계산과 화면에 반영하지 않습니다' rates.html
          grep -q 'data/studyphone.json' assets/rates.js
          grep -q 'Study phone detailed calculator' assets/rates.css
          ! grep -q '150,000' rates.html
          ! grep -q '210,000' rates.html
          ! grep -q '220,000' rates.html
          ! grep -q '230,000' rates.html
      - name: Commit upgrade
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rates.html assets/rates.js assets/rates.css
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m 'Add detailed KT M mobile study phone calculator'
            git push origin HEAD:main
          fi
