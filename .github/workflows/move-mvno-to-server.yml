name: Move MVNO assortment to server

on:
  push:
    branches:
      - hardening/private-mvno-assortment
    paths:
      - '.github/scripts/move_mvno_to_server.mjs'
      - '.github/workflows/move-mvno-to-server.yml'

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/private-mvno-assortment
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Move MVNO assortment behind server API
        run: node .github/scripts/move_mvno_to_server.mjs
      - name: Validate transformed public source
        run: |
          node --check src/rates.js
          node --check assets/rates.min.js
          node --check assets/mvno-api-bridge.min.js
          node --check assets/mvno-display.js
          node --check sw.js
          python3 .github/scripts/build_rates_asset.py --check
          test ! -e data/mvno-postpaid.json
          ! grep -q 'data/mvno-postpaid.json' src/rates.js
          ! grep -q 'SMKT' assets/mvno-display.js
          ! grep -q 'MMOBILE-1295' assets/mvno-display.js
          grep -q 'WoongbiMvnoApi' src/rates.js
          grep -q '/catalog/mvno' assets/mvno-api-bridge.min.js
          grep -q 'mvno-api-bridge.min.js' rates.html
      - name: Commit transformed public source
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/rates.js assets/rates.min.js rates.html sw.js data/mvno-postpaid.json
          git diff --cached --quiet && exit 0
          git commit -m 'Move MVNO assortment behind server API'
          git push origin HEAD:hardening/private-mvno-assortment
