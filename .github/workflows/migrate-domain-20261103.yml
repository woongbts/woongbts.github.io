name: One-time custom domain SEO migration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/migrate-domain-20261103.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: one-time-domain-migration-20261103
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update pages, generators, canonical URLs and sitemaps
        run: python scripts/migrate-domain-20261103.py
      - name: Validate regression test of SEO checker
        run: python scripts/test-seo-health-check.py
      - name: Check changed files and commit validated migration
        shell: bash
        run: |
          set -euo pipefail
          git status --short | tail -30
          if git diff --quiet; then
            echo "No changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "Migrate public canonicals, site links and sitemaps to woongbts.kr"
          git pull --rebase origin main
          git push origin HEAD:main
