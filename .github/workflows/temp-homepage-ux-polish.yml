name: Temporary homepage UX polish
on:
  push:
    paths:
      - '.github/workflows/temp-homepage-ux-polish.yml'
permissions:
  contents: write
jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply homepage UX polish
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'missing expected block: {label}')
              return text.replace(old, new, 1)

          # 1) Main HTML: unify wording, reduce repeated trust claims, bump caches.
          index_path = Path('index.html')
          index = index_path.read_text(encoding='utf-8')
          index = index.replace('>요금 계산</a><a class="btn" href="tel:0513437677">전화 상담</a></div>', '>요금 알아보기</a><a class="btn" href="tel:0513437677">전화 상담</a></div>', 1)
          index = index.replace(
              '<div class="trust-strip"><div><strong>16년</strong><span>통신업 경력</span></div><div><strong>7년째</strong><span>만덕 한자리 운영</span></div><div><strong>6개 분야</strong><span>휴대폰부터 렌탈까지</span></div></div>',
              '<div class="trust-strip"><div><strong>실제 후기</strong><span>방문 고객이 남긴 경험</span></div><div><strong>사전승낙</strong><span>KAIT 승낙정보 확인 가능</span></div><div><strong>구매 후 상담</strong><span>필요할 때 다시 문의 가능</span></div></div>',
              1
          )
          index = re.sub(r'assets/site-pro\.min\.js\?v=[^"\']+', 'assets/site-pro.min.js?v=20260920-1', index, count=1)
          index = re.sub(r'assets/ai-chat\.min\.js\?v=[^"\']+', 'assets/ai-chat.min.js?v=20260920-1', index, count=1)
          index_path.write_text(index, encoding='utf-8')

          # 2) Main responsive CSS: one dominant rate CTA, secondary actions visually quieter.
          css_path = Path('assets/site-pro.css')
          css = css_path.read_text(encoding='utf-8')
          marker = '/* Homepage CTA hierarchy 20260920 */'
          if marker not in css:
              css += '''\n\n/* Homepage CTA hierarchy 20260920 */\n.hero .actions>.btn.yellow{box-shadow:0 9px 22px rgba(242,197,0,.22)}\n@media(max-width:640px){\n  .hero .actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}\n  .hero .actions>.btn.yellow{grid-column:1/-1;width:100%;min-height:56px;font-size:1rem}\n  .hero .actions>.btn:not(.yellow){min-height:44px;padding:8px 10px;font-size:.82rem}\n  .hero .actions>a:nth-child(n+4){grid-column:1/-1}\n}\n'''
          css_path.write_text(css, encoding='utf-8')

          # 3) Storefront: make recommendation entry number-porting-first without showing stale fixed prices.
          store_path = Path('assets/site-pro.min.js')
          store = store_path.read_text(encoding='utf-8')
          old_intro = '광고용 최저가가 아니라 웅비통신에서 확인한 상담 예시를 기준으로 보여드립니다. 내 가입유형과 할인 조건은 계산기에서 다시 확인할 수 있습니다.'
          new_intro = '번호이동 조건을 먼저 살펴볼 수 있도록 추천 기종부터 보여드립니다. 실제 월 예상금액은 가입유형·요금제·지원금에 따라 달라져 계산기에서 확인합니다.'
          store = replace_once(store, old_intro, new_intro, 'storefront intro')
          store = store.replace('전체 기종·요금제 계산하기 →', '전체 기종·요금제 알아보기 →')
          store = store.replace('내 조건으로 다시 계산 →', '번호이동 기준으로 알아보기 →')
          store = store.replace('j=%EA%B8%B0%EA%B8%B0%EB%B3%80%EA%B2%BD', 'j=%EB%B2%88%ED%98%B8%EC%9D%B4%EB%8F%99')
          store = store.replace('<span class="deal-carrier">SKT</span>', '<span class="deal-carrier">SKT · 번호이동 우선</span>')
          store = store.replace('<span class="deal-carrier">KT</span>', '<span class="deal-carrier">KT · 번호이동 우선</span>')
          store = store.replace('<span class="deal-carrier">LGU+</span>', '<span class="deal-carrier">LGU+ · 번호이동 우선</span>')
          # Static figures were tied to old device-change examples. Hide them rather than imply they apply to number porting.
          store = store.replace('.deal-plan{margin-top:7px;', '.deal-plan{display:none;margin-top:7px;', 1)
          store = store.replace('.deal-price{margin-top:14px;', '.deal-price{display:none;margin-top:14px;', 1)
          if 'j=%EA%B8%B0%EA%B8%B0%EB%B3%80%EA%B2%BD' in store:
              raise SystemExit('old device-change storefront links still remain')
          store_path.write_text(store, encoding='utf-8')

          # 4) AI launcher: compact mobile button so it does not cover store content; unify rate wording.
          ai_path = Path('assets/ai-chat.min.js')
          ai = ai_path.read_text(encoding='utf-8')
          ai = ai.replace('내 월요금, 먼저 계산해보세요.', '내 월요금, 먼저 알아보세요.')
          ai = ai.replace('>월요금 계산</a>', '>요금 알아보기</a>')
          old_mobile = '.wb-ai-launcher{right:14px;bottom:82px;padding:12px 14px;font-size:.84rem}.wb-ai-panel{right:10px;bottom:142px;width:calc(100vw - 20px);height:min(560px,68vh);border-radius:18px}'
          new_mobile = ".wb-ai-launcher{right:14px;bottom:94px;width:50px;height:50px;padding:0;justify-content:center;font-size:0;opacity:.94}.wb-ai-launcher-dot{display:none}.wb-ai-launcher:after{content:'AI';font-size:.82rem;font-weight:1000;letter-spacing:.02em}.wb-ai-panel{right:10px;bottom:154px;width:calc(100vw - 20px);height:min(560px,68vh);border-radius:18px}"
          ai = replace_once(ai, old_mobile, new_mobile, 'mobile AI launcher')
          ai = ai.replace('t.setAttribute("aria-controls","woongbi-ai-panel")', 't.setAttribute("aria-controls","woongbi-ai-panel"),t.setAttribute("aria-label","웅비통신 AI에게 물어보기")', 1)
          ai_path.write_text(ai, encoding='utf-8')

          # Regression checks
          idx = index_path.read_text(encoding='utf-8')
          st = store_path.read_text(encoding='utf-8')
          aa = ai_path.read_text(encoding='utf-8')
          checks = [
              ('내 휴대폰 요금 알아보기', idx),
              ('요금 알아보기</a><a class="btn" href="tel:0513437677">전화 상담', idx),
              ('개인정보 처리방침', idx),
              ('번호이동 조건을 먼저', st),
              ('번호이동 기준으로 알아보기', st),
              ('AI에게 물어보기', aa),
              ("content:'AI'", aa),
          ]
          for needle, haystack in checks:
              if needle not in haystack:
                  raise SystemExit(f'regression check failed: {needle}')
          print('homepage UX polish checks passed')
          PY
          node --check assets/site-pro.min.js
          node --check assets/ai-chat.min.js
      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/site-pro.css assets/site-pro.min.js assets/ai-chat.min.js
          git commit -m 'Polish homepage hierarchy and number-porting discovery'
          git pull --rebase origin main
          git push
