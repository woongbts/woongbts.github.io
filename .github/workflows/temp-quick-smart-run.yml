name: Temporary quick recommendation runner

on:
  push:
    branches: [quick-smart-v3]
    paths:
      - '.github/workflows/temp-quick-smart-run.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: quick-smart-v3
          fetch-depth: 0
      - name: Apply scoped quick recommendation patch
        run: python3 .github/scripts/temp_quick_patch.py
      - name: Validate scoped changes
        run: |
          node --check src/rates.js
          node --check assets/rates.min.js
          python3 .github/scripts/build_rates_asset.py --check
          python3 .github/scripts/validate_site.py
      - name: Commit tested change and clean temporary files
        run: |
          rm -f .github/workflows/temp-quick-smart-v3.yml
          rm -f .github/workflows/temp-quick-smart-run.yml
          rm -f .github/scripts/temp_quick_patch.py
          git config user.name 'woongbts-site-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -u
          git add rates.html src/rates.js assets/rates.min.js assets/rates.css .github/scripts/validate_site.py
          git commit -m 'Make quick recommendations budget-aware and informative'
          git push origin HEAD:quick-smart-v3
