name: Update Woongbi News

on:
  workflow_dispatch:
  schedule:
    - cron: '15 */3 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-news.yml'

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch Naver Blog RSS
        run: |
          python - <<'PY'
          import datetime
          import email.utils
          import html
          import json
          import re
          import urllib.request
          import xml.etree.ElementTree as ET

          RSS_URL = 'https://rss.blog.naver.com/swb3301.xml'
          BUSINESS_KEYWORDS = [
              '웅비통신', '휴대폰', '알뜰폰', '선불폰', '인터넷', '통신', '요금제',
              '아이폰', '갤럭시', '유심', '중고폰', '번호이동', '기기변경', '사전예약',
              'skt', 'kt', 'lgu', 'lg u+', '렌탈', '정수기', '개통', '3g', '5g', 'lte',
              '공신폰', '키즈폰'
          ]

          req = urllib.request.Request(
              RSS_URL,
              headers={'User-Agent': 'Mozilla/5.0 WoongbiNewsBot/1.1'}
          )
          with urllib.request.urlopen(req, timeout=30) as r:
              raw = r.read()

          root = ET.fromstring(raw)
          channel = root.find('channel')
          items = []

          def clean_text(value):
              value = value or ''
              value = re.sub(r'<[^>]+>', ' ', value)
              value = html.unescape(value)
              value = re.sub(r'\s+', ' ', value).strip()
              return value

          for item in channel.findall('item')[:30]:
              title = clean_text(item.findtext('title'))
              link = (item.findtext('link') or '').strip()
              description = clean_text(item.findtext('description'))
              haystack = f'{title} {description}'.lower()

              if not any(keyword.lower() in haystack for keyword in BUSINESS_KEYWORDS):
                  continue

              if len(description) > 110:
                  description = description[:107].rstrip() + '...'

              pub_raw = (item.findtext('pubDate') or '').strip()
              date = ''
              if pub_raw:
                  try:
                      dt = email.utils.parsedate_to_datetime(pub_raw)
                      date = dt.strftime('%Y.%m.%d')
                  except Exception:
                      date = pub_raw[:10]

              if title and link:
                  items.append({
                      'source': 'BLOG',
                      'title': title,
                      'summary': description,
                      'date': date,
                      'url': link,
                  })

              if len(items) >= 3:
                  break

          payload = {
              'updated_at': datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=9))).isoformat(timespec='minutes'),
              'filter': 'business',
              'items': items,
          }
          with open('news.json', 'w', encoding='utf-8') as f:
              json.dump(payload, f, ensure_ascii=False, indent=2)
              f.write('\n')

          with open('index.html', 'r', encoding='utf-8') as f:
              index = f.read()
          index = re.sub(r'assets/site-pro\.js\?v=[^"\']+', 'assets/site-pro.js?v=20260912-news7', index)
          with open('index.html', 'w', encoding='utf-8') as f:
              f.write(index)
          PY

      - name: Commit updated news
        run: |
          if git diff --quiet -- news.json index.html; then
            echo "No news changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json index.html
          git commit -m "Update filtered Woongbi news feed"
          git push
