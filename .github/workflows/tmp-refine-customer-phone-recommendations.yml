name: Refine customer phone recommendations

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-refine-customer-phone-recommendations.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply customer recommendation refinements
        run: python tmp_refine_customer_phone_recommendations.py
      - name: Check JavaScript syntax
        run: node --check assets/rates.js
      - name: Verify recommendation rules
        run: |
          grep -q "carrierName==='KT'?61000" assets/rates.js
          grep -q "Number(p.monthly_fee)>=55000" assets/rates.js
          grep -q "아이폰18|iphone18|갤럭시s26|galaxys26|폴드8|fold8|플립8|flip8" assets/rates.js
          grep -q "storage===256||storage===512" assets/rates.js
          grep -q "purposePremiumStorageRank" assets/rates.js
      - name: Validate current catalog candidates
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          base=json.loads(Path('data/catalog.json').read_text(encoding='utf-8'))
          plans=json.loads(Path('data/plans.json').read_text(encoding='utf-8')).get('mobile_plans',[])
          supports=json.loads(Path('data/supports.json').read_text(encoding='utf-8')).get('support_schedules',[])
          plan_by={p['id']:p for p in plans}
          jump=next(d for d in base.get('devices',[]) if d.get('carrier')=='KT' and ('Jump5' in d.get('name','') or '점프5' in d.get('name','')))
          ids=(jump.get('eligible_plan_ids_by_join_type') or {}).get('기기변경') or jump.get('eligible_plan_ids') or []
          eligible=[plan_by[i] for i in ids if i in plan_by]
          p61=[p for p in eligible if int(p.get('monthly_fee') or 0)==61000]
          assert p61, 'KT Jump5 has no eligible 61,000 plan'
          print('KT Jump5 61K:', p61[0]['name'])
          devices=base.get('devices',[])
          def storage(d):
              t=(d.get('name','')+' '+d.get('model_code','')).lower().replace(' ','')
              if re.search(r'2tb',t): return 2048
              if re.search(r'1tb',t): return 1024
              if re.search(r'512gb|512g',t): return 512
              if re.search(r'256gb|256g',t): return 256
              if re.search(r'128gb|128g',t): return 128
          premium=[]
          for d in devices:
              t=(d.get('name','')+' '+d.get('model_code','')).lower().replace(' ','')
              if re.search(r'아이폰18|iphone18|갤럭시s26|galaxys26|폴드8|fold8|플립8|flip8',t) and storage(d) in (256,512):
                  premium.append(d)
          assert premium, 'no current premium 256/512 devices'
          assert all(storage(d) in (256,512) for d in premium)
          assert not any(storage(d) in (1024,2048) for d in premium)
          print('premium 256/512 candidates:', len(premium))
          print('validation ok')
          PY
      - name: Commit result
        run: |
          git config user.name "woongbts"
          git config user.email "swb3301@gmail.com"
          git add assets/rates.js
          git commit -m "Refine value and premium customer recommendations" || exit 0
          git push
