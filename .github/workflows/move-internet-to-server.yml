name: Move internet and TV pricing to server

on:
  push:
    branches:
      - hardening/server-only-internet-tv
    paths:
      - '.github/scripts/move_internet_to_server.mjs'
      - '.github/workflows/move-internet-to-server.yml'

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/server-only-internet-tv
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Move public wired pricing logic behind server API
        run: node .github/scripts/move_internet_to_server.mjs
      - name: Validate transformed calculator
        run: |
          node --check src/rates.js
          node --check assets/rates.min.js
          node --check assets/internet-api-bridge.min.js
          node --check assets/internet-ui.min.js
          python3 .github/scripts/build_rates_asset.py --check
          ! grep -q 'fallbackSettopFee' src/rates.js
          ! grep -q 'internetDiscountBySpeed' src/rates.js
          ! grep -q 'wbWiredPackageOverride' src/rates.js
          ! grep -q 'data/internet.json' src/rates.js
          ! grep -q 'const Mt=t("internet-carrier")' src/rates.js
          grep -q '/quote/internet' assets/internet-api-bridge.min.js
          grep -q 'WoongbiInternetApi' assets/internet-ui.min.js
      - name: Commit transformed calculator
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/rates.js assets/rates.min.js
          git diff --cached --quiet && exit 0
          git commit -m 'Move internet and TV pricing logic behind server API'
          git push origin HEAD:hardening/server-only-internet-tv
