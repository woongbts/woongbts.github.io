name: Purpose phone recommendation upgrade

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/purpose-phone-upgrade.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply purpose phone upgrade
        run: python3 tmp_purpose_phone_upgrade.py
      - name: Validate customer page
        shell: bash
        run: |
          node --check assets/rates.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('rates.html').read_text(encoding='utf-8')
          ids=re.findall(r'\bid="([^"]+)"',html)
          dup=sorted({x for x in ids if ids.count(x)>1})
          if dup: raise SystemExit('duplicate ids: '+', '.join(dup))
          for term in ['판매점 수수료','리베이트','제로노트','정책표']:
              if term in html: raise SystemExit('internal term remains in customer html: '+term)
          for required in ['purpose-recommend','purpose-results','purpose-pension','data-purpose-category="senior"','data-purpose-category="kids"']:
              if required not in html: raise SystemExit('missing purpose UI: '+required)
          PY
      - name: Commit upgrade
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rates.html assets/rates.js assets/rates.css
          git commit -m 'Add purpose based phone recommendations'
          git push origin main
