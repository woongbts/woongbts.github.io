name: Import Clover rental catalog

on:
  push:
    paths:
      - 'rental/.clover-import-trigger'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser
        run: python -m pip install --disable-pip-version-check beautifulsoup4
      - name: Import non-duplicate Clover products
        run: python .github/scripts/import_clover_list.py
      - name: Commit imported catalog
        run: |
          git config user.name "woongbi-catalog-bot"
          git config user.email "actions@users.noreply.github.com"
          git add rental/data/products.json rental/data/clover-import-report.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Import non-duplicate Clover rental products"
          git pull --rebase origin main
          git push
