name: Temporary OG preview refresh

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-refresh-og.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare image tooling
        run: |
          python -m pip install --quiet pillow
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk

      - name: Create OG image and update metadata
        shell: bash
        run: |
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          from pathlib import Path

          W,H=1200,630
          img=Image.new('RGB',(W,H),(246,250,251))
          draw=ImageDraw.Draw(img)
          top=(249,252,253); bottom=(235,246,247)
          for y in range(H):
              t=y/(H-1)
              c=tuple(int(top[i]*(1-t)+bottom[i]*t) for i in range(3))
              draw.line((0,y,W,y),fill=c)

          navy=(16,60,82); teal=(9,164,158); yellow=(248,215,58); muted=(78,103,113)
          draw.ellipse((760,-110,1310,440),fill=(226,245,246))
          draw.ellipse((870,70,1280,480),fill=(240,249,250))

          bold='/usr/share/fonts/opentype/noto/NotoSansCJK-Bold.ttc'
          reg='/usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc'
          f_label=ImageFont.truetype(bold,24,index=3)
          f_brand=ImageFont.truetype(bold,42,index=3)
          f_main=ImageFont.truetype(bold,54,index=3)
          f_sub=ImageFont.truetype(reg,24,index=3)
          f_chip=ImageFont.truetype(bold,19,index=3)
          f_url=ImageFont.truetype(bold,23,index=3)

          draw.rounded_rectangle((68,72,238,114),21,fill=teal)
          draw.text((90,79),'덕천만덕점',font=f_label,fill='white')
          draw.text((68,132),'웅비통신',font=f_brand,fill=navy)
          draw.text((68,215),'내 휴대폰 요금,',font=f_main,fill=(28,35,40))
          draw.text((68,283),'바로 비교해 보세요.',font=f_main,fill=navy)
          draw.rounded_rectangle((70,356,440,368),6,fill=yellow)
          draw.text((68,394),'기종과 요금제를 고르고',font=f_sub,fill=muted)
          draw.text((68,431),'월 예상금액을 직접 확인하세요.',font=f_sub,fill=muted)

          chips=['휴대폰','알뜰폰','선불폰','인터넷·TV']
          cx=68
          for chip in chips:
              box=draw.textbbox((0,0),chip,font=f_chip)
              cw=(box[2]-box[0])+34
              draw.rounded_rectangle((cx,490,cx+cw,530),20,fill='white',outline=(205,221,225))
              draw.text((cx+17,497),chip,font=f_chip,fill=navy)
              cx+=cw+10
          draw.text((68,565),'woongbts.github.io',font=f_url,fill=teal)
          draw.rounded_rectangle((650,108,656,520),3,fill=(210,225,229))

          def phone_layer(cx,cy,w,h,angle_deg,screen1,screen2):
              canvas=Image.new('RGBA',(w+120,h+120),(0,0,0,0))
              d=ImageDraw.Draw(canvas)
              d.rounded_rectangle((55,55,55+w,55+h),42,fill=(16,60,82,36))
              d.rounded_rectangle((45,42,45+w,42+h),42,fill=(20,27,33,255))
              screen=Image.new('RGBA',(w-18,h-18),(0,0,0,0)); sd=ImageDraw.Draw(screen)
              for yy in range(h-18):
                  t=yy/max(1,h-19)
                  c=tuple(int(screen1[i]*(1-t)+screen2[i]*t) for i in range(3))+(255,)
                  sd.line((0,yy,w-18,yy),fill=c)
              mask=Image.new('L',(w-18,h-18),0); md=ImageDraw.Draw(mask)
              md.rounded_rectangle((0,0,w-18,h-18),34,fill=255)
              canvas.paste(screen,(54,51),mask)
              d.rounded_rectangle((45+w*.36,50,45+w*.64,56),3,fill=(235,240,242,130))
              d.ellipse((45+w/2-8,59,45+w/2+8,75),fill=(15,20,25,200))
              d.rounded_rectangle((72,84,92,42+h-36),10,fill=(255,255,255,36))
              rot=canvas.rotate(angle_deg,resample=Image.Resampling.BICUBIC,expand=True)
              img.paste(rot,(int(cx-rot.width/2),int(cy-rot.height/2)),rot)

          phone_layer(890,335,230,430,-9,(214,226,255),(121,114,230))
          phone_layer(1040,320,245,455,7,(123,225,226),(78,104,220))
          draw.ellipse((792,120,850,178),fill=(255,255,255),outline=(199,222,225))
          for r in (18,12,6): draw.arc((821-r,149-r,821+r,149+r),210,330,fill=teal,width=4)
          draw.ellipse((818,156,824,162),fill=teal)

          out=Path('assets/woongbi-og-20260918.jpg')
          out.parent.mkdir(parents=True,exist_ok=True)
          img.save(out,quality=88,optimize=True,progressive=True)

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          replacements={
            '<meta property="og:title" content="웅비통신 덕천만덕점 | 부산 만덕 휴대폰·알뜰폰·인터넷·렌탈">':'<meta property="og:title" content="웅비통신 덕천만덕점 | 휴대폰 요금 바로 비교">',
            '<meta property="og:description" content="부산 북구 만덕동에서 휴대폰부터 인터넷, 렌탈까지 한 번에 상담하는 동네 통신매장입니다.">':'<meta property="og:description" content="기종과 요금제를 고르고 월 예상금액을 직접 확인해 보세요. 휴대폰·알뜰폰·선불폰·인터넷TV 상담.">',
            'https://woongbts.github.io/assets/woongbi-og-20260911.jpg':'https://woongbts.github.io/assets/woongbi-og-20260918.jpg',
            '<meta property="og:image:alt" content="웅비통신 덕천만덕점 · 통신업 16년 · 만덕 한자리 7년">':'<meta property="og:image:alt" content="웅비통신 덕천만덕점 · 내 휴대폰 요금 바로 비교">',
            '<meta name="twitter:card" content="summary_large_image">':'<meta name="twitter:card" content="summary_large_image"><meta name="twitter:title" content="웅비통신 덕천만덕점 | 휴대폰 요금 바로 비교"><meta name="twitter:description" content="기종과 요금제를 고르고 월 예상금액을 직접 확인해 보세요. 휴대폰·알뜰폰·선불폰·인터넷TV 상담.">'
          }
          for old,new in replacements.items():
              if old not in s:
                  raise SystemExit(f'Expected metadata not found: {old[:80]}')
              s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Remove temporary workflow and commit final assets
        run: |
          rm -f .github/workflows/temp-refresh-og.yml
          git config user.name 'woongbts-site-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html assets/woongbi-og-20260918.jpg .github/workflows/temp-refresh-og.yml
          git commit -m 'Refresh link preview image and social metadata'
          git push origin HEAD:main
