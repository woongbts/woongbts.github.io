name: Temporary fix OneDrive analysis UX

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-fix-onedrive-analysis-ui.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch CRM OneDrive analysis UX
        shell: python
        run: |
          from pathlib import Path

          app = Path('.github/crm/web/app.js')
          text = app.read_text()
          old = '''async function readOneDrive() {
  try {
    if (!getStoredOneDriveClientId()) {
      $('onedrive-setup').open = true;
      throw new Error('Microsoft Client ID를 먼저 저장한 뒤 OneDrive를 연결해 주세요.');
    }
    $('import-progress').classList.remove('hidden');
    const progress = message => { $('import-progress').textContent = message; };
    const allFiles = await discoverOneDriveSalesFiles(progress);
    const selection = selectSalesFilesByRange(allFiles, $('od-start').value, $('od-end').value);
    if (!selection.files.length) throw new Error('선택한 기간의 OneDrive 판매일보를 찾지 못했습니다.');
    const missing = selection.missingMonths.length
      ? `<br><b>⚠ 누락 월:</b> ${esc(selection.missingMonths.join(', '))}`
      : '<br><b>월별 파일:</b> 기간 내 모든 월 확인';
    const note = `<br><b>OneDrive 직접 연결:</b> ${esc(selection.start)} ~ ${esc(selection.end)} · 대상 <b>${selection.files.length}개 파일</b> / 예상 ${selection.expectedCount}개월 · 중복 사본 ${selection.duplicates.length}개 제외 · 범위 밖 ${selection.outOfRange.length}개 제외 · 기타 파일 ${selection.unmatched.length}개 제외${missing}`;
    const files = await downloadOneDriveFiles(selection.files, progress);
    await analyzeSelectedFiles(files, note);
  } catch (error) {
    showError(error);
  }
}
'''
          new = '''let oneDriveAnalysisRunning = false;

async function readOneDrive() {
  if (oneDriveAnalysisRunning) return;
  const button = $('od-import');
  const actionStatus = $('od-action-status');
  const originalLabel = button.textContent;
  const progress = message => {
    actionStatus.classList.remove('hidden');
    actionStatus.textContent = message;
    $('import-progress').classList.remove('hidden');
    $('import-progress').textContent = message;
  };

  try {
    if (!getStoredOneDriveClientId()) {
      $('onedrive-setup').open = true;
      throw new Error('Microsoft Client ID를 먼저 저장한 뒤 OneDrive를 연결해 주세요.');
    }

    oneDriveAnalysisRunning = true;
    button.disabled = true;
    button.textContent = 'OneDrive 확인 중...';
    progress('OneDrive 연결 상태 확인 중...');

    const status = await getOneDriveStatus();
    if (!status.connected) throw new Error('Microsoft 계정 연결을 먼저 완료해 주세요.');

    progress('OneDrive 판매일보 폴더 확인 중...');
    const allFiles = await discoverOneDriveSalesFiles(progress);
    progress(`OneDrive 파일 목록 확인 완료 · ${allFiles.length.toLocaleString('ko-KR')}개 Excel/CSV`);

    const selection = selectSalesFilesByRange(allFiles, $('od-start').value, $('od-end').value);
    if (!selection.files.length) throw new Error('선택한 기간의 OneDrive 판매일보를 찾지 못했습니다.');
    const missing = selection.missingMonths.length
      ? `<br><b>⚠ 누락 월:</b> ${esc(selection.missingMonths.join(', '))}`
      : '<br><b>월별 파일:</b> 기간 내 모든 월 확인';
    const note = `<br><b>OneDrive 직접 연결:</b> ${esc(selection.start)} ~ ${esc(selection.end)} · 대상 <b>${selection.files.length}개 파일</b> / 예상 ${selection.expectedCount}개월 · 중복 사본 ${selection.duplicates.length}개 제외 · 범위 밖 ${selection.outOfRange.length}개 제외 · 기타 파일 ${selection.unmatched.length}개 제외${missing}`;

    button.textContent = `판매일보 ${selection.files.length}개 받는 중...`;
    const files = await downloadOneDriveFiles(selection.files, progress);
    button.textContent = '판매일보 분석 중...';
    await analyzeSelectedFiles(files, note);
    actionStatus.textContent = `OneDrive 자동 분석 완료 · ${selection.files.length}개 판매일보`;
  } catch (error) {
    actionStatus.classList.remove('hidden');
    actionStatus.textContent = `OneDrive 자동 분석 중단 · ${error.message || '오류가 발생했습니다.'}`;
    showError(error);
  } finally {
    oneDriveAnalysisRunning = false;
    button.disabled = false;
    button.textContent = originalLabel;
  }
}
'''
          if old not in text:
              raise SystemExit('readOneDrive block not found')
          app.write_text(text.replace(old, new))

          od = Path('.github/crm/web/onedrive.js')
          text = od.read_text()
          old = '''async function graphFetch(pathOrUrl, { blob = false } = {}) {
  const token = await accessToken();
  const url = /^https:\\/\\//i.test(pathOrUrl) ? pathOrUrl : `${GRAPH_BASE}${pathOrUrl}`;
  const response = await fetch(url, { headers: { Authorization: `Bearer ${token}` } });
  if (!response.ok) {
    let detail = '';
    try { detail = (await response.json())?.error?.message || ''; } catch {}
    throw new Error(detail || `OneDrive 요청 실패 (${response.status})`);
  }
  return blob ? response.blob() : response.json();
}
'''
          new = '''async function graphFetch(pathOrUrl, { blob = false } = {}) {
  const token = await accessToken();
  const url = /^https:\\/\\//i.test(pathOrUrl) ? pathOrUrl : `${GRAPH_BASE}${pathOrUrl}`;
  const controller = new AbortController();
  const timeoutMs = blob ? 120000 : 30000;
  const timer = setTimeout(() => controller.abort(), timeoutMs);
  try {
    const response = await fetch(url, {
      headers: { Authorization: `Bearer ${token}` },
      signal: controller.signal
    });
    if (!response.ok) {
      let detail = '';
      try { detail = (await response.json())?.error?.message || ''; } catch {}
      throw new Error(detail || `OneDrive 요청 실패 (${response.status})`);
    }
    return blob ? response.blob() : response.json();
  } catch (error) {
    if (error?.name === 'AbortError') {
      throw new Error(blob
        ? 'OneDrive 판매일보 내려받기 응답이 2분 이상 없어 중단했습니다.'
        : 'OneDrive 응답이 30초 이상 없어 중단했습니다. Microsoft 계정 연결 상태를 확인해 주세요.');
    }
    throw error;
  } finally {
    clearTimeout(timer);
  }
}
'''
          if old not in text:
              raise SystemExit('graphFetch block not found')
          od.write_text(text.replace(old, new))

          html = Path('.github/crm/web/index.html')
          text = html.read_text()
          old = '''        <div class="onedrive-actions">
          <button id="od-connect" class="onedrive-connect">Microsoft 계정 연결</button>
          <button id="od-import" class="primary-inline">OneDrive 판매일보 자동 분석</button>
          <button id="od-disconnect">연결 해제</button>
        </div>
'''
          new = '''        <div class="onedrive-actions">
          <button id="od-connect" class="onedrive-connect">Microsoft 계정 연결</button>
          <button id="od-import" class="primary-inline">OneDrive 판매일보 자동 분석</button>
          <button id="od-disconnect">연결 해제</button>
        </div>
        <div id="od-action-status" class="import-progress hidden" aria-live="polite"></div>
'''
          if old not in text:
              raise SystemExit('OneDrive actions block not found')
          text = text.replace(old, new)
          text = text.replace('SPA 리디렉션 URI를 <b>https://woongbi-crm.woongbts.workers.dev/</b> 로 등록하고', 'SPA 리디렉션 URI에 <b>https://woongbi-crm.woongbts.workers.dev/auth-redirect.html</b> 을 등록하고')
          html.write_text(text)
      - name: Validate CRM
        working-directory: .github/crm
        run: npm install --ignore-scripts && npm run check && npm run build
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/crm/web/app.js .github/crm/web/onedrive.js .github/crm/web/index.html
          git commit -m 'Improve OneDrive analysis feedback and timeout'
          git push
