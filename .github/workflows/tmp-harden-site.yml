name: Temporary site hardening

on:
  push:
    paths:
      - '.github/workflows/tmp-harden-site.yml'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply copyright and production references
        run: python3 tmp_harden_site.py
      - name: Build minified browser JavaScript
        shell: bash
        run: |
          set -euo pipefail
          npx --yes terser@5 assets/rates.js --compress passes=2 --mangle --output assets/rates.min.js
          npx --yes terser@5 assets/site-pro.js --compress passes=2 --mangle --output assets/site-pro.min.js
          npx --yes terser@5 assets/ai-chat.js --compress passes=2 --mangle --output assets/ai-chat.min.js
          node --check assets/rates.min.js
          node --check assets/site-pro.min.js
          node --check assets/ai-chat.min.js
      - name: Remove readable production JS and obsolete one-time tooling
        shell: bash
        run: |
          set -euo pipefail
          rm -f assets/rates.js assets/site-pro.js assets/ai-chat.js assets/site-pro-core.js
          rm -f .github/scripts/consulting_v2_patch.py
          rm -f .github/workflows/fix-wired-calculator.yml
          rm -f .github/workflows/run-consulting-v2.yml
          rm -f .github/workflows/run-consulting-v3.yml
          rm -f .github/workflows/run-upgrade-consulting-v2.yml
          rm -f .github/workflows/senior-purpose-refresh.yml
          rm -f .github/workflows/upgrade-rate-consulting.yml
          rm -f .github/workflows/xero-mobile-probe.yml
          rm -f .github/workflows/xero-mobile-support-audit.yml
          rm -f .github/workflows/xero-mobile-sync-latest.yml
          rm -f .github/workflows/xero-mobile-sync.yml
          rm -f .github/workflows/xero-prepaid-probe.yml
          rm -f .github/workflows/xero-scan.yml
          rm -f scripts/patch-consulting-v3.py scripts/patch-wired.py tmp_refresh_senior_purpose.py
      - name: Validate hardened public tree
        shell: bash
        run: |
          set -euo pipefail
          grep -q '무단 복제 및 상업적 이용을 금합니다' index.html
          grep -q '무단 복제 및 상업적 이용을 금합니다' rates.html
          grep -q '무단 복제 및 상업적 이용을 금합니다' links.html
          grep -q 'assets/rates.min.js?v=20260917-1' rates.html
          grep -q 'assets/site-pro.min.js?v=20260917-1' index.html
          grep -q 'assets/ai-chat.min.js?v=20260917-1' index.html
          ! grep -q 'assets/rates.js' rates.html
          ! grep -q 'assets/site-pro.js' index.html
          ! grep -q 'assets/ai-chat.js' index.html
          test -s COPYRIGHT.md
          test ! -e assets/rates.js
          test ! -e assets/site-pro.js
          test ! -e assets/ai-chat.js
          if grep -R -n -E '제로노트|리베이트|판매점 수수료|정산금' --exclude-dir=.git --exclude='*.md' --exclude='tmp-harden-site.yml' .; then
            echo 'Forbidden internal policy wording found in public tree'
            exit 1
          fi
          if grep -R -n 'xeronote.co.kr' --exclude-dir=.git --exclude='tmp-harden-site.yml' .; then
            echo 'Old policy source reference still present in public tree'
            exit 1
          fi
          echo 'public hardening validation OK'
      - name: Commit hardened site
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'woongbts-site-hardening'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Harden public site source and protect consultation logic'
          git pull --rebase origin main
          git push origin HEAD:main
