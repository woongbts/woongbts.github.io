name: upgrade-rate-consulting

on:
  push:
    paths:
      - '.github/workflows/upgrade-rate-consulting.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Upgrade calculator UX
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          html_path=Path('rates.html')
          js_path=Path('assets/rates.js')
          css_path=Path('assets/rates.css')
          html=html_path.read_text(encoding='utf-8')
          js=js_path.read_text(encoding='utf-8')
          css=css_path.read_text(encoding='utf-8')

          # 1) Customer-facing copy + searchable device picker.
          html=html.replace('요금 알아보기 · BETA','휴대폰·알뜰폰·인터넷 간편견적')
          html=html.replace(
            '<label>할인방식<select id="discount-method"><option value="support">공시지원금 · 단말 할인</option><option value="contract">선택약정 · 통신요금 25% 할인</option></select><small class="field-help">두 방식은 동시에 적용되지 않습니다.</small></label>\n              <label>기종<select id="device-select"><option value="">기종을 선택하세요</option></select><small class="field-help">등록된 기종을 최신 출시순으로 표시합니다.</small></label>',
            '<label>상세 계산 기준<select id="discount-method"><option value="support">공시지원금 · 단말 할인</option><option value="contract">선택약정 · 통신요금 25% 할인</option></select><small class="field-help">아래 비교표에서는 공시지원금과 선택약정을 동시에 계산합니다.</small></label>\n              <label>기종 검색<input id="device-search" type="search" autocomplete="off" placeholder="예: 아이폰18, S26, Wide9, SM-M176S"><small class="field-help">기종명이나 모델명으로 검색하세요. 검색 전에는 최신 기종 30개를 표시합니다.</small></label>\n              <label>기종<select id="device-select"><option value="">기종을 선택하세요</option></select><small class="field-help">검색 결과에서 원하는 기종을 선택하세요.</small></label>'
          )

          compare_block='''\n              <section class="mobile-compare" id="mobile-compare" aria-live="polite">\n                <div class="compare-head"><div><strong>공시지원금 vs 선택약정</strong><span>24개월 약정 총비용 · 단말 총 할부액 포함</span></div><b id="compare-best">조건을 선택해 주세요</b></div>\n                <div class="compare-grid">\n                  <button type="button" class="compare-card" id="compare-support-card" data-method="support">\n                    <span>공시지원금</span><strong id="compare-support-monthly">—</strong><small>예상 월 납부액</small><em id="compare-support-total">24개월 총비용 —</em><i id="compare-support-benefit">지원금 —</i>\n                  </button>\n                  <button type="button" class="compare-card" id="compare-contract-card" data-method="contract">\n                    <span>선택약정 25%</span><strong id="compare-contract-monthly">—</strong><small>예상 월 납부액</small><em id="compare-contract-total">24개월 총비용 —</em><i id="compare-contract-benefit">월 할인 —</i>\n                  </button>\n                </div>\n                <div class="compare-diff" id="compare-diff">기종과 요금제를 선택하면 두 방식의 차이를 한눈에 비교합니다.</div>\n              </section>\n              <div class="quote-tools">\n                <button type="button" id="copy-quote">견적 복사</button>\n                <button type="button" id="share-quote">견적 공유</button>\n                <button type="button" class="primary" id="consult-quote">이 조건으로 상담하기</button>\n                <small id="quote-action-status" aria-live="polite"></small>\n              </div>'''
          marker='              <p id="calc-summary">통신사, 가입유형, 할인방식, 기종, 요금제를 선택하면 자동으로 계산됩니다.</p>'
          if compare_block.strip() not in html:
              if marker not in html:
                  raise SystemExit('calc-summary marker not found')
              html=html.replace(marker,marker+compare_block)

          bar='''\n  <div class="mobile-quote-bar" id="mobile-quote-bar" hidden>\n    <div class="mobile-quote-bar-value"><span>현재 예상 월 납부액</span><strong id="mobile-quote-bar-total">—</strong></div>\n    <button type="button" id="mobile-quote-detail">상세</button>\n    <button type="button" class="primary" id="mobile-quote-consult">상담</button>\n  </div>\n'''
          if 'id="mobile-quote-bar"' not in html:
              if '</body>' not in html: raise SystemExit('body close not found')
              html=html.replace('</body>',bar+'</body>')

          html=re.sub(r'assets/rates\.css\?v=[^"\']+', 'assets/rates.css?v=20260915-4', html)
          html=re.sub(r'assets/rates\.js\?v=[^"\']+', 'assets/rates.js?v=20260915-14', html)

          # 2) Search logic and simultaneous comparison / quote handoff.
          js=js.replace(
            "  const deviceSelect=$('device-select'),planSelect=$('plan-select'),monthsSelect=$('installment-months'),welfareType=$('welfare-type');",
            "  const deviceSelect=$('device-select'),deviceSearch=$('device-search'),planSelect=$('plan-select'),monthsSelect=$('installment-months'),welfareType=$('welfare-type');"
          )

          old_fill='''  function fillDevices(){\n    const keep=deviceSelect.value;clearSelect(deviceSelect,'기종을 선택하세요');\n    (catalog?.devices||[]).filter(d=>d.carrier===carrier.value).sort(byNewest).forEach(d=>option(deviceSelect,d.id,d.model?`${d.name} · ${d.model}`:d.name));\n    deviceSelect.value=[...deviceSelect.options].some(o=>o.value===keep)?keep:'';fillPlans();\n  }'''
          new_fill='''  function fillDevices(){\n    const keep=deviceSelect.value,q=String(deviceSearch?.value||'').trim().toLowerCase();clearSelect(deviceSelect,q?'검색 결과를 선택하세요':'기종을 선택하세요');\n    let rows=(catalog?.devices||[]).filter(d=>d.carrier===carrier.value).sort(byNewest);\n    if(q) rows=rows.filter(d=>`${d.name||''} ${d.model||''} ${d.model_code||''}`.toLowerCase().includes(q)).slice(0,100);\n    else rows=rows.slice(0,30);\n    const selected=(catalog?.devices||[]).find(d=>d.id===keep&&d.carrier===carrier.value);\n    if(selected&&!rows.some(d=>d.id===selected.id))rows=[selected,...rows];\n    rows.forEach(d=>option(deviceSelect,d.id,[d.name,d.model_code||d.model].filter(Boolean).join(' · ')));\n    deviceSelect.value=[...deviceSelect.options].some(o=>o.value===keep)?keep:'';\n    if(q&&!rows.length)deviceSelect.options[0].textContent='검색 결과 없음';\n    fillPlans();\n  }'''
          if old_fill in js:
              js=js.replace(old_fill,new_fill)
          elif new_fill not in js:
              raise SystemExit('fillDevices target not found')

          # Wrap the existing detailed calculator so comparison and sticky quote always update too.
          if 'function syncMobileCore(){' not in js:
              js=js.replace('  function syncMobile(){','  function syncMobileCore(){',1)

          wrapper='''\n  function mobileScenario(method){\n    const d=currentDevice(),p=currentPlan();\n    if(!d||!p||!hasAmount(d.retail_price)||Number(d.retail_price)<=0)return null;\n    const price=Number(d.retail_price),planFee=Number(p.monthly_fee)||0,months=Number(monthsSelect.value)||24;\n    const supportRow=currentSupport();\n    if(method==='support'&&!supportRow)return {known:false};\n    const support=method==='support'?Number(supportRow.public_support||0):0;\n    const principal=Math.max(0,price-support),inst=installment(principal,months);\n    const contractDiscount=method==='contract'?planFee*contractRate:0;\n    const afterContract=Math.max(0,planFee-contractDiscount),welfare=welfareDiscount(welfareType.value,afterContract),service=Math.max(0,afterContract-welfare.amount);\n    return {known:true,method,price,planFee,support,contractDiscount,principal,inst,service,welfare,monthly:inst.monthly+service,total24:inst.total+service*24};\n  }\n  function syncComparison(){\n    const support=mobileScenario('support'),contract=mobileScenario('contract');\n    const supportKnown=support?.known===true,contractKnown=contract?.known===true;\n    $('compare-support-monthly').textContent=supportKnown?won(support.monthly):(support&&support.known===false?'매장 확인':'—');\n    $('compare-support-total').textContent=supportKnown?`24개월 총비용 ${won(support.total24)}`:'24개월 총비용 —';\n    $('compare-support-benefit').textContent=supportKnown?`공시지원금 ${won(support.support)}`:'지원금 —';\n    $('compare-contract-monthly').textContent=contractKnown?won(contract.monthly):'—';\n    $('compare-contract-total').textContent=contractKnown?`24개월 총비용 ${won(contract.total24)}`:'24개월 총비용 —';\n    $('compare-contract-benefit').textContent=contractKnown?`월 선택약정 할인 ${won(contract.contractDiscount)}`:'월 할인 —';\n    document.querySelectorAll('.compare-card').forEach(card=>card.classList.toggle('active',card.dataset.method===discountMethod.value));\n    if(supportKnown&&contractKnown){\n      const diff=Math.abs(support.total24-contract.total24),best=support.total24<=contract.total24?'공시지원금':'선택약정';\n      $('compare-best').textContent=diff<500?`두 방식이 비슷해요`:`${best} 쪽이 유리`;\n      $('compare-diff').textContent=diff<500?'현재 조건에서는 두 방식의 24개월 총비용 차이가 크지 않습니다.':`${best} 이용 시 24개월 총 예상비용이 약 ${won(diff)} 낮습니다.`;\n    }else if(contractKnown&&support&&support.known===false){\n      $('compare-best').textContent='공시지원금 확인 필요';$('compare-diff').textContent='선택약정은 계산됐고, 공시지원금은 매장에서 최신 금액을 확인해 비교해 드립니다.';\n    }else{$('compare-best').textContent='조건을 선택해 주세요';$('compare-diff').textContent='기종과 요금제를 선택하면 두 방식의 차이를 한눈에 비교합니다.'}\n  }\n  function quoteText(){\n    const d=currentDevice(),p=currentPlan();if(!d||!p)return '';\n    const scenario=mobileScenario(discountMethod.value),method=discountMethod.value==='contract'?'선택약정 25%':'공시지원금';\n    const lines=['[웅비통신 간편견적 상담]',`통신사: ${carrier.value}`,`가입유형: ${joinType.value}`,`기종: ${d.name}${d.model_code?' ('+d.model_code+')':''}`,`요금제: ${p.name} / ${won(p.monthly_fee)}`,`계산기준: ${method}`,`할부: ${monthsSelect.value||24}개월`,`복지할인: ${welfareType.options[welfareType.selectedIndex]?.text||'미적용'}`];\n    if(scenario?.known)lines.push(`예상 월 납부액: ${won(scenario.monthly)}`);\n    lines.push('추가지원금·재고·프로모션은 매장에서 최종 확인 부탁드립니다.');\n    return lines.join('\\n');\n  }\n  async function copyQuote(showStatus=true){\n    const text=quoteText();if(!text){if(showStatus)$('quote-action-status').textContent='기종과 요금제를 먼저 선택해 주세요.';return false}\n    try{await navigator.clipboard.writeText(text);if(showStatus)$('quote-action-status').textContent='견적을 복사했습니다.';return true}catch(e){\n      const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();const ok=document.execCommand('copy');ta.remove();if(showStatus)$('quote-action-status').textContent=ok?'견적을 복사했습니다.':'견적 복사에 실패했습니다.';return ok;\n    }\n  }\n  async function shareQuote(){\n    const text=quoteText();if(!text){$('quote-action-status').textContent='기종과 요금제를 먼저 선택해 주세요.';return}\n    if(navigator.share){try{await navigator.share({title:'웅비통신 간편견적',text,url:location.href});$('quote-action-status').textContent='견적 공유창을 열었습니다.';return}catch(e){if(e?.name==='AbortError')return}}\n    await copyQuote(true);\n  }\n  async function consultQuote(){\n    const ok=await copyQuote(false);\n    if(!ok){$('quote-action-status').textContent='기종과 요금제를 먼저 선택해 주세요.';return}\n    $('quote-action-status').textContent='견적을 복사했습니다. 카카오톡 상담창에 붙여넣어 주세요.';\n    window.location.href='http://pf.kakao.com/_nWwNT/chat';\n  }\n  function syncQuoteBar(){\n    const bar=$('mobile-quote-bar'),scenario=mobileScenario(discountMethod.value),mobileActive=document.querySelector('[data-panel="mobile"]')?.classList.contains('active');\n    if(!bar)return;const show=!!(mobileActive&&scenario?.known);bar.hidden=!show;document.body.classList.toggle('has-mobile-quote-bar',show);\n    if(show)$('mobile-quote-bar-total').textContent=won(scenario.monthly);\n  }\n  function syncMobile(){syncMobileCore();syncComparison();syncQuoteBar()}\n'''
          event_marker="  [carrier,joinType].forEach(el=>el.addEventListener('change',fillDevices));discountMethod.addEventListener('change',fillPlans);deviceSelect.addEventListener('change',fillPlans);planSelect.addEventListener('change',syncMobile);monthsSelect.addEventListener('change',syncMobile);welfareType.addEventListener('change',syncMobile);"
          if wrapper.strip() not in js:
              if event_marker not in js: raise SystemExit('mobile event marker not found')
              js=js.replace(event_marker,wrapper+'\n'+event_marker)

          enhanced_events=event_marker+'''\n  deviceSearch?.addEventListener('input',fillDevices);\n  document.querySelectorAll('.compare-card').forEach(card=>card.addEventListener('click',()=>{discountMethod.value=card.dataset.method;syncMobile()}));\n  $('copy-quote')?.addEventListener('click',()=>copyQuote(true));\n  $('share-quote')?.addEventListener('click',shareQuote);\n  $('consult-quote')?.addEventListener('click',consultQuote);\n  $('mobile-quote-detail')?.addEventListener('click',()=>document.getElementById('mobile-result')?.scrollIntoView({behavior:'smooth',block:'start'}));\n  $('mobile-quote-consult')?.addEventListener('click',consultQuote);'''
          if "deviceSearch?.addEventListener('input',fillDevices);" not in js:
              js=js.replace(event_marker,enhanced_events)

          old_tabs="""  document.querySelectorAll('.rate-tab').forEach(tab=>tab.addEventListener('click',()=>{\n    document.querySelectorAll('.rate-tab').forEach(x=>x.classList.toggle('active',x===tab));\n    document.querySelectorAll('.rate-panel').forEach(panel=>panel.classList.toggle('active',panel.dataset.panel===tab.dataset.tab));\n  }));"""
          new_tabs="""  document.querySelectorAll('.rate-tab').forEach(tab=>tab.addEventListener('click',()=>{\n    document.querySelectorAll('.rate-tab').forEach(x=>x.classList.toggle('active',x===tab));\n    document.querySelectorAll('.rate-panel').forEach(panel=>panel.classList.toggle('active',panel.dataset.panel===tab.dataset.tab));\n    if(typeof syncQuoteBar==='function')syncQuoteBar();\n  }));"""
          if old_tabs in js: js=js.replace(old_tabs,new_tabs)

          js=re.sub(r"data/(catalog|plans|supports|devices-extra|iphone18|mvno-postpaid|prepaid|internet)\.json\?v=[^']+",r"data/\1.json?v=20260915-14",js)

          # 3) Styles for search, comparison cards, consultation CTA and mobile sticky quote bar.
          additions='''\n\n/* Online consulting upgrade */\n.rate-form input[type="search"]{width:100%;min-height:48px;border:1px solid #cddcdf;border-radius:12px;background:#fff;padding:10px 12px;font:inherit;color:#183c48;outline:none;-webkit-appearance:none}.rate-form input[type="search"]:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(15,118,110,.09)}\n.mobile-compare{margin-top:16px;padding:16px;border:1px solid #d5e3e5;border-radius:16px;background:#f8fbfb}.compare-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:12px}.compare-head>div{display:grid;gap:3px}.compare-head strong{font-size:.92rem}.compare-head span{font-size:.68rem;color:var(--muted);line-height:1.4}.compare-head>b{font-size:.7rem;color:var(--teal);background:#e4f2ef;padding:6px 8px;border-radius:999px;white-space:nowrap}.compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.compare-card{display:grid;text-align:left;gap:4px;border:1px solid #d1e0e3;background:#fff;border-radius:14px;padding:13px;color:var(--ink);cursor:pointer;font:inherit}.compare-card.active{border-color:var(--teal);box-shadow:0 0 0 2px rgba(15,118,110,.1)}.compare-card>span{font-size:.72rem;font-weight:900;color:#587079}.compare-card>strong{font-size:1.3rem;letter-spacing:-.04em;color:var(--teal)}.compare-card>small{font-size:.65rem;color:var(--muted)}.compare-card>em,.compare-card>i{font-style:normal;font-size:.69rem;line-height:1.45}.compare-card>em{font-weight:800}.compare-card>i{color:#6d8087}.compare-diff{margin-top:10px;padding:10px 11px;border-radius:11px;background:#eef6f5;color:#476b68;font-size:.72rem;line-height:1.5}.quote-tools{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.quote-tools button{min-height:42px;border:1px solid #cbdadd;border-radius:11px;background:#fff;color:var(--navy);font-weight:900;cursor:pointer}.quote-tools button.primary{grid-column:1/-1;background:var(--navy);border-color:var(--navy);color:#fff}.quote-tools small{grid-column:1/-1;min-height:1.1em;color:var(--teal);font-size:.69rem}.mobile-quote-bar{display:none}\n@media(max-width:760px){.compare-grid{grid-template-columns:1fr}.compare-head{align-items:flex-start;flex-direction:column}.mobile-quote-bar:not([hidden]){position:fixed;display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:7px;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:60;padding:10px;background:rgba(14,52,71,.96);color:#fff;border-radius:16px;box-shadow:0 12px 34px rgba(0,0,0,.22);backdrop-filter:blur(10px)}.mobile-quote-bar-value{display:grid;min-width:0}.mobile-quote-bar-value span{font-size:.62rem;opacity:.72}.mobile-quote-bar-value strong{font-size:1.08rem;letter-spacing:-.035em;white-space:nowrap}.mobile-quote-bar button{border:1px solid rgba(255,255,255,.24);background:transparent;color:#fff;border-radius:10px;min-height:38px;padding:0 11px;font-weight:900}.mobile-quote-bar button.primary{background:#fff;color:var(--navy)}body.has-mobile-quote-bar .rate-content{padding-bottom:135px}}\n'''
          if '/* Online consulting upgrade */' not in css:
              css+=additions

          html_path.write_text(html,encoding='utf-8')
          js_path.write_text(js,encoding='utf-8')
          css_path.write_text(css,encoding='utf-8')
          PY
      - name: Validate changed files
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'id="device-search"' rates.html
          grep -q 'id="mobile-quote-bar"' rates.html
          grep -q 'function syncComparison' assets/rates.js
          grep -q 'function consultQuote' assets/rates.js
          grep -q 'Online consulting upgrade' assets/rates.css
          node --check assets/rates.js
      - name: Commit consulting upgrade
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'woongbts-ui-sync'
          git config user.email 'actions@users.noreply.github.com'
          git add rates.html assets/rates.js assets/rates.css
          if git diff --cached --quiet; then echo 'No UI changes'; exit 0; fi
          git commit -m 'Upgrade rate calculator into online consultation flow'
          git pull --rebase origin main
          git push origin HEAD:main
