name: Normalize mobile plan plus signs once
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize repeated plus signs
        shell: bash
        run: |
          python3 - <<'PY'
          import json, re
          from pathlib import Path

          def normalize(node):
              changed=0
              if isinstance(node,dict):
                  for k,v in list(node.items()):
                      if k in {'data','voice','sms','video'} and isinstance(v,str):
                          nv=re.sub(r'\+{2,}','+',v)
                          if nv!=v: node[k]=nv; changed+=1
                      elif isinstance(v,(dict,list)): changed+=normalize(v)
              elif isinstance(node,list):
                  for v in node: changed+=normalize(v)
              return changed

          total=0
          for rel in ['data/plans.json','data/mobile-public.json','data/mobile-public-expanded.json']:
              p=Path(rel)
              if not p.exists(): continue
              data=json.loads(p.read_text(encoding='utf-8'))
              c=normalize(data); total+=c
              if c: p.write_text(json.dumps(data,ensure_ascii=False,separators=(',',':')),encoding='utf-8')
              print(rel,c)

          p=Path('.github/scripts/daily_wireless_sync.py'); s=p.read_text(encoding='utf-8')
          marker='def clean_plan_text(value):'
          if marker not in s:
              anchor='def clean(value):\n    return " ".join(str(value or "").replace("\\t", " ").split())\n'
              assert anchor in s
              s=s.replace(anchor,anchor+'\n\ndef clean_plan_text(value):\n    # Collapse repeated + separators from public plan feeds.\n    return re.sub(r"\\+{2,}", "+", clean(value))\n',1)
          for field in ('data','voice','sms','video'):
              s=s.replace(f'"{field}": clean(plan.get("{field}"))',f'"{field}": clean_plan_text(plan.get("{field}"))')
          p.write_text(s,encoding='utf-8')

          p=Path('src/rates.js'); s=p.read_text(encoding='utf-8')
          s=re.sub(r'fetch\("data/plans\.json\?v=[^"]+"\)', 'fetch("data/plans.json?v=20260922-1")', s, count=1)
          old='o.mobile_plans=u?.mobile_plans||l?.mobile_plans||[]'
          new='o.mobile_plans=(u?.mobile_plans||l?.mobile_plans||[]).map(e=>({...e,data:String(e?.data||"").replace(/\\+{2,}/g,"+"),voice:String(e?.voice||"").replace(/\\+{2,}/g,"+"),sms:String(e?.sms||"").replace(/\\+{2,}/g,"+"),video:String(e?.video||"").replace(/\\+{2,}/g,"+")}))'
          assert old in s
          s=s.replace(old,new,1); p.write_text(s,encoding='utf-8')

          p=Path('assets/recommendation-engine-v2.js'); s=p.read_text(encoding='utf-8')
          s=re.sub(r"fetch\('data/plans\.json\?v=[^']+'\)\.then\(r=>r\.json\(\)\)", "fetch('data/plans.json?v=20260922-1').then(r=>r.json())", s, count=1)
          old='state.catalog=catalog;state.plans=plans;state.supports=supports;'
          new="state.catalog=catalog;state.plans={...(plans||{}),mobile_plans:(plans?.mobile_plans||[]).map(p=>({...p,data:String(p?.data||'').replace(/\\+{2,}/g,'+'),voice:String(p?.voice||'').replace(/\\+{2,}/g,'+'),sms:String(p?.sms||'').replace(/\\+{2,}/g,'+'),video:String(p?.video||'').replace(/\\+{2,}/g,'+')}))};state.supports=supports;"
          assert old in s
          s=s.replace(old,new,1); p.write_text(s,encoding='utf-8')

          p=Path('assets/pwa.min.js'); s=p.read_text(encoding='utf-8')
          s=re.sub(r'recommendation-engine-v2\.js\?v=[^"&]+','recommendation-engine-v2.js?v=20260922-1',s,count=1)
          p.write_text(s,encoding='utf-8')

          p=Path('rates.html'); s=p.read_text(encoding='utf-8')
          s=re.sub(r'assets/rates\.min\.js\?v=[^"&]+','assets/rates.min.js?v=20260922-1',s,count=1)
          s=re.sub(r'/assets/pwa\.min\.js\?v=[^"&]+','/assets/pwa.min.js?v=20260922-1',s,count=1)
          p.write_text(s,encoding='utf-8')
          print('normalized current fields',total)
          PY
      - name: Rebuild and validate
        shell: bash
        run: |
          python3 .github/scripts/build_rates_asset.py
          node --check src/rates.js
          node --check assets/rates.min.js
          node --check assets/recommendation-engine-v2.js
          node --check assets/pwa.min.js
          python3 -m py_compile .github/scripts/daily_wireless_sync.py
          python3 .github/scripts/build_rates_asset.py --check
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          data=json.loads(Path('data/plans.json').read_text(encoding='utf-8'))
          bad=[]
          for p in data.get('mobile_plans',[]):
              for k in ('data','voice','sms','video'):
                  if isinstance(p.get(k),str) and re.search(r'\+{2,}',p[k]): bad.append((p.get('id'),k,p[k]))
          assert not bad,bad[:10]
          assert 'clean_plan_text(plan.get("data"))' in Path('.github/scripts/daily_wireless_sync.py').read_text(encoding='utf-8')
          print('plus normalization OK')
          PY
          python3 .github/scripts/validate_site.py
      - name: Commit and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "woongbts"
          git config user.email "swb3301@gmail.com"
          rm -f .github/workflows/normalize-plan-plus-once.yml
          git add -A
          git commit -m "Normalize repeated mobile plan plus signs"
          git push origin HEAD:main
