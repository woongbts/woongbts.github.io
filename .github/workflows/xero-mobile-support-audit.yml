name: xero-mobile-support-audit

on:
  push:
    paths:
      - '.github/workflows/xero-mobile-support-audit.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Audit Wide9 support data
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.parse, urllib.request
          ROOT='https://www.xeronote.co.kr'
          REF=ROOT+'/consult/mobile.php'
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36'
          def get(path,params):
              url=ROOT+path+'?'+urllib.parse.urlencode(params)
              req=urllib.request.Request(url,headers={'User-Agent':UA,'Accept':'application/json,text/plain,*/*','Referer':REF})
              with urllib.request.urlopen(req,timeout=30) as r:
                  return json.loads(r.read().decode('utf-8-sig'))
          devs=get('/api/data/get_device_list.php',{
              'telecom_id':'SKT','manufacturer_id':'','sort_type1':'PHONE','sort_type2':'RELEASE_DT_DESC',
              'keyword':'Wide9','search_group':'','search_support_mnp':''
          }).get('data',[]) or []
          print('DEVICES',json.dumps(devs,ensure_ascii=False,indent=2))
          target=None
          for d in devs:
              text=' '.join(str(d.get(k) or '') for k in ['model_name','device_name'])
              if 'Wide9' in text or 'M176S' in text:
                  target=d;break
          if not target:
              raise SystemExit('Wide9 not found')
          did=str(target.get('device_idx'))
          print('DEVICE_IDX',did)
          for join in ['CHANGE','MNP','NEW']:
              for flag in ['','ABLE']:
                  rows=get('/api/data/get_mobile_plan_list.php',{
                      'telecom_id':'SKT','device_idx':did,'plan_group':'','sort_type':'','join_type':join,
                      'join_flag':flag,'plan_idx':'','keyword':''
                  }).get('data',[]) or []
                  hits=[r for r in rows if '라이트 39' in str(r.get('plan_name')) or str(r.get('price')).replace(',','')=='39000']
                  print('\n',join,flag or 'EMPTY','COUNT',len(rows))
                  print(json.dumps(hits[:5],ensure_ascii=False,indent=2))
          PY
