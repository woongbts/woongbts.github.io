name: KT corrected mobile bundle once

on:
  push:
    branches: [tmp-kt-corrected-20260921-work]
    paths:
      - '.github/workflows/kt-corrected-mobile-bundle-once.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply corrected KT mobile bundle calculation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re

          path = Path('data/internet.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          rules = data.get('bundle_rules', [])

          # Remove the previously-added third KT tiers and rebuild the two confirmed tiers.
          remove_ids = {'KT-TOTAL-100-L3', 'KT-TOTAL-500-L3'}
          rules = [r for r in rules if r.get('id') not in remove_ids]
          by_id = {r['id']: r for r in rules}

          expected = {
              'KT-TOTAL-100-L1': {
                  'provider_id': 'KT', 'kind': 'mobile',
                  'name': '총액결합 · 22,000원 미만 · 100M 1,650원 할인',
                  'minimum_speed_mbps': 1, 'maximum_speed_mbps': 100,
                  'discount': 1650, 'source_order': 20,
                  'notes': '모바일 월정액 합계 22,000원 미만 기준 · 인터넷 청구 1,650원 할인 · 예상 인터넷 월요금 21,450원',
              },
              'KT-TOTAL-100-L2': {
                  'provider_id': 'KT', 'kind': 'mobile',
                  'name': '총액결합 · 22,000원 이상 · 100M 3,300원 할인',
                  'minimum_speed_mbps': 1, 'maximum_speed_mbps': 100,
                  'discount': 3300, 'source_order': 21,
                  'notes': '모바일 월정액 합계 22,000원 이상 기준 · 인터넷 청구 3,300원 할인 · 예상 인터넷 월요금 19,800원',
              },
              'KT-TOTAL-500-L1': {
                  'provider_id': 'KT', 'kind': 'mobile',
                  'name': '총액결합 · 22,000원 미만 · 500M 7,700원 할인',
                  'minimum_speed_mbps': 500, 'maximum_speed_mbps': 500,
                  'discount': 7700, 'source_order': 23,
                  'notes': '모바일 월정액 합계 22,000원 미만 기준 · 인터넷 청구 7,700원 할인 · 예상 인터넷 월요금 26,400원',
              },
              'KT-TOTAL-500-L2': {
                  'provider_id': 'KT', 'kind': 'mobile',
                  'name': '총액결합 · 22,000원 이상 · 500M 11,000원 할인',
                  'minimum_speed_mbps': 500, 'maximum_speed_mbps': 500,
                  'discount': 11000, 'source_order': 24,
                  'notes': '모바일 월정액 합계 22,000원 이상 기준 · 인터넷 청구 11,000원 할인 · 예상 인터넷 월요금 23,100원',
              },
          }

          for rid, values in expected.items():
              if rid not in by_id:
                  rules.append({'id': rid, **values})
                  by_id[rid] = rules[-1]
              else:
                  by_id[rid].clear()
                  by_id[rid].update({'id': rid, **values})

          data['bundle_rules'] = rules
          data.setdefault('meta', {})['updated_at'] = '2026-09-21'
          data['meta']['mobile_bundle_note'] = (
              'KT 총액결합 할인은 확인된 인터넷 속도별 두 구간만 자동 계산한다. '
              '100M은 모바일 월정액 합계 22,000원 미만 1,650원 할인, 22,000원 이상 3,300원 할인. '
              '500M은 22,000원 미만 7,700원 할인, 22,000원 이상 11,000원 할인. '
              '1G 등 확인되지 않은 구간은 자동 계산하지 않고 매장 확인으로 안내한다.'
          )
          path.write_text(json.dumps(data, ensure_ascii=False, separators=(',', ':')) + '\n', encoding='utf-8')

          # Bust cached internet data and compiled calculator asset.
          src_path = Path('src/rates.js')
          src = src_path.read_text(encoding='utf-8')
          src, count = re.subn(r'data/internet\.json\?v=\d{8}-\d+', 'data/internet.json?v=20260921-4', src, count=1)
          if count != 1:
              raise SystemExit('internet cache marker not found or duplicated')
          src_path.write_text(src, encoding='utf-8')

          rates_path = Path('rates.html')
          html = rates_path.read_text(encoding='utf-8')
          html, count = re.subn(r'assets/rates\.min\.js\?v=\d{8}-\d+', 'assets/rates.min.js?v=20260921-4', html, count=1)
          if count != 1:
              raise SystemExit('rates asset cache marker not found or duplicated')
          rates_path.write_text(html, encoding='utf-8')

          # Requested calculations.
          assert 23100 - 1650 == 21450
          assert 23100 - 3300 == 19800
          assert 34100 - 7700 == 26400
          assert 34100 - 11000 == 23100
          PY

      - name: Rebuild production rates asset
        run: python .github/scripts/build_rates_asset.py

      - name: Validate site
        shell: bash
        run: |
          python -m json.tool data/internet.json >/dev/null
          node --check src/rates.js
          node --check assets/rates.min.js
          python .github/scripts/build_rates_asset.py --check
          python .github/scripts/validate_site.py
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('data/internet.json').read_text(encoding='utf-8'))
          rules={r['id']:r for r in data['bundle_rules']}
          assert rules['KT-TOTAL-100-L1']['discount']==1650
          assert rules['KT-TOTAL-100-L2']['discount']==3300
          assert rules['KT-TOTAL-500-L1']['discount']==7700
          assert rules['KT-TOTAL-500-L2']['discount']==11000
          assert rules['KT-TOTAL-500-L1']['maximum_speed_mbps']==500
          assert 'KT-TOTAL-100-L3' not in rules
          assert 'KT-TOTAL-500-L3' not in rules
          print('Corrected KT bundle checks OK')
          PY

      - name: Commit update and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/kt-corrected-mobile-bundle-once.yml
          git config user.name 'woongbts'
          git config user.email 'swb3301@gmail.com'
          git add -A
          git commit -m 'Correct KT mobile bundle discounts'
          git push origin HEAD:tmp-kt-corrected-20260921-work
