name: Temporary Style Folder 2 support apply
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-stylefolder-support-apply.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      WIRELESS_SOURCE_BASE_URL: ${{ secrets.WIRELESS_SOURCE_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Refresh public wireless data with pinned Style Folder 2
        run: python3 .github/scripts/daily_wireless_sync.py

      - name: Patch customer UI links and cache versions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,re
          from pathlib import Path

          catalog=json.loads(Path('data/catalog.json').read_text(encoding='utf-8'))
          plans=json.loads(Path('data/plans.json').read_text(encoding='utf-8'))
          supports=json.loads(Path('data/supports.json').read_text(encoding='utf-8'))

          sf=[d for d in catalog.get('devices',[]) if d.get('name')=='스타일폴더2']
          assert len(sf)==2, sf
          by_carrier={d['carrier']:d for d in sf}
          assert set(by_carrier)=={'SKT','LGU+'}, by_carrier
          assert by_carrier['SKT']['model_code']=='AT-M140S'
          assert by_carrier['LGU+']['model_code']=='AT-M140L'
          assert by_carrier['SKT']['id']=='SKT-XD-2636', by_carrier['SKT']['id']
          assert by_carrier['LGU+']['id']=='LG-XD-2637', by_carrier['LGU+']['id']

          plan_by_id={p['id']:p for p in plans.get('mobile_plans',[])}
          def support_for(device_id, join_type, plan_id):
              for rule in supports.get('support_schedules',[]):
                  if device_id in (rule.get('device_ids') or []) and join_type in (rule.get('join_types') or []):
                      amounts=rule.get('amounts') or {}
                      if plan_id in amounts:
                          return amounts[plan_id]
              return None

          # Key public-support sanity checks from the source audit.
          assert support_for('SKT-XD-2636','기기변경','SKT-XP-969')==50000
          assert support_for('SKT-XD-2636','기기변경','SKT-XP-2945')==56000
          assert support_for('LG-XD-2637','기기변경','LG-XP-2550')==193000
          assert support_for('LG-XD-2637','기기변경','LG-XP-2546')==206000

          # Make sure all three join types have verified support for both carriers.
          for did in ('SKT-XD-2636','LG-XD-2637'):
              for join in ('기기변경','번호이동','신규가입'):
                  values=[]
                  for rule in supports.get('support_schedules',[]):
                      if did in (rule.get('device_ids') or []) and join in (rule.get('join_types') or []):
                          values.extend((rule.get('amounts') or {}).values())
                  assert values and any(v is not None for v in values),(did,join)

          # Update homepage calculator link to the real synchronized source ID.
          sp=Path('assets/site-pro.min.js')
          s=sp.read_text(encoding='utf-8')
          s=s.replace('d=SKT-XD-M140S','d=SKT-XD-2636')
          sp.write_text(s,encoding='utf-8')

          # Extra client-side guard for non-handset plans.
          rp=Path('assets/rates.min.js')
          r=rp.read_text(encoding='utf-8')
          marker='|2nddevice/.test(t)'
          if marker in r:
              r=r.replace(marker,'|2nddevice|wearable|웨어러블|데이터나눠쓰기/.test(t)',1)
          r=r.replace('data/catalog.json?v=20260918-4','data/catalog.json?v=20260918-5',1)
          r=r.replace('data/plans.json?v=20260918-3','data/plans.json?v=20260918-4',1)
          r=r.replace('data/supports.json?v=20260918-3','data/supports.json?v=20260918-4',1)
          rp.write_text(r,encoding='utf-8')

          # Cache-bust edited production scripts.
          ip=Path('index.html')
          idx=ip.read_text(encoding='utf-8')
          idx=re.sub(r'assets/site-pro\.min\.js\?v=[^"]+','assets/site-pro.min.js?v=20260918-4',idx,count=1)
          ip.write_text(idx,encoding='utf-8')

          rhp=Path('rates.html')
          rh=rhp.read_text(encoding='utf-8')
          rh=re.sub(r'assets/rates\.min\.js\?v=[^"]+','assets/rates.min.js?v=20260918-7',rh,count=1)
          rhp.write_text(rh,encoding='utf-8')

          # Report key values for the job log without exposing internal data.
          print('SKT Style Folder 2:', by_carrier['SKT']['id'])
          for pid in ('SKT-XP-969','SKT-XP-2945','SKT-XP-2944','SKT-XP-2937'):
              if pid in plan_by_id:
                  print('SKT',plan_by_id[pid]['name'],plan_by_id[pid]['monthly_fee'],support_for('SKT-XD-2636','기기변경',pid))
          print('LGU+ Style Folder 2:', by_carrier['LGU+']['id'])
          for pid in ('LG-XP-2550','LG-XP-2548','LG-XP-2547','LG-XP-2546','LG-XP-2542'):
              if pid in plan_by_id:
                  print('LG',plan_by_id[pid]['name'],plan_by_id[pid]['monthly_fee'],support_for('LG-XD-2637','기기변경',pid))
          PY
          node --check assets/rates.min.js
          node --check assets/site-pro.min.js

      - name: Commit verified data and remove temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/temp-stylefolder-support-audit.yml
          rm -f .github/workflows/temp-stylefolder-support-apply.yml
          git config user.name 'woongbts-data-sync'
          git config user.email 'actions@users.noreply.github.com'
          git add -u
          git add data/catalog.json data/plans.json data/supports.json assets/rates.min.js assets/site-pro.min.js index.html rates.html .github/scripts/daily_wireless_sync.py
          git status --short
          git commit -m 'Sync Style Folder 2 public support schedules'
          git pull --rebase origin main
          git push origin HEAD:main
