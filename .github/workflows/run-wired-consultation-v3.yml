name: run-wired-consultation-v3

on:
  push:
    paths:
      - '.github/workflows/run-wired-consultation-v3.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply wired consultation v3
        run: python scripts/upgrade-wired-consultation-v3.py
      - name: Validate customer page
        run: |
          node --check assets/rates.js
          grep -q 'wired-compare-tool' rates.html
          grep -q 'restoreInternetQuoteFromUrl' assets/rates.js
          grep -q 'Wired consultation v3' assets/rates.css
          ! grep -q '정책표' rates.html
          ! grep -q '경품가이드' rates.html
          ! grep -q '수수료(부가세별도)' rates.html
      - name: Commit upgrade
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rates.html assets/rates.js assets/rates.css
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m 'Upgrade wired comparison and quote workflow'
            git push origin HEAD:main
          fi
