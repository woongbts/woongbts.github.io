name: Remove iPhone 18 preorder video
on:
  push:
    branches: [main]
    paths:
      - 'tmp_remove_iphone18_video.py'
      - '.github/workflows/tmp-remove-iphone18-video.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply patch
        run: python tmp_remove_iphone18_video.py
      - name: Validate JavaScript
        run: node --check assets/site-pro.min.js
      - name: Validate consultation-only banner
        run: |
          python - <<'PY'
          from pathlib import Path
          js=Path('assets/site-pro.min.js').read_text(encoding='utf-8')
          html=Path('index.html').read_text(encoding='utf-8')
          s=js.index('if(!document.getElementById("iphone18-promo")){')
          e=js.index('const m=document.querySelector("#location .actions");', s)
          block=js[s:e]
          assert 'iPhone 18 상담하세요' in block
          assert '조건 확인하기' in block
          assert '사전예약' not in block
          assert 'iphone18-video' not in block
          assert '.mov' not in block
          assert 'site-pro.min.js?v=20260917-4' in html
          print('validation ok')
          PY
      - name: Commit changes and cleanup
        run: |
          rm -f tmp_remove_iphone18_video.py .github/workflows/tmp-remove-iphone18-video.yml
          git config user.name 'woongbts'
          git config user.email 'swb3301@gmail.com'
          git add assets/site-pro.min.js index.html tmp_remove_iphone18_video.py .github/workflows/tmp-remove-iphone18-video.yml
          git commit -m 'Remove iPhone 18 preorder video from homepage'
          git push origin main
