name: Temporary Skylife TV3 pricing patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-skylife-tv3-temp.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Skylife TV3 pricing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          data_path = Path('data/internet.json')
          data = json.loads(data_path.read_text(encoding='utf-8'))
          data.setdefault('meta', {})['updated_at'] = '2026-09-22'
          data['meta']['skylife_note'] = (
              '스카이라이프 일반 IPTV 베이직 TV 2대 월 총액은 WiFi 100M 46,200원, 200M 47,300원, '
              '500M 52,800원, 1G 58,300원으로 반영한다. TV 3대는 추가 IPTV 베이직 8,800원 + '
              '지니TV STB A 3,300원 = 월 12,100원을 더해 100M 58,300원, 200M 59,400원, '
              '500M 64,900원, 1G 70,400원으로 계산한다.'
          )

          rules = data.get('multi_tv_package_totals') or []
          matched = False
          for rule in rules:
              if rule.get('provider_id') == 'SKYLIFE' and rule.get('tv_product_key') == 'TV_IPIT_BASIC':
                  rule['max_tv_count'] = 3
                  totals = rule.setdefault('monthly_totals', {})
                  totals['3'] = {'100': 58300, '200': 59400, '500': 64900, '1000': 70400}
                  rule['additional_tv'] = {'service_fee': 8800, 'settop_fee': 3300, 'unit_total': 12100}
                  matched = True
                  break
          if not matched:
              raise SystemExit('SKYLIFE multi-TV package rule not found')

          data_path.write_text(json.dumps(data, ensure_ascii=False, separators=(',', ':')) + '\n', encoding='utf-8')

          src_path = Path('src/rates.js')
          src = src_path.read_text(encoding='utf-8')
          old = 'fetch("data/internet.json?v=20260922-1")'
          new = 'fetch("data/internet.json?v=20260922-2")'
          if src.count(old) != 1:
              raise SystemExit(f'internet cache marker expected 1 match, got {src.count(old)}')
          src = src.replace(old, new, 1)
          src_path.write_text(src, encoding='utf-8')

          html_path = Path('rates.html')
          html = html_path.read_text(encoding='utf-8')
          old_html = 'assets/rates.min.js?v=20260922-2'
          new_html = 'assets/rates.min.js?v=20260922-3'
          if html.count(old_html) != 1:
              raise SystemExit(f'rates asset marker expected 1 match, got {html.count(old_html)}')
          html_path.write_text(html.replace(old_html, new_html, 1), encoding='utf-8')
          PY

          python3 .github/scripts/build_rates_asset.py
          node --check src/rates.js
          node --check assets/rates.min.js
          python3 .github/scripts/build_rates_asset.py --check
          python3 .github/scripts/validate_site.py

      - name: Commit patch and remove temporary workflow
        run: |
          rm .github/workflows/patch-skylife-tv3-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/internet.json src/rates.js assets/rates.min.js rates.html .github/workflows/patch-skylife-tv3-temp.yml
          git commit -m "Add Skylife TV 3 pricing"
          git push
