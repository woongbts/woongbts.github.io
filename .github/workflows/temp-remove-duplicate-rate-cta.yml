name: Temp remove duplicate rate CTA
on:
  push:
    paths:
      - .github/workflows/temp-remove-duplicate-rate-cta.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch files
        run: |
          python3 -c "from pathlib import Path; p=Path('assets/site-pro.min.js'); s=p.read_text(encoding='utf-8'); a=s.index('    const heroActions=document.querySelector'); b=s.index('    const style=document.createElement', a); p.write_text(s[:a]+s[b:], encoding='utf-8')"
          python3 -c "from pathlib import Path; p=Path('index.html'); s=p.read_text(encoding='utf-8'); old='assets/site-pro.min.js?v=20260918-5'; assert old in s; s=s.replace(old,'assets/site-pro.min.js?v=20260919-1',1); assert s.count('href=\"/rates.html\">내 휴대폰 요금 알아보기</a>') == 1; p.write_text(s,encoding='utf-8')"
          ! grep -q '내 휴대폰 요금 계산 →' assets/site-pro.min.js
          node --check assets/site-pro.min.js
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html assets/site-pro.min.js
          git commit -m 'Remove duplicate homepage rate CTA'
          git push
