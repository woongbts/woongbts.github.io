name: run-consulting-v3

on:
  push:
    paths:
      - '.github/workflows/run-consulting-v3.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply consultation v3
        run: python3 scripts/patch-consulting-v3.py
      - name: Commit changes
        run: |
          git config user.name "woongbts-ui-sync"
          git config user.email "actions@users.noreply.github.com"
          git add rates.html assets/rates.js assets/rates.css
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Add saved quotes transparent calculation and MVNO filters"
          git push origin HEAD:main
