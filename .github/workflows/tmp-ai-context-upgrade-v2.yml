name: Upgrade contextual AI v2

on:
  push:
    paths:
      - '.github/workflows/tmp-ai-context-upgrade-v2.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Make prepaid audit cover all join modes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('tmp_ai_context_upgrade.py')
          s=p.read_text(encoding='utf-8')
          new='''def source_rows(pid):
    merged = {}
    for join_type in ("MNP", "NEW", "CHANGE"):
        for join_flag in ("ABLE", "MAIN"):
            try:
                rows = get_json("/api/data/get_mobile_plan_list.php", {
                    "telecom_id": pid, "device_idx": "", "plan_group": "USIM", "sort_type": "",
                    "join_type": join_type, "join_flag": join_flag, "plan_idx": "", "keyword": ""
                }).get("data") or []
            except Exception:
                continue
            for r in rows:
                if str(r.get("prepay_yn") or "").upper() != "Y":
                    continue
                idx = str(r.get("plan_idx") or "").strip()
                fee = money(r.get("monthly_fee"))
                if not idx or fee is None:
                    continue
                merged[idx] = {
                    "id": f"PRE-{pid}-{idx}",
                    "provider_id": pid,
                    "name": clean(r.get("plan_name")),
                    "network": {"MOBINGSKT":"SKT","FREETSKT":"SKT","MOBINGKT":"KT","FREETKT":"KT","MOBINGLG":"LGU+","FREETLG":"LGU+"}[pid],
                    "monthly_fee": fee,
                    "voice": clean(r.get("voice_offer")),
                    "sms": clean(r.get("sms_offer")),
                    "data": clean(r.get("data_offer")),
                }
    return list(merged.values())


def audit_prepaid():'''
          s2,n=re.subn(r'def source_rows\(pid\):.*?\n\ndef audit_prepaid\(\):',new,s,flags=re.S)
          assert n==1,n
          p.write_text(s2,encoding='utf-8')
          PY
      - name: Audit prepaid plans and patch AI
        run: python tmp_ai_context_upgrade.py
      - name: Check JavaScript
        run: |
          node --check worker.js
          node --check assets/ai-chat.min.js
      - name: Validate customer AI integration
        run: |
          python - <<'PY'
          from pathlib import Path
          w=Path('worker.js').read_text(encoding='utf-8')
          a=Path('assets/ai-chat.min.js').read_text(encoding='utf-8')
          i=Path('index.html').read_text(encoding='utf-8')
          r=Path('rates.html').read_text(encoding='utf-8')
          assert 'answerCurrentCondition' in w
          assert 'answerFromPublicCatalog' in w
          assert 'history:h.slice(-8),context:f()' in a
          assert '이 요금제 괜찮나요?' in a
          assert 'assets/ai-chat.min.js?v=20260917-2' in i
          assert 'assets/ai-chat.min.js?v=20260917-2' in r
          assert 'assets/ai-chat.js?v=20260915-1' not in i
          print('context AI validation ok')
          PY
      - name: Commit upgrade and cleanup
        run: |
          git config user.name "woongbts"
          git config user.email "swb3301@gmail.com"
          git rm tmp_ai_context_upgrade.py .github/workflows/tmp-ai-context-upgrade.yml .github/workflows/tmp-ai-context-upgrade-v2.yml
          git add worker.js assets/ai-chat.min.js index.html rates.html
          git commit -m "Improve contextual customer AI guidance"
          git push
