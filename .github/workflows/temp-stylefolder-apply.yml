name: Temporary Style Folder 2 apply
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-stylefolder-apply.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Add Style Folder 2 and restore homepage card
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, re, math
          from pathlib import Path

          catalog_path=Path('data/catalog.json')
          c=json.loads(catalog_path.read_text(encoding='utf-8'))
          devices=c.get('devices') or []

          if any(d.get('model_code') in ('AT-M140S','AT-M140L') or d.get('name')=='스타일폴더2' for d in devices):
              raise SystemExit('Style Folder 2 already exists; aborting to avoid duplicates')

          def ref_device(carrier):
              for d in devices:
                  if d.get('carrier')==carrier and d.get('name')=='갤럭시 A17 LTE':
                      return d
              raise SystemExit(f'reference A17 LTE not found for {carrier}')

          specs={
              'cpu':'MT6765X / 2.2GHz + 1.6GHz Quad Core',
              'display':'IPS LCD (WVGA)',
              'main_screen':'4.3인치',
              'front_camera':'500만 화소',
              'rear_camera':'800만 화소',
              'ram':'3GB',
              'storage':'32GB',
              'dimensions':'127.8 x 65.3 x 16.9mm',
              'weight':'195g',
              'battery':'2,100mAh',
              'charging':'USB Type-C',
              'os':'Android 14 Go Edition',
              'easy_payment':'미지원',
              'water_resistance':'미지원',
              'fingerprint':'미지원',
              'wireless_charging':'미지원',
              'film_attached':'미부착',
              'external_memory':'미지원'
          }

          added=[]
          for carrier, did, model_code in [
              ('SKT','SKT-XD-M140S','AT-M140S'),
              ('LGU+','LG-XD-M140L','AT-M140L'),
          ]:
              ref=ref_device(carrier)
              rec={
                  'id':did,
                  'carrier':carrier,
                  'name':'스타일폴더2',
                  'model':'AT-M140',
                  'model_code':model_code,
                  'manufacturer':'ALT',
                  'release_date':'2025-01-24',
                  'retail_price':237600,
                  'factory_price_date':'2025-01-24',
                  'announce_date':'2025-01-24',
                  'network_type':'LTE',
                  'source_order':ref.get('source_order'),
                  'installment_months':[24,30,36],
                  'eligible_plan_ids':list(ref.get('eligible_plan_ids') or []),
                  'eligible_plan_ids_by_join_type':{
                      k:list(v or []) for k,v in (ref.get('eligible_plan_ids_by_join_type') or {}).items()
                  },
                  'specs':dict(specs),
                  'form_factor':'폴더',
                  'colors':['인디고블랙','펄화이트']
              }
              devices.append(rec)
              added.append(rec)

          c['devices']=devices
          catalog_path.write_text(json.dumps(c,ensure_ascii=False,separators=(',',':')),encoding='utf-8')

          # Cache-bust catalog/plans/supports requests because catalog changed.
          rates_path=Path('assets/rates.min.js')
          rates=rates_path.read_text(encoding='utf-8')
          old='data/catalog.json?v=20260918-3'
          if old not in rates:
              raise SystemExit('catalog fetch cache token not found')
          rates=rates.replace(old,'data/catalog.json?v=20260918-4',1)
          rates_path.write_text(rates,encoding='utf-8')

          # Restore the verified Style Folder 2 parent-focused homepage card.
          home_path=Path('assets/site-pro.min.js')
          home=home_path.read_text(encoding='utf-8')
          card_re=re.compile(r'<article class="deal-card" data-calculator-url="[^"]+">\s*<div class="deal-media"><span class="deal-tag">부모님용</span>.*?</article>',re.S)
          matches=card_re.findall(home)
          if len(matches)!=1:
              raise SystemExit(f'expected one parent card, found {len(matches)}')
          url='/rates.html?tab=mobile&amp;c=SKT&amp;j=%EA%B8%B0%EA%B8%B0%EB%B3%80%EA%B2%BD&amp;d=SKT-XD-M140S&amp;p=SKT-XP-969&amp;m=contract&amp;mo=24&amp;w=basic_pension'
          card=f'''<article class="deal-card" data-calculator-url="{url}">
            <div class="deal-media"><span class="deal-tag">부모님용</span><span class="deal-device-icon" aria-hidden="true">📱</span></div>
            <div class="deal-body"><span class="deal-carrier">SKT</span><h3>스타일폴더2</h3><p class="deal-plan">T플랜 세이브 33,000원 · 선택약정 24개월</p><div class="deal-price"><small>기초연금 수급자 할인 적용 예시</small><strong>23,170원<span>/월</span></strong></div><p class="deal-fit">물리 키패드와 터치스크린을 함께 원하는 부모님께</p><a class="deal-link" href="{url}">내 조건으로 다시 계산 →</a></div>
          </article>'''
          home=card_re.sub(card,home,count=1)
          home_path.write_text(home,encoding='utf-8')

          # Cache-bust edited production assets.
          rates_html=Path('rates.html')
          rh=rates_html.read_text(encoding='utf-8')
          rh=re.sub(r'assets/rates\.min\.js\?v=[^"]+','assets/rates.min.js?v=20260918-5',rh,count=1)
          rates_html.write_text(rh,encoding='utf-8')

          index_path=Path('index.html')
          idx=index_path.read_text(encoding='utf-8')
          idx=re.sub(r'assets/site-pro\.min\.js\?v=[^"]+','assets/site-pro.min.js?v=20260918-2',idx,count=1)
          index_path.write_text(idx,encoding='utf-8')

          # Integrity checks.
          plans_data=json.loads(Path('data/plans.json').read_text(encoding='utf-8'))
          plans={p.get('id') for p in (plans_data.get('mobile_plans') or [])}
          assert len([d for d in devices if d.get('name')=='스타일폴더2'])==2
          assert {d['carrier'] for d in added}=={'SKT','LGU+'}
          assert not any(d.get('carrier')=='KT' and d.get('name')=='스타일폴더2' for d in devices)
          for d in added:
              assert d['retail_price']==237600
              assert d['network_type']=='LTE'
              assert d['model_code'] in ('AT-M140S','AT-M140L')
              for ids in d['eligible_plan_ids_by_join_type'].values():
                  missing=[pid for pid in ids if pid not in plans]
                  assert not missing,(d['id'],missing[:5])
          supports=c.get('mobile_supports') or []
          assert not any(s.get('device_id') in {'SKT-XD-M140S','LG-XD-M140L'} for s in supports), 'unverified public support must not be added'

          # Verify displayed homepage example with the site's 5.9% installment formula.
          P=237600; mr=.059/12; months=24
          factor=(1+mr)**months
          device_month=P*mr*factor/(factor-1)
          plan_after=33000*.75
          welfare=min(12100,.5*plan_after)
          total=round(device_month + plan_after - welfare)
          assert total==23170,total
          print('Style Folder 2 data validated:',[(d['carrier'],d['model_code']) for d in added],'example',total)
          PY
          node --check assets/rates.min.js
          node --check assets/site-pro.min.js
          grep -q 'SKT-XD-M140S' assets/site-pro.min.js
          grep -q 'assets/rates.min.js?v=20260918-5' rates.html
          grep -q 'assets/site-pro.min.js?v=20260918-2' index.html

      - name: Publish and clean temporary files
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/temp-stylefolder-audit.yml .github/workflows/temp-stylefolder-apply.yml
          git config user.name 'woongbts-site-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -u
          git add data/catalog.json assets/rates.min.js assets/site-pro.min.js rates.html index.html
          git status --short
          git commit -m 'Add Style Folder 2 for SKT and LGU+'
          git push origin HEAD:main
