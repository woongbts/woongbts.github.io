name: Deploy private CRM

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .github/crm
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CRM_D1_DATABASE_ID: ${{ secrets.CRM_D1_DATABASE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CRM_D1_DATABASE_ID; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required GitHub Actions secret: $name" >&2
              exit 1
            fi
          done
      - name: Install and build
        run: npm install --ignore-scripts && npm run check && npm run build
      - name: Create deployment config
        shell: bash
        run: |
          cat > wrangler.toml <<EOF
          name = "woongbi-crm"
          main = "src/worker.js"
          compatibility_date = "2026-09-01"
          keep_vars = true

          [assets]
          directory = "./dist"
          binding = "ASSETS"

          [[d1_databases]]
          binding = "DB"
          database_name = "woongbi-crm"
          database_id = "${CRM_D1_DATABASE_ID}"

          [secrets]
          required = ["CRM_DATA_KEY_B64", "CRM_HMAC_KEY_B64"]
          EOF
      - name: Apply database schema
        run: npx wrangler d1 execute woongbi-crm --remote --file=migrations/0001_init.sql
      - name: Deploy CRM Worker and preserve dashboard vars
        run: npx wrangler deploy --keep-vars
