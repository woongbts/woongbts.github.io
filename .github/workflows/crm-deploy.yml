name: Deploy private CRM

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/crm/**'
      - '.github/workflows/crm-deploy.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .github/crm
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require deployment token
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo 'Missing required GitHub Actions secret: CLOUDFLARE_API_TOKEN' >&2
            exit 1
          fi
      - name: Install and build
        run: npm install --ignore-scripts && npm run check && npm run build
      - name: Create deployment config
        shell: bash
        run: |
          cat > wrangler.toml <<'EOF'
          name = "woongbi-crm"
          main = "src/worker.js"
          compatibility_date = "2026-09-01"
          account_id = "79442ff839ce3fbee6caebe3285c1013"
          keep_vars = true

          [assets]
          directory = "./dist"
          binding = "ASSETS"

          [[d1_databases]]
          binding = "DB"
          database_name = "woongbi-crm"
          database_id = "bc27cc13-1a30-44f0-831e-dffdad6a68f6"
          EOF
      - name: Verify deployment target
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'name = "woongbi-crm"' wrangler.toml
          grep -F 'database_name = "woongbi-crm"' wrangler.toml
      - name: Deploy CRM Worker and preserve dashboard vars/secrets
        run: npx wrangler deploy --config wrangler.toml --name woongbi-crm --keep-vars
