name: Fix purpose recommendation device images

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-purpose-device-images.yml'
      - '.github/scripts/fix_purpose_device_images.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply shared device images to purpose cards
        run: python3 .github/scripts/fix_purpose_device_images.py
      - name: Validate JavaScript
        run: |
          node --check src/rates.js
          node --check assets/rates.min.js
          node --check assets/recommendation-engine-v2.js
          node --check assets/pwa.min.js
          node --check sw.js
          cmp -s src/rates.js assets/rates.min.js
      - name: Verify canonical calculator source
        run: python3 .github/scripts/build_rates_asset.py --check
      - name: Run site regression checks
        run: python3 .github/scripts/validate_site.py
      - name: Commit production fix
        run: |
          if git diff --quiet; then
            echo "No production changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/rates.js assets/rates.min.js assets/recommendation-engine-v2.js assets/pwa.min.js rates.html sw.js
          git commit -m "Show shared device images in purpose recommendations"
          git push
