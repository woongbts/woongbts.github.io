name: Fix kids-only devices and customer copy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-fix-kids-devices-copy.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python tmp_fix_kids_devices_and_copy.py
      - name: Check JavaScript syntax
        run: node --check assets/rates.js
      - name: Verify kids-only classification and copy
        run: |
          grep -q "포켓피스" assets/rates.js
          grep -q "zem폰" assets/rates.js
          grep -q "사용량과 월 부담의 균형이 좋은 휴대폰 요금제" assets/rates.js
          ! grep -q "휴대폰용 월 33,000원 이상" assets/rates.js
          grep -q "assets/rates.js?v=20260916-23" rates.html
      - name: Validate current catalog labels
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          data=json.loads(Path('data/catalog.json').read_text(encoding='utf-8'))
          devices=data.get('devices',[])
          pocket=[d for d in devices if re.search(r'ZEM.*포켓피스|포켓피스|pocketpiece', f"{d.get('name','')} {d.get('model','')} {d.get('model_code','')}", re.I)]
          a17=[d for d in devices if re.search(r'갤럭시\s*A17\s*LTE|Galaxy\s*A17', f"{d.get('name','')} {d.get('model','')}", re.I) and not re.search(r'키즈|무너|ZEM|포켓', f"{d.get('name','')}", re.I)]
          assert pocket, 'Pocketpiece device not found in current catalog'
          assert a17, 'General A17 device not found in current catalog'
          print('kids-only pocketpiece:', [d.get('name') for d in pocket[:10]])
          print('general A17:', [d.get('name') for d in a17[:10]])
          PY
      - name: Commit result
        run: |
          git config user.name "woongbts"
          git config user.email "swb3301@gmail.com"
          git add assets/rates.js rates.html
          git commit -m "Classify ZEM phones as kids devices and soften recommendation copy" || exit 0
          git push
