name: Temporary privacy footer patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/privacy-footer-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add privacy officer and policy link to homepage footer
        shell: python
        run: |
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old_owner = '<p>대표자 : 신웅비</p>'
          new_owner = '<p>대표자 : 신웅비</p><p>개인정보 보호책임자 : 신웅비</p>'
          if new_owner not in text:
              assert old_owner in text, 'owner footer marker not found'
              text = text.replace(old_owner, new_owner, 1)
          old_link = '<p><a class="cert-link" href="/links.html">블로그·SNS 모아보기 →</a></p>'
          new_link = old_link + '<p><a class="cert-link" href="/privacy.html">개인정보 처리방침 →</a></p>'
          if 'href="/privacy.html"' not in text:
              assert old_link in text, 'footer link marker not found'
              text = text.replace(old_link, new_link, 1)
          path.write_text(text, encoding='utf-8')
          assert '개인정보 보호책임자 : 신웅비' in text
          assert 'href="/privacy.html"' in text
      - name: Validate privacy page
        shell: python
        run: |
          from pathlib import Path
          p = Path('privacy.html').read_text(encoding='utf-8')
          required = ['개인정보 처리방침','개인정보 보호책임자: 신웅비','051-343-7677','시행일: 2026년 9월 19일']
          for item in required:
              assert item in p, item
      - name: Commit homepage privacy disclosure
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Show privacy officer and policy on homepage'
          git push origin HEAD:main
