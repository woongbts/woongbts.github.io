name: Temporary homepage CSS cache bump
on:
  push:
    paths:
      - '.github/workflows/temp-bump-homepage-css.yml'
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bump homepage CSS cache
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s,n=re.subn(r'assets/site-pro\.css\?v=[^"\']+','assets/site-pro.css?v=20260920-1',s,count=1)
          if n!=1: raise SystemExit('site-pro.css cache marker not found')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit cache bump
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Refresh homepage CSS cache'
          git pull --rebase origin main
          git push
