name: Finalize MVNO server migration

on:
  push:
    branches:
      - hardening/private-mvno-assortment
    paths:
      - '.github/scripts/finalize_mvno_server_migration.mjs'
      - '.github/workflows/finalize-mvno-server-migration.yml'

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/private-mvno-assortment
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Add permanent MVNO server validation
        run: node .github/scripts/finalize_mvno_server_migration.mjs
      - name: Validate complete public site
        run: |
          node --check assets/mvno-api-bridge.min.js
          node --check assets/mvno-display.js
          node .github/scripts/test_mvno_display.cjs
          python3 .github/scripts/build_rates_asset.py --check
          python3 .github/scripts/validate_site.py
          test ! -e data/mvno-postpaid.json
          ! grep -q 'data/mvno-postpaid.json' src/rates.js
          ! grep -q 'MMOBILE-1295' assets/mvno-display.js
          grep -q '/catalog/mvno' assets/mvno-api-bridge.min.js
      - name: Commit validation guard
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/scripts/validate_site.py
          git diff --cached --quiet && exit 0
          git commit -m 'Guard server-owned MVNO assortment'
          git push origin HEAD:hardening/private-mvno-assortment
