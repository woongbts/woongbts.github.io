name: Site regression guard

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'rates.html'
      - 'manduk-mobile.html'
      - 'privacy.html'
      - 'sw.js'
      - 'assets/**'
      - 'src/**'
      - 'data/**'
      - '.github/scripts/**'
      - '.github/workflows/site-regression.yml'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript
        run: |
          node --check assets/rates.min.js
          node --check assets/site-pro.min.js
          node --check assets/ai-chat.min.js
          node --check assets/mobile-menu.js
          node --check assets/pwa.min.js
          node --check assets/recommendation-engine-v2.js
          node --check assets/quote-api-bridge.min.js
          node --check assets/recommend-api-bridge.min.js
          node .github/scripts/test_support_integrity.cjs
          node .github/scripts/test_home_recommendations.cjs
          node .github/scripts/test_recommendation_methods.cjs
          node --check assets/plan-eligibility.js
          node --check assets/device-images.js
          python3 .github/scripts/test_official_support.py
          node --check assets/conversion-tracker.min.js
          node --check assets/site-analytics.min.js
          node .github/scripts/test_site_source.cjs
          node --check assets/mvno-display.js
          node .github/scripts/test_mvno_display.cjs
          node --check assets/analytics-config.js
          node .github/scripts/test_naver_common.cjs
          node --check sw.js
          grep -q 'recommendation-engine-v2.js' assets/pwa.min.js
          grep -q 'WoongbiRecommendationV2' assets/recommendation-engine-v2.js
          grep -q '24개월 총부담 우선' assets/recommendation-engine-v2.js
          grep -q '사용 편의 우선' assets/recommendation-engine-v2.js
          grep -q '공시지원 우선' assets/recommendation-engine-v2.js
      - name: Validate Python safety scripts
        run: python3 -m py_compile .github/scripts/daily_wireless_sync.py .github/scripts/build_rates_asset.py .github/scripts/validate_site.py .github/scripts/update_sitemap.py
      - name: Verify canonical calculator source
        run: python3 .github/scripts/build_rates_asset.py --check
      - name: Verify wireless change report
        run: python3 .github/scripts/test_wireless_report.py
      - name: Verify customer support notice
        run: |
          node --check assets/quote-handoff.js
          node .github/scripts/test_customer_ui.cjs
          node --check assets/support-notice.js
          node --check assets/store-sale-policy.js
          node .github/scripts/test_sale_policy.cjs
          python3 .github/scripts/test_support_notice.py
      - name: Run site regression checks
        run: python3 .github/scripts/validate_site.py
