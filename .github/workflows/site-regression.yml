name: Site regression guard

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'rates.html'
      - 'manduk-mobile.html'
      - 'privacy.html'
      - 'sw.js'
      - 'worker.js'
      - 'wrangler.jsonc'
      - 'assets/**'
      - 'src/**'
      - 'data/**'
      - '.github/scripts/**'
      - '.github/workflows/site-regression.yml'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript
        run: |
          node --check assets/rates.min.js
          node --check assets/site-pro.min.js
          node --check assets/ai-chat.min.js
          node --check assets/mobile-menu.js
          node --check assets/rates-deeplink.js
          node --check assets/quick-order.js
          node --check rental/assets/ai-recommend.js
          node .github/scripts/test_rental_ai_priority.cjs
          node .github/scripts/test_quick_order.cjs
          node --check assets/store-applications.js
          node .github/scripts/test_store_applications_ui.cjs
          node --check assets/pwa.min.js
          node --check assets/quote-api-bridge.min.js
          node --check assets/recommend-api-bridge.min.js
          node --check assets/home-recommend-api.min.js
          node --check assets/home-intelligence-loader.js
          node --check assets/quote-advice.js
          node --check assets/kids-promos-data.js
          node --check assets/funnel-observer.js
          node --check assets/plan-recommend-api-bridge.min.js
          node --check assets/studyphone-api-bridge.min.js
          node --check assets/internet-api-bridge.min.js
          node --check assets/internet-ui.min.js
          node --check assets/mvno-api-bridge.min.js
          node .github/scripts/test_support_integrity.cjs
          node .github/scripts/test_home_recommendations.cjs
          node --check assets/plan-eligibility.js
          node --check assets/device-images.js
          python3 .github/scripts/test_official_support.py
          node --check assets/conversion-tracker.min.js
          node --check assets/site-analytics.min.js
          node .github/scripts/test_site_source.cjs
          node --check assets/mvno-display.js
          node .github/scripts/test_mvno_display.cjs
          node --check assets/analytics-config.js
          node .github/scripts/test_naver_common.cjs
          node --check sw.js
          node --check worker.js
          grep -q 'AI_CORE.fetch' worker.js
          ! grep -q 'systemPrompt' worker.js
          ! grep -q '@cf/' worker.js
          ! grep -q 'answerKnownQuestion' worker.js
          grep -q '"binding": "AI_CORE"' wrangler.jsonc
          grep -q '"service": "woongb-ai-core"' wrangler.jsonc
          ! grep -q '"ai"' wrangler.jsonc
          test ! -e assets/recommendation-engine-v2.js
          ! grep -q 'recommendation-engine-v2.js' assets/pwa.min.js
          ! grep -q 'recommendation-engine-v2.js' sw.js
          ! grep -q 'recommendation-engine-v2.js' index.html
          grep -q 'home-intelligence-loader.js' index.html
          grep -q 'home-recommend-api.min.js' assets/home-intelligence-loader.js
          grep -q 'home-recommend-api.min.js' sw.js
          grep -q '/recommend/purpose' assets/home-recommend-api.min.js
          grep -q 'WoongbiRecommendationV2' assets/home-recommend-api.min.js
          grep -q '/recommend/purpose' assets/recommend-api-bridge.min.js
          grep -q '/recommend/quick' assets/recommend-api-bridge.min.js
          grep -q '공시지원금' assets/recommend-api-bridge.min.js
          grep -q '선택약정 25%' assets/recommend-api-bridge.min.js
          grep -q 'aria-pressed' assets/recommend-api-bridge.min.js
          grep -q '/recommend/plans' assets/plan-recommend-api-bridge.min.js
          grep -q 'WoongbiPlanRecommendApi' assets/plan-recommend-api-bridge.min.js
          grep -q 'WoongbiPlanRecommendApi' src/rates.js
          grep -q 'plan-recommend-api-bridge.min.js' rates.html
          grep -q 'plan-recommend-api-bridge.min.js' sw.js
          ! grep -q 'function wbGeneralRecommendPlan' src/rates.js
          ! grep -q '월 기본료를 낮춰 시작하기 좋은 일반 요금제' src/rates.js
          ! grep -q '월 부담과 데이터 제공량을 함께 비교하기 좋은 구간' src/rates.js
          ! grep -q '영상·SNS 사용량이 많은 경우 먼저 비교하기 좋은 구성' src/rates.js
          ! grep -q '데이터 무제한 표기가 있는 요금제 중 월 부담이 낮은 구성' src/rates.js
          ! grep -q '콘텐츠·구독·디바이스 혜택이 요금제명에 명시된 구성' src/rates.js
          ! grep -q '가입 가능한 일반 요금제 중 월 기본료가 낮은 순서로 함께 비교' src/rates.js
          ! grep -q '"recommendation_policy"' data/store-overrides.json
          grep -q '"pinned_devices"' data/store-overrides.json
          grep -q '/quote/studyphone' assets/studyphone-api-bridge.min.js
          grep -q 'WoongbiStudyphoneApi' assets/studyphone-api-bridge.min.js
          test ! -e data/studyphone.json
          ! grep -q 'installment_apr' src/rates.js
          ! grep -q 'public_support' src/rates.js
          ! grep -q 'function Qe(e){const t=l?.device' src/rates.js
          ! grep -q 'Math.pow(1+o,t)' src/rates.js
          grep -q '/quote/internet' assets/internet-api-bridge.min.js
          grep -q 'WoongbiInternetApi' assets/internet-api-bridge.min.js
          grep -q 'WoongbiInternetApi' assets/internet-ui.min.js
          test ! -e data/internet.json
          ! grep -q 'fallbackSettopFee' src/rates.js
          ! grep -q 'internetDiscountBySpeed' src/rates.js
          ! grep -q 'wbWiredPackageOverride' src/rates.js
          ! grep -q 'SKB_TV_POP180:{100:30' src/rates.js
          ! grep -q 'TV_SMART_PLUS:{100:29' src/rates.js
          ! grep -q 'const Mt=t("internet-carrier")' src/rates.js
          ! grep -q 'data/internet.json' src/rates.js
          grep -q '/catalog/mvno' assets/mvno-api-bridge.min.js
          grep -q 'WoongbiMvnoApi' assets/mvno-api-bridge.min.js
          grep -q 'WoongbiMvnoApi' src/rates.js
          test ! -e data/mvno-postpaid.json
          ! grep -q 'data/mvno-postpaid.json' src/rates.js
          ! grep -q 'MMOBILE-1295' assets/mvno-display.js
          ! grep -q 'SKYLIFE-2069' assets/mvno-display.js
          ! grep -q 'UPLUSE-2390' assets/mvno-display.js
          ! grep -q 'SMKT' assets/mvno-display.js
          ! grep -q 'IYAGISKT' assets/mvno-display.js
          ! grep -q 'const fe={senior:' src/rates.js
          ! grep -q 'jump5:{category:"value"' src/rates.js
          ! grep -q 'function Ke(){' src/rates.js
          ! grep -q 'profiles={light:{min:3e4' src/rates.js
          ! grep -q 'const devices=(o?.devices||\[\]).filter(e=>e.carrier===carrier&&V(e,brand)' src/rates.js
      - name: Validate Python safety scripts
        run: python3 -m py_compile .github/scripts/daily_wireless_sync.py .github/scripts/build_rates_asset.py .github/scripts/validate_site.py .github/scripts/update_sitemap.py
      - name: Verify canonical calculator source
        run: python3 .github/scripts/build_rates_asset.py --check
      - name: Verify wireless change report
        run: python3 .github/scripts/test_wireless_report.py
      - name: Verify customer support notice
        run: |
          node --check assets/quote-handoff.js
          node .github/scripts/test_customer_ui.cjs
          node --check assets/support-notice.js
          node --check assets/store-sale-policy.js
          node .github/scripts/test_sale_policy.cjs
          python3 .github/scripts/test_support_notice.py
      - name: Run site regression checks
        run: python3 .github/scripts/validate_site.py
