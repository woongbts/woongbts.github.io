name: run-add-skt-internet-gifts

on:
  push:
    paths:
      - '.github/workflows/run-add-skt-internet-gifts.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply SKT provider and customer gift policy
        run: python scripts/add-skt-and-internet-gifts.py
      - name: Commit changes
        run: |
          if git diff --quiet -- data/internet.json assets/rates.js rates.html; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'woongbts-ui-sync'
          git config user.email 'actions@users.noreply.github.com'
          git add data/internet.json assets/rates.js rates.html
          git commit -m 'Add SKT wired plans and customer gift maxima'
          git push origin main
