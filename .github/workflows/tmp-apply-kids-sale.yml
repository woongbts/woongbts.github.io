name: Apply kids sale cards
on:
  push:
    paths:
      - 'tmp_apply_kids_sale.py'
      - '.github/workflows/tmp-apply-kids-sale.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply kids sale patch
        run: python tmp_apply_kids_sale.py
      - name: Check JavaScript syntax
        run: node --check assets/rates.js
      - name: Verify sale rules
        run: |
          grep -q "purposeCuratedKidsRows" assets/rates.js
          grep -q "if(purposeCategory==='kids')return purposeCuratedKidsRows" assets/rates.js
          grep -q "기기값 0원 특가" assets/rates.js
          grep -q "신규가입 한정" assets/rates.js
          grep -q "ZEM폰 포켓피스" assets/rates.js
          grep -q "폼폼푸린 키즈폰" assets/rates.js
          grep -q "갤럭시 A17 키즈폰 무너2" assets/rates.js
          grep -q "Kids phone sale cards 2026-09-16" assets/rates.css
          grep -q "assets/rates.css?v=20260916-17" rates.html
          grep -q "assets/rates.js?v=20260916-29" rates.html
      - name: Validate supplied quote totals
        run: |
          python - <<'PY'
          rows={
            '포켓피스':(0,14850,14850),
            '폼폼푸린':(0,24000,24000),
            '무너2':(0,28000,28000),
          }
          for name,(device,service,total) in rows.items():
              assert device+service==total,(name,device+service,total)
              print(name,total,total*24)
          PY
      - name: Commit result
        run: |
          git config user.name "woongbts"
          git config user.email "swb3301@gmail.com"
          git add assets/rates.js assets/rates.css rates.html
          git commit -m "Add new-signup kids phone sale cards" || exit 0
          git push
