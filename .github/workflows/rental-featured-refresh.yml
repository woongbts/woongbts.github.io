name: Refresh rental featured data

on:
  push:
    branches: [main]
    paths:
      - 'rental/data/products.json'
      - 'rental/data/appliance-gift-options.json'
      - 'rental/data/catalog-overrides.json'
      - 'scripts/build-rental-featured.py'
      - '.github/workflows/rental-featured-refresh.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rental-featured-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build lightweight featured payload
        run: python scripts/build-rental-featured.py
      - name: Commit only when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- rental/data/featured.json; then
            echo 'featured.json is already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rental/data/featured.json
          git commit -m 'Refresh rental featured data'
          git pull --rebase origin main
          git push
