name: Temporary CRM import preview patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-crm-import-preview.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply CRM import preview patch
        run: python .github/crm/scripts/temp_patch_import_preview.py
      - name: CRM checks
        working-directory: .github/crm
        run: npm install --ignore-scripts --no-audit --no-fund && npm run check && npm run build
      - name: Prevent customer data in commit
        shell: bash
        run: |
          set -euo pipefail
          ! git diff --name-only | grep -E '\.(xlsx?|csv)$' || (echo 'Customer spreadsheet detected' && exit 1)
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/crm/src/worker.js .github/crm/web/app.js
          git commit -m 'Add CRM import preflight counts'
          git push origin HEAD:main
