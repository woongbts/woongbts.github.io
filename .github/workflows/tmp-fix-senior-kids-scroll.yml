name: Fix senior kids recommendations and plan picker scroll

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-fix-senior-kids-scroll.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply fixes
        run: python tmp_fix_senior_kids_scroll.py
      - name: Check JavaScript syntax
        run: node --check assets/rates.js
      - name: Verify recommendation rules
        run: |
          grep -q "purposeIsKidsOnlyDevice" assets/rates.js
          grep -q "purposeKidsDeviceRank" assets/rates.js
          grep -q "purposeIsLowCostDevice(d)&&!purposeIsKidsOnlyDevice(d)" assets/rates.js
          grep -q "purposeSeniorDeviceRank(a.d)-purposeSeniorDeviceRank(b.d)" assets/rates.js
          grep -q "body.plan-picker-opened{overflow:auto}" assets/rates.css
          grep -q ".plan-picker-backdrop{pointer-events:none}" assets/rates.css
          grep -q ".plan-picker-sheet{pointer-events:auto" assets/rates.css
          ! grep -q 'aria-modal="true" aria-labelledby="plan-picker-title"' rates.html
      - name: Validate current catalog labels
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          data=json.loads(Path('data/catalog.json').read_text(encoding='utf-8'))
          devices=data.get('devices',[])
          mooneo=[d for d in devices if re.search(r'무너2|무너키즈|mooner2|mooner', f"{d.get('name','')} {d.get('model','')} {d.get('model_code','')}", re.I)]
          a17=[d for d in devices if re.search(r'갤럭시\s*A17|Galaxy\s*A17|SM-A175', f"{d.get('name','')} {d.get('model','')} {d.get('model_code','')}", re.I)]
          assert mooneo, 'Mooneo2 device not found in current catalog'
          assert a17, 'A17 device not found in current catalog'
          print('kids-only devices:', [d.get('name') for d in mooneo[:10]])
          print('A17 devices:', [d.get('name') for d in a17[:10]])
          PY
      - name: Check HTML duplicate ids
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          s=Path('rates.html').read_text(encoding='utf-8')
          ids=re.findall(r'\bid="([^"]+)"',s)
          dup=sorted({x for x in ids if ids.count(x)>1})
          assert not dup, f'duplicate ids: {dup}'
          print('duplicate id check ok')
          PY
      - name: Commit result
        run: |
          git config user.name "woongbts"
          git config user.email "swb3301@gmail.com"
          git add assets/rates.js assets/rates.css rates.html
          git commit -m "Fix senior kids recommendations and plan picker scroll" || exit 0
          git push
