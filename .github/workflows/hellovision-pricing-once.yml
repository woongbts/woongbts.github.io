name: Hellovision pricing once
on:
  push:
    branches: [tmp-hellovision-20260921-work]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-hellovision-20260921-work
      - name: Apply Hellovision marked products
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          data_path = Path('data/internet.json')
          data = json.loads(data_path.read_text(encoding='utf-8'))
          data.setdefault('meta', {})['updated_at'] = '2026-09-21'
          data['meta']['hellovision_note'] = (
              '헬로비전은 제공 이미지에서 빨간 표시된 상품만 반영. 인터넷 단독은 WiFi 100M 21,890원, '
              '160M 27,610원, 500M 31,460원, 1G 33,000원. TV 결합은 알뜰형+HD와 이코노미만 제공하며 '
              '속도별 패키지 총액을 반영한다. 고객사은품 최대 금액은 현금+상품권 합산 기준.'
          )

          internet_updates = {
              'INT-LGHELLO-INTERNET_100M_LITE_PLUS': ('WiFi + 100M', 100, 21890, 1),
              'INT-LGHELLO-INTERNET_100M': ('WiFi + 160M', 160, 27610, 2),
              'INT-LGHELLO-INTERNET_GIGA_LITE': ('WiFi + 500M', 500, 31460, 3),
              'INT-LGHELLO-INTERNET_GIGA_P': ('WiFi + 1G', 1000, 33000, 4),
          }
          for item in data.get('internet_products', []):
              if item.get('id') in internet_updates:
                  name, speed, fee, order = internet_updates[item['id']]
                  item['name'] = name
                  item['speed_mbps'] = speed
                  item['monthly_fee'] = fee
                  item['source_order'] = order

          keep_tv = {'TV-LGHELLO-TV_HD_ECONOMY', 'TV-LGHELLO-TV_UHD_ECONOMY'}
          data['tv_products'] = [
              item for item in data.get('tv_products', [])
              if item.get('provider_id') != 'LGHELLO' or item.get('id') in keep_tv
          ]
          for item in data['tv_products']:
              if item.get('id') == 'TV-LGHELLO-TV_HD_ECONOMY':
                  item.update(name='알뜰형 + HD', channel_label='90개', source_order=1)
              elif item.get('id') == 'TV-LGHELLO-TV_UHD_ECONOMY':
                  item.update(name='이코노미', channel_label='107개', source_order=2)

          data['settop_products'] = [
              item for item in data.get('settop_products', [])
              if item.get('provider_id') != 'LGHELLO' or item.get('tv_product_id') in keep_tv
          ]

          data_path.write_text(json.dumps(data, ensure_ascii=False, separators=(',', ':')), encoding='utf-8')

          src_path = Path('src/rates.js')
          src = src_path.read_text(encoding='utf-8')

          old_gift = 'LGHELLO:{groups:["BASIC"],none:{100:13,160:13,500:18,1e3:20},tv:{TV_HD_ECONOMY:{100:13,160:13,500:18,1e3:20},TV_UHD_ECONOMY:{100:30,160:30,500:35,1e3:40},TV_UHD_NEW_BASIC:{100:30,160:30,500:35,1e3:40},TV_UHD_NEWPREMIUM:{100:30,160:30,500:35,1e3:40},TV_UHD_PRO_LIGHT:{160:30,500:35,1e3:40},TV_UHD_PRO_MAX:{160:30,500:35,1e3:40}}}'
          new_gift = 'LGHELLO:{groups:["BASIC"],none:{100:32,160:38,500:48,1e3:48},tv:{TV_HD_ECONOMY:{100:34,160:40,500:50,1e3:50},TV_UHD_ECONOMY:{100:56,160:68,500:78,1e3:78}}}'
          assert old_gift in src, 'LGHELLO gift matrix not found'
          src = src.replace(old_gift, new_gift, 1)

          old_default = 'LGHELLO:"TV-LGHELLO-TV_UHD_NEW_BASIC"'
          new_default = 'LGHELLO:"TV-LGHELLO-TV_HD_ECONOMY"'
          assert old_default in src, 'LGHELLO default TV not found'
          src = src.replace(old_default, new_default, 1)

          old_dt_tail = 'SKYLIFE:{kind:"fixed_total",fees:{TV_IPIT_BASIC:7700,TV_IPIT_PLUS:8250}}};function Ht()'
          new_dt_tail = 'SKYLIFE:{kind:"fixed_total",fees:{TV_IPIT_BASIC:7700,TV_IPIT_PLUS:8250}}},wbHelloBundleTotals={TV_HD_ECONOMY:{100:25130,160:29860,500:32890,1e3:34100},TV_UHD_ECONOMY:{100:32830,160:37560,500:40590,1e3:41800}};function wbWiredPackageOverride(e,t){if(!e||!t||"LGHELLO"!==e.provider_id)return null;const o=wbHelloBundleTotals[String(t.product_key||"")],r=Number(e.speed_mbps);return o&&n(o[r])?Number(o[r]):null}function Ht()'
          assert old_dt_tail in src, 'wired config tail not found'
          src = src.replace(old_dt_tail, new_dt_tail, 1)

          old_compare = 'const v=r+i+s+p.amount;return{known:!0,base:v,total:Math.max(0,v-d-m),internetDiscount:d,tvDiscount:m,settopFee:s,additionalTv:p.amount,tvCount:a?Math.max(1,Number(o||1)):0,gift:ln(e,t)}}'
          new_compare = 'const v=r+i+s+p.amount,wbPkg=1===Math.max(1,Number(o||1))?wbWiredPackageOverride(e,t):null,wbBase=n(wbPkg)?Number(wbPkg):v,wbIntDisc=n(wbPkg)?0:d,wbTvDisc=n(wbPkg)?0:m,wbSettop=n(wbPkg)?0:s;return{known:!0,base:wbBase,total:Math.max(0,wbBase-wbIntDisc-wbTvDisc),internetDiscount:wbIntDisc,tvDiscount:wbTvDisc,settopFee:wbSettop,additionalTv:p.amount,tvCount:a?Math.max(1,Number(o||1)):0,gift:ln(e,t)}}'
          assert old_compare in src, 'wired compare calculation not found'
          src = src.replace(old_compare, new_compare, 1)

          old_main = 'b=p&&i?Math.min(l,sn(p,o)):0,_=p&&d?Math.min(m,Number(p.tvDiscount)||0):0,y=b+_,g=c?Rt():0,x=c?Wt(r,g):{known:!0,amount:0,extra:0},C=x.known,w=x.amount,k=i&&d&&f&&C,$=k?l+m+h+w:null,E=pn(It)'
          new_main = 'b=p&&i?Math.min(l,sn(p,o)):0,_=p&&d?Math.min(m,Number(p.tvDiscount)||0):0,y=b+_,g=c?Rt():0,wbPkg=c&&1===g?wbWiredPackageOverride(o,r):null,x=c?Wt(r,g):{known:!0,amount:0,extra:0},C=x.known,w=x.amount,k=i&&d&&f&&C,$=k?n(wbPkg)?Number(wbPkg):l+m+h+w:null,E=pn(It)'
          assert old_main in src, 'main wired base calculation not found'
          src = src.replace(old_main, new_main, 1)

          old_tv_view = 'const F=c&&d&&f?Math.max(0,m-_)+h:null;t("tv-fee-view").textContent=c?null!==F&&C?e(F+w):"매장 확인":"미선택"'
          new_tv_view = 'const F=c&&d&&f?n(wbPkg)?Math.max(0,Number(wbPkg)-l):Math.max(0,m-_)+h:null;t("tv-fee-view").textContent=c?null!==F&&C?e(F+w):"매장 확인":"미선택"'
          assert old_tv_view in src, 'TV fee view calculation not found'
          src = src.replace(old_tv_view, new_tv_view, 1)

          old_data_ver = 'fetch("data/internet.json?v=20260921-7")'
          new_data_ver = 'fetch("data/internet.json?v=20260921-8")'
          assert old_data_ver in src, 'internet data cache version not found'
          src = src.replace(old_data_ver, new_data_ver, 1)
          src_path.write_text(src, encoding='utf-8')

          html_path = Path('rates.html')
          html = html_path.read_text(encoding='utf-8')
          old_asset_ver = 'assets/rates.min.js?v=20260921-7'
          assert old_asset_ver in html, 'rates asset cache version not found'
          html = html.replace(old_asset_ver, 'assets/rates.min.js?v=20260921-8', 1)
          html_path.write_text(html, encoding='utf-8')
          PY
      - name: Rebuild production rates asset
        run: cp src/rates.js assets/rates.min.js
      - name: Validate site
        shell: bash
        run: |
          node --check src/rates.js
          node --check assets/rates.min.js
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('data/internet.json').read_text(encoding='utf-8'))
          ints={x['speed_mbps']:x for x in d['internet_products'] if x.get('provider_id')=='LGHELLO'}
          assert {k:v['monthly_fee'] for k,v in ints.items()} == {100:21890,160:27610,500:31460,1000:33000}
          tv=[x for x in d['tv_products'] if x.get('provider_id')=='LGHELLO']
          assert [x['product_key'] for x in tv] == ['TV_HD_ECONOMY','TV_UHD_ECONOMY']
          s=Path('src/rates.js').read_text(encoding='utf-8')
          for token in ['100:32,160:38,500:48,1e3:48','TV_HD_ECONOMY:{100:34,160:40,500:50,1e3:50}','TV_UHD_ECONOMY:{100:56,160:68,500:78,1e3:78}','TV_HD_ECONOMY:{100:25130,160:29860,500:32890,1e3:34100}','TV_UHD_ECONOMY:{100:32830,160:37560,500:40590,1e3:41800}']:
              assert token in s, token
          assert Path('assets/rates.min.js').read_text(encoding='utf-8') == s
          assert 'assets/rates.min.js?v=20260921-8' in Path('rates.html').read_text(encoding='utf-8')
          print('hellovision assertions passed')
          PY
          if [ -f scripts/site-regression-check.mjs ]; then node scripts/site-regression-check.mjs; fi
      - name: Commit update and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "woongbts"
          git config user.email "swb3301@gmail.com"
          rm -f .github/workflows/hellovision-pricing-once.yml
          git add data/internet.json src/rates.js assets/rates.min.js rates.html .github/workflows/hellovision-pricing-once.yml
          git commit -m "Update Hellovision marked pricing and gifts"
          git push origin HEAD:tmp-hellovision-20260921-work
