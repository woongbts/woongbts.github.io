name: Temporary MVNO recommendation patch

on:
  push:
    branches: [main]
    paths:
      - 'tmp_apply_mvno_recommendations.py'
      - '.github/workflows/tmp-mvno-recommendations.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python tmp_apply_mvno_recommendations.py
      - name: Check JavaScript syntax
        run: node --check assets/rates.js
      - name: Validate recommendation plans and customer-safe output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('data/mvno-postpaid.json').read_text(encoding='utf-8'))
          plans={p['id']:p for p in data['plans']}
          expected={
            'MMOBILE-2148':18400,
            'UPLUSE-1623':18600,
            '7MOBILE-1684':19140,
            'SKYLIFE-2069':17900,
            'MMOBILE-2149':20900,
            'HELLOUPLUS-2240':17500,
          }
          for pid,fee in expected.items():
            assert pid in plans, f'missing recommended plan: {pid}'
            actual=plans[pid].get('special_monthly_fee',plans[pid].get('monthly_fee'))
            assert int(actual)==fee, (pid,actual,fee)
          html=Path('rates.html').read_text(encoding='utf-8')
          js=Path('assets/rates.js').read_text(encoding='utf-8')
          css=Path('assets/rates.css').read_text(encoding='utf-8')
          assert '추천 요금제' in html and '전체 요금제 찾기' in html
          assert 'MVNO_RECOMMENDED_PLANS' in js
          assert 'mvno-recommend-card' in css
          assert 'assets/rates.css?v=20260916-18' in html
          assert 'assets/rates.js?v=20260916-31' in html
          # Internal policy economics must never be embedded in the customer UI code.
          curated=js[js.index('const MVNO_RECOMMENDED_PLANS'):js.index('function setMvnoMode')]
          for forbidden in ['마진','리베이트','commission','rebate','110000','160000','174000','185000']:
            assert forbidden not in curated, forbidden
          print('validated',len(expected),'customer-safe MVNO recommendations')
          PY
      - name: Commit changes
        run: |
          git config user.name 'woongbts'
          git config user.email 'swb3301@gmail.com'
          git add rates.html assets/rates.js assets/rates.css
          if ! git diff --cached --quiet; then
            git commit -m 'Add curated MVNO plan recommendations'
            git push origin HEAD:main
          fi
