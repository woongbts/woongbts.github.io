name: Scrape public Clover offer terms

on:
  push:
    paths:
      - 'rental/.offer-scrape-trigger'

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Scrape public rental-company terms
        run: python .github/scripts/scrape_clover_offers.py
      - name: Commit public offer facts
        run: |
          git config user.name "woongbi-offer-bot"
          git config user.email "actions@users.noreply.github.com"
          git add rental/data/clover-offers-public.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh public rental-company offer facts"
          git pull --rebase origin main
          git push
