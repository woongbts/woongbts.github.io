name: Device brand filter upgrade

on:
  push:
    branches: [main]
    paths:
      - 'scripts/device-brand-filter-upgrade.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply device brand filter
        run: python scripts/device-brand-filter-upgrade.py
      - name: Commit updated calculator
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rates.html assets/rates.js assets/rates.css
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add device brand filters"
            git push origin main
          fi
