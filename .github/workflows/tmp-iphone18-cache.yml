name: Bump iPhone 18 promo cache

on:
  push:
    paths:
      - 'tmp_bump_iphone18_cache.py'
      - '.github/workflows/tmp-iphone18-cache.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Bump cache key
        run: |
          python tmp_bump_iphone18_cache.py
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert 'assets/site-pro.min.js?v=20260917-3' in s
          assert 'assets/site-pro.min.js?v=20260917-2' not in s
          print('cache validation ok')
          PY
      - name: Commit update and cleanup
        run: |
          git config user.name "woongbts"
          git config user.email "swb3301@gmail.com"
          git rm -f tmp_bump_iphone18_cache.py .github/workflows/tmp-iphone18-cache.yml
          git add index.html
          git commit -m "Refresh iPhone 18 consultation banner cache"
          git push
