          js=js.replace('data/internet.json?v=20260915-14','data/internet.json?v=20260915-15')

          # CSS for the new consultation modes and comparison surfaces.
          css += r'''

/* Advanced consultation v2 */
.mobile-mode-switch{display:flex;gap:8px;margin:0 0 16px}.mobile-mode-switch button{flex:0 1 180px;min-height:42px;border:1px solid #cddcdf;border-radius:12px;background:#fff;color:#476068;font-weight:900;cursor:pointer}.mobile-mode-switch button.active{background:var(--navy);border-color:var(--navy);color:#fff}.quick-recommend{background:#fff;border:1px solid var(--line);border-radius:20px;padding:22px;margin-bottom:16px;box-shadow:0 8px 24px rgba(16,60,82,.05)}.quick-recommend[hidden],.rate-grid[hidden]{display:none!important}.quick-title{display:flex;justify-content:space-between;gap:12px;margin-bottom:15px}.quick-title>div{display:grid;gap:4px}.quick-title strong{font-size:1rem}.quick-title span{font-size:.75rem;line-height:1.5;color:var(--muted)}.quick-fields{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}.quick-fields label,.device-compare-selects label{display:grid;gap:6px;font-size:.76rem;font-weight:850;color:#46616a}.quick-fields select,.device-compare-selects select{width:100%;min-height:44px;border:1px solid #cddcdf;border-radius:11px;background:#fff;padding:8px 10px;color:#183c48;font:inherit}.quick-find{margin-top:12px;min-height:44px;border:0;border-radius:12px;padding:0 18px;background:var(--teal);color:#fff;font-weight:900;cursor:pointer}.quick-results{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}.quick-results>p{grid-column:1/-1;margin:0;padding:13px;border-radius:12px;background:#f4f8f9;color:var(--muted);font-size:.75rem}.quick-result-card{display:grid;gap:5px;padding:14px;border:1px solid #d5e3e5;border-radius:14px;background:#f8fbfb}.quick-result-card>span{font-size:.68rem;color:var(--teal);font-weight:900}.quick-result-card>strong{font-size:1rem}.quick-result-card>em{font-style:normal;font-size:.72rem;color:var(--muted)}.quick-result-card>b{font-size:1.25rem;color:var(--teal);letter-spacing:-.035em}.quick-result-card>small{font-size:.68rem;color:#60777f}.quick-result-card button{margin-top:5px;min-height:38px;border:0;border-radius:10px;background:var(--navy);color:#fff;font-weight:900;cursor:pointer}.device-compare-tool{margin-top:16px;padding:16px;border:1px solid #d5e3e5;border-radius:16px;background:#fff}.device-compare-selects{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.device-compare-results{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.device-compare-results>p{grid-column:1/-1;margin:0;padding:11px;border-radius:10px;background:#f4f8f9;color:var(--muted);font-size:.72rem}.device-compare-card{display:grid;gap:5px;padding:12px;border:1px solid #d5e3e5;border-radius:13px;background:#f8fbfb}.device-compare-card>span{font-size:.65rem;color:var(--teal);font-weight:900}.device-compare-card>strong{font-size:.9rem;line-height:1.35}.device-compare-card>em{font-style:normal;color:var(--muted);font-size:.68rem}.device-compare-card>div{display:flex;justify-content:space-between;gap:8px;font-size:.69rem}.device-compare-card>div small{color:var(--muted)}.device-compare-card>div b{font-size:.69rem}.device-compare-card>i{font-style:normal;margin-top:3px;padding-top:7px;border-top:1px solid var(--line);font-size:.7rem;font-weight:900;color:var(--teal)}
@media(max-width:900px){.quick-fields{grid-template-columns:1fr 1fr 1fr}.quick-results{grid-template-columns:1fr 1fr}.device-compare-selects,.device-compare-results{grid-template-columns:1fr 1fr}}
@media(max-width:760px){.mobile-mode-switch{display:grid;grid-template-columns:1fr 1fr}.mobile-mode-switch button{width:100%}.quick-recommend{padding:17px;border-radius:17px}.quick-fields,.quick-results,.device-compare-selects,.device-compare-results{grid-template-columns:1fr}.quick-find{width:100%}.device-compare-tool{padding:14px}.quick-result-card>b{font-size:1.15rem}}
'''

          html_path.write_text(html,encoding='utf-8')
          js_path.write_text(js,encoding='utf-8')
          css_path.write_text(css,encoding='utf-8')
          PY
          node --check assets/rates.js
          grep -q 'id="quick-recommend"' rates.html
          grep -q 'id="device-compare-results"' rates.html
          grep -q 'function restoreQuoteFromUrl' assets/rates.js
      - name: Commit consultation upgrade
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'woongbts-ui-sync'
          git config user.email 'actions@users.noreply.github.com'
          git add rates.html assets/rates.js assets/rates.css
          if git diff --cached --quiet; then echo 'No changes'; exit 0; fi
          git commit -m 'Add quick recommendations sharable quotes and device comparison'
          git pull --rebase origin main
          git push origin HEAD:main
