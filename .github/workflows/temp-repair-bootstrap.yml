name: Temporary repair bootstrap

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-repair-bootstrap.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Fix repair workflow and self-remove
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('.github/workflows/temp-mobile-audit.yml')
          lines=path.read_text(encoding='utf-8').splitlines()
          out=[]
          skipping=False
          replaced=False
          for line in lines:
              if not skipping and 'css=re.sub' in line and 'plan-picker-sheet' in line:
                  out.extend([
                      "          css=replace_once(css,",
                      "              '.plan-picker-sheet{pointer-events:auto;width:min(680px,100%);max-height:min(760px,calc(100dvh - 48px));display:flex;flex-direction:column;gap:13px;background:#fff;border-radius:22px;padding:19px;box-shadow:0 22px 70px rgba(0,0,0,.26);overflow:hidden}',",
                      "              '.plan-picker-sheet{pointer-events:auto;width:min(680px,100%);max-height:min(760px,calc(100dvh - 48px));display:flex;flex-direction:column;gap:13px;background:#fff;border-radius:22px;padding:19px;box-shadow:0 22px 70px rgba(0,0,0,.26);overflow:hidden;min-height:0;overscroll-behavior:contain;touch-action:auto}',",
                      "              'modal sheet flex')",
                  ])
                  skipping=True
                  replaced=True
                  continue
              if skipping:
                  if "raise SystemExit('sheet flex fix failed')" in line:
                      skipping=False
                  continue
              out.append(line)
          if not replaced or skipping:
              raise SystemExit('could not patch repair workflow CSS block')
          path.write_text('\n'.join(out)+'\n',encoding='utf-8')
          PY
          rm -f .github/workflows/temp-repair-bootstrap.yml
          git config user.name 'woongbts-site-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -u
          git add .github/workflows/temp-mobile-audit.yml
          git commit -m 'Fix mobile repair workflow CSS patch'
          git push origin HEAD:main
