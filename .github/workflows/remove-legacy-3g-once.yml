name: One-time remove legacy 3G plans

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-legacy-3g-once.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remove legacy 3G plans and add guards
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import pathlib
          import re

          legacy_re = re.compile(r'(^|[^A-Za-z0-9])3G([^A-Za-z0-9]|$)', re.IGNORECASE)

          def is_legacy_3g_name(value):
              return bool(legacy_re.search(str(value or '')))

          def load(path):
              return json.loads(path.read_text(encoding='utf-8'))

          def dump(path, obj):
              path.write_text(json.dumps(obj, ensure_ascii=False, separators=(',', ':')), encoding='utf-8')

          def replace_once(text, old, new, label):
              if new in text:
                  return text
              if old not in text:
                  raise SystemExit(f'{label} patch target not found')
              return text.replace(old, new, 1)

          plans_path = pathlib.Path('data/plans.json')
          catalog_path = pathlib.Path('data/catalog.json')
          supports_path = pathlib.Path('data/supports.json')

          plans = load(plans_path)
          mobile_plans = plans.get('mobile_plans') or []
          removed_plans = [
              plan for plan in mobile_plans
              if plan.get('id') and is_legacy_3g_name(plan.get('name'))
          ]
          removed = {plan.get('id') for plan in removed_plans}
          if not removed:
              raise SystemExit('No legacy 3G plans found; refusing unexpected no-op')

          plans['mobile_plans'] = [plan for plan in mobile_plans if plan.get('id') not in removed]
          if isinstance(plans.get('meta'), dict):
              plans['meta']['updated_at'] = '2026-09-19'
          dump(plans_path, plans)

          catalog = load(catalog_path)
          for device in catalog.get('devices') or []:
              ids = device.get('eligible_plan_ids')
              if isinstance(ids, list):
                  device['eligible_plan_ids'] = [pid for pid in ids if pid not in removed]
              mapping = device.get('eligible_plan_ids_by_join_type')
              if isinstance(mapping, dict):
                  for join_type, join_ids in list(mapping.items()):
                      if isinstance(join_ids, list):
                          mapping[join_type] = [pid for pid in join_ids if pid not in removed]
          supports_inline = catalog.get('mobile_supports')
          if isinstance(supports_inline, list):
              catalog['mobile_supports'] = [row for row in supports_inline if row.get('plan_id') not in removed]
          if isinstance(catalog.get('meta'), dict):
              catalog['meta']['updated_at'] = '2026-09-19'
          dump(catalog_path, catalog)

          supports = load(supports_path)
          for schedule in supports.get('support_schedules') or []:
              amounts = schedule.get('amounts')
              if isinstance(amounts, dict):
                  schedule['amounts'] = {pid: amount for pid, amount in amounts.items() if pid not in removed}
          if isinstance(supports.get('meta'), dict):
              supports['meta']['updated_at'] = '2026-09-19'
          dump(supports_path, supports)

          # Daily source sync: exclude legacy 3G plans before eligibility/support data is built.
          sync_path = pathlib.Path('.github/scripts/daily_wireless_sync.py')
          sync = sync_path.read_text(encoding='utf-8')
          if 'import re\n' not in sync:
              sync = replace_once(sync, 'import pathlib\nimport time\n', 'import pathlib\nimport re\nimport time\n', 'daily sync import')
          sync = replace_once(
              sync,
              '        if any(token in name for token in blocked):',
              '        if re.search(r"(^|[^a-z0-9])3g([^a-z0-9]|$)", name, re.IGNORECASE):\n            continue\n        if any(token in name for token in blocked):',
              'daily sync handset-plan guard',
          )
          sync = replace_once(
              sync,
              '        blocked_plan_tokens = (',
              '        if re.search(r"(^|[^a-z0-9])3g([^a-z0-9]|$)", normalized_name, re.IGNORECASE):\n            raise RuntimeError(f"legacy 3G plan leaked into public catalog: {pid} {plan.get(\'name\')}")\n        blocked_plan_tokens = (',
              'daily sync validation guard',
          )
          sync_path.write_text(sync, encoding='utf-8')

          # Direct + quick calculator: reject legacy 3G names even if stale browser data is present.
          old_guard = 'return!/아웃도어|tab|태블릿|watch|워치|포켓파이|데이터함께쓰기|데이터쉐어링|데이터셰어링|아이패드|ipad|세컨드디바이스|2nddevice|wearable|웨어러블|데이터나눠쓰기/.test(t)'
          new_guard = 'return!/(^|[^a-z0-9])3g([^a-z0-9]|$)/i.test(t)&&!/아웃도어|tab|태블릿|watch|워치|포켓파이|데이터함께쓰기|데이터쉐어링|데이터셰어링|아이패드|ipad|세컨드디바이스|2nddevice|wearable|웨어러블|데이터나눠쓰기/.test(t)'
          for path_string in ('src/rates.js', 'assets/rates.min.js'):
              path = pathlib.Path(path_string)
              text = path.read_text(encoding='utf-8')
              text = replace_once(text, old_guard, new_guard, f'calculator 3G guard {path_string}')
              text = text.replace('data/plans.json?v=20260918-4', 'data/plans.json?v=20260919-1')
              path.write_text(text, encoding='utf-8')

          # Purpose recommendation v2: same guard for 효도폰/가성비폰/프리미엄폰.
          rec_path = pathlib.Path('assets/recommendation-engine-v2.js')
          rec = rec_path.read_text(encoding='utf-8')
          old_rec_guard = 'return !/아웃도어|tab|태블릿|watch|워치|포켓파이|데이터함께쓰기|데이터쉐어링|데이터셰어링|아이패드|ipad|세컨드디바이스|2nddevice|wearable|웨어러블|데이터나눠쓰기/.test(s)'
          new_rec_guard = 'return !/(^|[^a-z0-9])3g([^a-z0-9]|$)/i.test(s)&&!/아웃도어|tab|태블릿|watch|워치|포켓파이|데이터함께쓰기|데이터쉐어링|데이터셰어링|아이패드|ipad|세컨드디바이스|2nddevice|wearable|웨어러블|데이터나눠쓰기/.test(s)'
          rec = replace_once(rec, old_rec_guard, new_rec_guard, 'recommendation v2 3G guard')
          rec = rec.replace('data/plans.json?v=20260918-5', 'data/plans.json?v=20260919-1')
          rec_path.write_text(rec, encoding='utf-8')

          # Regression guard: legacy 3G plans must never return to the public database.
          validator_path = pathlib.Path('.github/scripts/validate_site.py')
          validator = validator_path.read_text(encoding='utf-8')
          anchor = '# Non-handset plans must never leak into the phone calculator.\n'
          guard = (
              '# Legacy 3G plans are retired and must never return to customer-facing data.\n'
              'legacy_3g_plans = [\n'
              '    p for p in mobile_plans\n'
              '    if re.search(r"(^|[^a-z0-9])3g([^a-z0-9]|$)", str(p.get("name") or "").lower().replace(" ", ""), re.IGNORECASE)\n'
              ']\n'
              'check(not legacy_3g_plans, f"legacy 3G plans leaked: {[p.get(\'name\') for p in legacy_3g_plans[:5]]}")\n\n'
          )
          if 'legacy_3g_plans = [' not in validator:
              validator = replace_once(validator, anchor, anchor + guard, 'site validator 3G guard')
          validator_path.write_text(validator, encoding='utf-8')

          # Cache bust updated data and calculator code.
          rates_html_path = pathlib.Path('rates.html')
          rates_html = rates_html_path.read_text(encoding='utf-8')
          rates_html = rates_html.replace('assets/rates.min.js?v=20260918-9', 'assets/rates.min.js?v=20260919-1')
          rates_html = re.sub(r'(recommendation-engine-v2\.js\?v=)[^"\']+', r'\g<1>20260919-1', rates_html)
          rates_html_path.write_text(rates_html, encoding='utf-8')

          print('Removed legacy 3G plans:')
          for plan in removed_plans:
              print(f" - {plan.get('id')}: {plan.get('name')}")
          print('removed_count=', len(removed_plans))
          PY

      - name: Validate cleanup
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          legacy_re = re.compile(r'(^|[^A-Za-z0-9])3G([^A-Za-z0-9]|$)', re.I)
          plans = json.loads(Path('data/plans.json').read_text(encoding='utf-8'))
          legacy = [p for p in plans.get('mobile_plans', []) if legacy_re.search(str(p.get('name') or ''))]
          if legacy:
              raise SystemExit(f"legacy 3G plans remain: {[p.get('name') for p in legacy]}")

          removed_ids = {'SKT-XP-33','SKT-XP-34','SKT-XP-35','SKT-XP-53','SKT-XP-51','SKT-XP-52','SKT-XP-63','LG-XP-1316'}
          catalog_text = Path('data/catalog.json').read_text(encoding='utf-8')
          supports_text = Path('data/supports.json').read_text(encoding='utf-8')
          leftovers = [pid for pid in removed_ids if pid in catalog_text or pid in supports_text]
          if leftovers:
              raise SystemExit(f'removed 3G plan IDs still referenced: {leftovers}')
          print('No legacy 3G plans or references remain')
          PY
          node --check assets/rates.min.js
          node --check assets/recommendation-engine-v2.js
          python3 .github/scripts/build_rates_asset.py --check
          python3 .github/scripts/validate_site.py

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git add data/plans.json data/catalog.json data/supports.json src/rates.js assets/rates.min.js assets/recommendation-engine-v2.js rates.html .github/scripts/daily_wireless_sync.py .github/scripts/validate_site.py
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'woongbts-maintenance'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Remove legacy 3G plans from customer calculators'
          git pull --rebase origin main
          git push origin HEAD:main
