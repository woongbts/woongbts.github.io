name: Temporary stylefolder audit
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-stylefolder-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect target devices
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('data/catalog.json').read_text(encoding='utf-8'))
          for carrier in ('SKT','LGU+'):
              print('CARRIER',carrier)
              for d in c.get('devices',[]):
                  name=d.get('name','')
                  if any(x in name for x in ('A17 LTE','Wide9','A17 키즈폰')):
                      out={k:d.get(k) for k in ('id','carrier','name','model','model_code','manufacturer','release_date','retail_price','factory_price_date','announce_date','network_type','source_order','installment_months','eligible_plan_ids','eligible_plan_ids_by_join_type')}
                      print(json.dumps(out,ensure_ascii=False))
          PY
