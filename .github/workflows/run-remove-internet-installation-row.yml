name: run-remove-internet-installation-row

on:
  push:
    paths:
      - '.github/workflows/run-remove-internet-installation-row.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Remove installation fee row
        run: python scripts/remove-internet-installation-row.py
      - name: Commit changes
        run: |
          if git diff --quiet -- assets/rates.js rates.html; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'woongbts-ui-sync'
          git config user.email 'actions@users.noreply.github.com'
          git add assets/rates.js rates.html
          git commit -m 'Remove Internet installation fee from customer result'
          git push origin main
