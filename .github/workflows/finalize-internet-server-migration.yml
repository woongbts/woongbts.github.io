name: Finalize internet and TV server migration

on:
  push:
    branches:
      - hardening/server-only-internet-tv
    paths:
      - '.github/scripts/finalize_internet_server_migration.mjs'
      - '.github/workflows/finalize-internet-server-migration.yml'

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/server-only-internet-tv
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Finalize public wired server migration
        run: node .github/scripts/finalize_internet_server_migration.mjs
      - name: Validate finalized wired source
        run: |
          node --check src/rates.js
          node --check assets/rates.min.js
          node --check assets/internet-api-bridge.min.js
          node --check assets/internet-ui.min.js
          node --check sw.js
          python3 .github/scripts/build_rates_asset.py --check
          python3 .github/scripts/validate_site.py
          test ! -e data/internet.json
          grep -q 'internet-api-bridge.min.js' rates.html
          grep -q 'internet-ui.min.js' rates.html
          grep -q '/quote/internet' assets/internet-api-bridge.min.js
          ! grep -q 'fallbackSettopFee' src/rates.js
          ! grep -q 'internetDiscountBySpeed' src/rates.js
          ! grep -q 'wbWiredPackageOverride' src/rates.js
          ! grep -q 'data/internet.json' src/rates.js
      - name: Commit finalized migration
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rates.html sw.js .github/scripts/validate_site.py data/internet.json
          git diff --cached --quiet && exit 0
          git commit -m 'Finalize server-owned internet and TV pricing'
          git push origin HEAD:hardening/server-only-internet-tv
