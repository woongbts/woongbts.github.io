name: Refine value and premium recommendations

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-refine-value-premium.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply recommendation refinements
        run: python tmp_refine_value_premium_recommendations.py
      - name: Check JavaScript syntax
        run: node --check assets/rates.js
      - name: Verify recommendation rules
        run: |
          grep -q "purposeValueDeviceRank" assets/rates.js
          grep -q "purposePremiumSupportFit" assets/rates.js
          grep -q "Number(p.monthly_fee)>=80000" assets/rates.js
          grep -q "Number(p.monthly_fee)>=59000" assets/rates.js
          grep -q "공시지원 중심" assets/rates.js
      - name: Commit result
        run: |
          git config user.name "woongbts"
          git config user.email "swb3301@gmail.com"
          git add assets/rates.js
          git commit -m "Tune value and premium phone recommendations" || exit 0
          git push
