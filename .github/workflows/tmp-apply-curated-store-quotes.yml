name: Apply curated store quotes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-apply-curated-store-quotes.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply curated quote patch
        run: python tmp_apply_curated_store_quotes.py
      - name: Check JavaScript syntax
        run: node --check assets/rates.js
      - name: Verify curated quote rules
        run: |
          grep -q "stylefolder2:{category:'senior'" assets/rates.js
          grep -q "jump5:{category:'value'" assets/rates.js
          grep -q "a37:{category:'value'" assets/rates.js
          grep -q "quantum7:{category:'value'" assets/rates.js
          grep -q "if(purposeCategory==='value')return purposeCuratedValueRows" assets/rates.js
          grep -q "실제 매장 견적" assets/rates.js
          grep -q "assets/rates.js?v=20260916-28" rates.html
      - name: Validate supplied quote arithmetic
        run: |
          python - <<'PY'
          quotes={
            '스타일폴더2':(10520,12650,23170,237600,14880),
            'Jump5':(24160,27750,51910,545600,34240),
            'A37':(26490,27750,54240,598400,37360),
            '퀀텀7':(31750,29250,61000,717200,44800),
          }
          for name,(dev,svc,total,price,fee) in quotes.items():
            assert dev+svc==total,(name,dev+svc,total)
            assert dev*24==price+fee,(name,dev*24,price+fee)
            print(name,'monthly',total,'24m',total*24)
          PY
      - name: Ensure target devices exist
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('data/catalog.json').read_text(encoding='utf-8'))
          devices=data.get('devices',[])
          targets={'AT-M140S','SM-A276K','SM-A376NK','SM-A576S'}
          found={str(d.get('model_code','')).upper() for d in devices if str(d.get('model_code','')).upper() in targets}
          print('found',found)
          assert targets<=found,targets-found
          PY
      - name: Commit result
        run: |
          git config user.name "woongbts"
          git config user.email "swb3301@gmail.com"
          git add assets/rates.js rates.html
          git commit -m "Apply exact store quote recommendations" || exit 0
          git push
