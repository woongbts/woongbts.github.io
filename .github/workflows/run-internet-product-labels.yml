name: run-internet-product-labels

on:
  push:
    paths:
      - '.github/workflows/run-internet-product-labels.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply Internet product labels
        run: python scripts/update-internet-product-labels.py
      - name: Commit changes
        run: |
          if git diff --quiet -- assets/rates.js rates.html; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'woongbts-ui-sync'
          git config user.email 'actions@users.noreply.github.com'
          git add assets/rates.js rates.html
          git commit -m 'Show Internet speed and Wi-Fi details in product names'
          git push origin main
