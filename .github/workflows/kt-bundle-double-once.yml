name: KT doubled mobile bundle once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kt-bundle-double-once.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply doubled KT mobile bundle calculation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          internet_path = Path('data/internet.json')
          data = json.loads(internet_path.read_text(encoding='utf-8'))
          rules = {rule['id']: rule for rule in data.get('bundle_rules', [])}

          updates = {
              'KT-TOTAL-100-L1': (1650, 3300, '총액결합 · 22,000원 미만 · 100M 기준 1,650원 ×2 적용'),
              'KT-TOTAL-100-L2': (3300, 6600, '총액결합 · 22,000~64,899원 · 100M 기준 3,300원 ×2 적용'),
              'KT-TOTAL-100-L3': (5500, 11000, '총액결합 · 64,900원 이상 · 100M 기준 5,500원 ×2 적용'),
              'KT-TOTAL-500-L1': (2200, 4400, '총액결합 · 22,000원 미만 · 500M~1G 기준 2,200원 ×2 적용'),
              'KT-TOTAL-500-L2': (5500, 11000, '총액결합 · 22,000~64,899원 · 500M~1G 기준 5,500원 ×2 적용'),
              'KT-TOTAL-500-L3': (5500, 11000, '총액결합 · 64,900원 이상 · 500M~1G 기준 5,500원 ×2 적용'),
          }

          for rule_id, (display_discount, effective_discount, name) in updates.items():
              if rule_id not in rules:
                  raise SystemExit(f'missing bundle rule: {rule_id}')
              rule = rules[rule_id]
              rule['display_discount'] = display_discount
              rule['discount'] = effective_discount
              rule['name'] = name
              rule['notes'] = (
                  f'모바일 월정액 합계 구간 기준 · 결합 기준금액 {display_discount:,}원 ×2 = '
                  f'인터넷 청구 {effective_discount:,}원 할인 · 휴대폰 청구 할인은 별도'
              )

          data.setdefault('meta', {})['updated_at'] = '2026-09-21'
          data['meta']['mobile_bundle_note'] = (
              '인터넷/TV 청구서에 직접 적용되는 확인 가능한 할인만 자동 계산하며 휴대폰 청구 할인은 별도 안내한다. '
              'KT 총액결합은 선택 구간에 표시된 결합 기준금액을 2배 적용해 인터넷 할인액을 계산한다. '
              '100M은 1,650/3,300/5,500원 기준을 3,300/6,600/11,000원으로, '
              '500M~1G는 2,200/5,500/5,500원 기준을 4,400/11,000/11,000원으로 적용한다.'
          )
          internet_path.write_text(json.dumps(data, ensure_ascii=False, separators=(',', ':')) + '\n', encoding='utf-8')

          src_path = Path('src/rates.js')
          src = src_path.read_text(encoding='utf-8')
          src, count = re.subn(r'data/internet\.json\?v=\d{8}-\d+', 'data/internet.json?v=20260921-3', src, count=1)
          if count != 1:
              raise SystemExit('internet data cache key marker not found or duplicated')
          src_path.write_text(src, encoding='utf-8')

          rates_path = Path('rates.html')
          html = rates_path.read_text(encoding='utf-8')
          html, count = re.subn(r'assets/rates\.min\.js\?v=\d{8}-\d+', 'assets/rates.min.js?v=20260921-3', html, count=1)
          if count != 1:
              raise SystemExit('rates asset cache key marker not found or duplicated')
          rates_path.write_text(html, encoding='utf-8')

          assert rules['KT-TOTAL-100-L1']['discount'] == 3300
          assert rules['KT-TOTAL-100-L2']['discount'] == 6600
          assert rules['KT-TOTAL-100-L3']['discount'] == 11000
          assert rules['KT-TOTAL-500-L1']['discount'] == 4400
          assert rules['KT-TOTAL-500-L2']['discount'] == 11000
          assert rules['KT-TOTAL-500-L3']['discount'] == 11000

          # Current KT Wi-Fi product base fees on the customer calculator.
          assert 23100 - 3300 == 19800
          assert 23100 - 6600 == 16500
          assert 23100 - 11000 == 12100
          assert 34100 - 4400 == 29700
          assert 34100 - 11000 == 23100
          print('KT doubled mobile-bundle calculations OK')
          PY

      - name: Rebuild production rates asset
        run: python .github/scripts/build_rates_asset.py

      - name: Validate site
        run: |
          python -m json.tool data/internet.json >/dev/null
          node --check src/rates.js
          node --check assets/rates.min.js
          python .github/scripts/build_rates_asset.py --check
          python .github/scripts/validate_site.py
          python - <<'PY'
          from pathlib import Path
          import json
          data = json.loads(Path('data/internet.json').read_text(encoding='utf-8'))
          rules = {r['id']: r for r in data['bundle_rules']}
          expected = {
              'KT-TOTAL-100-L1': (1650, 3300),
              'KT-TOTAL-100-L2': (3300, 6600),
              'KT-TOTAL-100-L3': (5500, 11000),
              'KT-TOTAL-500-L1': (2200, 4400),
              'KT-TOTAL-500-L2': (5500, 11000),
              'KT-TOTAL-500-L3': (5500, 11000),
          }
          for rule_id, (shown, effective) in expected.items():
              assert rules[rule_id]['display_discount'] == shown
              assert rules[rule_id]['discount'] == effective
          assert '>내 요금 알아보기</a>' in Path('index.html').read_text(encoding='utf-8')
          print('KT x2 rules and main CTA checks OK')
          PY

      - name: Commit update and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/kt-bundle-double-once.yml
          git config user.name 'woongbts'
          git config user.email 'swb3301@gmail.com'
          git add -A
          git commit -m 'Apply doubled KT mobile bundle discounts'
          git push origin HEAD:main
