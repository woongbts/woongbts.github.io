name: Fix Hellovision gift guide once
on:
  push:
    branches: [tmp-fix-hellogift-20260921]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-fix-hellogift-20260921
      - name: Fix Hellovision gift guide amounts
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          data_path = Path('data/internet.json')
          data = json.loads(data_path.read_text(encoding='utf-8'))
          note = data.get('meta', {}).get('hellovision_note', '')
          old = '고객사은품 최대 금액은 현금+상품권 합산 기준.'
          new = '고객사은품 최대 금액은 정책표의 경품가이드 최대값 기준이며, 해당 가이드 금액에는 상품권이 포함된다.'
          if old in note:
              data['meta']['hellovision_note'] = note.replace(old, new)
          else:
              data.setdefault('meta', {})['hellovision_note'] = note + (' ' if note else '') + new
          data_path.write_text(json.dumps(data, ensure_ascii=False, separators=(',', ':')), encoding='utf-8')

          src_path = Path('src/rates.js')
          src = src_path.read_text(encoding='utf-8')
          old_gift = 'LGHELLO:{groups:["BASIC"],none:{100:32,160:38,500:48,1e3:48},tv:{TV_HD_ECONOMY:{100:34,160:40,500:50,1e3:50},TV_UHD_ECONOMY:{100:56,160:68,500:78,1e3:78}}}'
          new_gift = 'LGHELLO:{groups:["BASIC"],none:{100:13,160:13,500:18,1e3:20},tv:{TV_HD_ECONOMY:{100:13,160:13,500:18,1e3:20},TV_UHD_ECONOMY:{100:30,160:30,500:35,1e3:40}}}'
          assert old_gift in src, 'current LGHELLO gift matrix not found'
          src = src.replace(old_gift, new_gift, 1)
          old_data_ver = 'fetch("data/internet.json?v=20260921-8")'
          assert old_data_ver in src, 'internet cache version not found'
          src = src.replace(old_data_ver, 'fetch("data/internet.json?v=20260921-9")', 1)
          src_path.write_text(src, encoding='utf-8')

          html_path = Path('rates.html')
          html = html_path.read_text(encoding='utf-8')
          old_asset_ver = 'assets/rates.min.js?v=20260921-8'
          assert old_asset_ver in html, 'rates asset cache version not found'
          html = html.replace(old_asset_ver, 'assets/rates.min.js?v=20260921-9', 1)
          html_path.write_text(html, encoding='utf-8')
          PY
      - name: Rebuild production asset
        run: python3 .github/scripts/build_rates_asset.py
      - name: Validate
        shell: bash
        run: |
          node --check src/rates.js
          node --check assets/rates.min.js
          python3 .github/scripts/build_rates_asset.py --check
          python3 .github/scripts/validate_site.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=Path('src/rates.js').read_text(encoding='utf-8')
          required=[
            'none:{100:13,160:13,500:18,1e3:20}',
            'TV_HD_ECONOMY:{100:13,160:13,500:18,1e3:20}',
            'TV_UHD_ECONOMY:{100:30,160:30,500:35,1e3:40}',
            'TV_HD_ECONOMY:{100:25130,160:29860,500:32890,1e3:34100}',
            'TV_UHD_ECONOMY:{100:32830,160:37560,500:40590,1e3:41800}'
          ]
          for token in required:
              assert token in s, token
          assert 'fetch("data/internet.json?v=20260921-9")' in s
          assert 'assets/rates.min.js?v=20260921-9' in Path('rates.html').read_text(encoding='utf-8')
          d=json.loads(Path('data/internet.json').read_text(encoding='utf-8'))
          assert '경품가이드 최대값' in d['meta']['hellovision_note']
          print('Hellovision gift guide assertions passed')
          PY
      - name: Commit fix and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "woongbts"
          git config user.email "swb3301@gmail.com"
          rm -f .github/workflows/fix-hellovision-gift-once.yml
          git add data/internet.json src/rates.js assets/rates.min.js rates.html .github/workflows/fix-hellovision-gift-once.yml
          git commit -m "Fix Hellovision gift guide amounts"
          git push origin HEAD:tmp-fix-hellogift-20260921
