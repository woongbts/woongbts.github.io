name: Final contextual AI upgrade

on:
  push:
    paths:
      - '.github/workflows/tmp-ai-context-final.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply and validate contextual AI
        run: |
          python tmp_apply_ai_context_final.py
          node --check worker.js
          node --check assets/ai-chat.min.js
          python - <<'PY'
          from pathlib import Path
          w=Path('worker.js').read_text(encoding='utf-8')
          a=Path('assets/ai-chat.min.js').read_text(encoding='utf-8')
          i=Path('index.html').read_text(encoding='utf-8')
          r=Path('rates.html').read_text(encoding='utf-8')
          assert 'answerCurrentCondition' in w
          assert 'answerFromPublicCatalog(question, context)' in w
          assert '20260917-context-3' in w
          assert 'history:h.slice(-8),context:f()' in a
          assert '이 요금제 괜찮나요?' in a
          assert 'assets/ai-chat.min.js?v=20260917-2' in i
          assert 'assets/ai-chat.min.js?v=20260917-2' in r
          assert 'assets/ai-chat.js?v=20260915-1' not in i
          print('context AI validation ok')
          PY
      - name: Deploy Worker if repository credentials are available
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            npx --yes wrangler@latest deploy
          else
            echo "Cloudflare deploy credentials not present in GitHub Actions; relying on connected Worker build if configured."
          fi
      - name: Commit upgrade and clean temporary files
        run: |
          git config user.name "woongbts"
          git config user.email "swb3301@gmail.com"
          git rm -f tmp_ai_context_upgrade.py tmp_audit_fix.py tmp_apply_ai_context_final.py || true
          git rm -f .github/workflows/tmp-ai-context-upgrade.yml .github/workflows/tmp-ai-context-upgrade-v2.yml .github/workflows/tmp-ai-context-upgrade-v3.yml .github/workflows/tmp-prepaid-diagnostic.yml .github/workflows/tmp-ai-context-final.yml || true
          git add worker.js assets/ai-chat.min.js index.html rates.html
          git commit -m "Improve contextual customer AI guidance"
          git push
