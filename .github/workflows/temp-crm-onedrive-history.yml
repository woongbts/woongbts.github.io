name: Temporary CRM OneDrive and history patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-crm-onedrive-history.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch CRM source
        run: |
          python .github/scripts/temp_crm_patch_history.py
          python .github/scripts/temp_crm_patch_onedrive_ui.py
      - name: Install and validate CRM
        working-directory: .github/crm
        run: |
          npm install --ignore-scripts
          npm run check
          npm run build
      - name: Commit patched CRM
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/crm/src/worker.js .github/crm/web/app.js .github/crm/web/import-utils.js .github/crm/web/index.html .github/crm/web/styles.css .github/crm/tests/import-utils.test.mjs .github/crm/README.md
          git commit -m 'Add OneDrive direct import and contract history' || exit 0
          git push origin HEAD:main
