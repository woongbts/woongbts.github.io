      - name: Install and validate CRM
        working-directory: .github/crm
        run: |
          npm install --ignore-scripts
          npm run check
          npm run build

      - name: Commit patched CRM
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/crm/src/worker.js .github/crm/web/app.js .github/crm/web/import-utils.js .github/crm/web/index.html .github/crm/web/styles.css .github/crm/tests/import-utils.test.mjs .github/crm/README.md .github/crm/package.json .github/crm/web/onedrive.js .github/crm/migrations/0003_customer_contracts.sql
          git commit -m 'Add OneDrive direct import and contract history' || exit 0
          git push origin HEAD:main
