name: Build OG image
on:
  push:
    branches: [main]
    paths:
      - 'assets/woongbi-og-20261006.svg'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SVG renderer and Korean fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin fonts-noto-cjk
      - name: Render PNG
        run: |
          rsvg-convert -w 1200 -h 630 assets/woongbi-og-20261006.svg -o assets/woongbi-og-20261006.png
      - name: Commit rendered OG image
        run: |
          if [ -z "$(git status --porcelain -- assets/woongbi-og-20261006.png)" ]; then
            echo "No image changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/woongbi-og-20261006.png
          git commit -m "Render new Woongbi OG image"
          git push
