name: Temporary CRM source breakdown patch

on:
  push:
    branches: [crm-source-breakdown-20260929]
    paths:
      - '.github/scripts/patch_crm_source_breakdown.py'
      - '.github/workflows/tmp-crm-source-breakdown.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: crm-source-breakdown-20260929
      - name: Apply patch
        run: python3 .github/scripts/patch_crm_source_breakdown.py
      - name: Validate syntax
        run: |
          node --check .github/crm/src/worker.js
          node --check .github/crm/web/app.js
      - name: Commit patched files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/crm/src/worker.js .github/crm/web/app.js
          git diff --cached --quiet && exit 0
          git commit -m 'Show detailed traffic source breakdown in CRM'
          git push origin HEAD:crm-source-breakdown-20260929
