name: Analyze mobile quote dependencies

on:
  push:
    branches:
      - hardening/server-only-mobile-quote
    paths:
      - '.github/scripts/analyze_mobile_quote_refs.mjs'
      - '.github/workflows/analyze-mobile-quote.yml'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/server-only-mobile-quote
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node .github/scripts/analyze_mobile_quote_refs.mjs
