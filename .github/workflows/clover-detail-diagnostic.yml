name: Diagnose Clover product detail

on:
  push:
    paths:
      - 'rental/.clover-detail-diagnostic-trigger'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Capture sample detail text
        run: python .github/scripts/diagnose_clover_detail.py
      - name: Commit diagnostic
        run: |
          git config user.name "woongbi-diagnostic-bot"
          git config user.email "actions@users.noreply.github.com"
          git add rental/data/clover-detail-diagnostic.json
          git commit -m "Capture Clover detail diagnostics" || exit 0
          git pull --rebase origin main
          git push
