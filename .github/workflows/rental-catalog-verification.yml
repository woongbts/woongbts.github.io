name: Rental catalog verification

on:
  push:
    branches: [main]
    paths:
      - 'rental/data/products.json'
      - 'rental/data/appliance-gift-options.json'
      - 'scripts/build-rental-verification.py'
      - '.github/workflows/rental-catalog-verification.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rental-catalog-verification
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/build-rental-verification.py
      - name: Commit verification report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'woongbi-rental-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add rental/data/catalog-verification.json
          if git diff --cached --quiet; then
            echo 'verification report unchanged.'
            exit 0
          fi
          git commit -m 'Update rental catalog verification report'
          git pull --rebase origin main
          git push
