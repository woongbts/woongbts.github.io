name: KT 1G mobile bundle once

on:
  push:
    branches: [tmp-kt-corrected-20260921-work]
    paths:
      - '.github/workflows/kt-1g-mobile-bundle-once.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply KT 1G mobile bundle discounts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re

          path = Path('data/internet.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          rules = data.get('bundle_rules', [])
          by_id = {r['id']: r for r in rules}

          expected = {
              'KT-TOTAL-1G-L1': {
                  'provider_id': 'KT', 'kind': 'mobile',
                  'name': '총액결합 · 22,000원 미만 · 1G 7,700원 할인',
                  'minimum_speed_mbps': 1000, 'maximum_speed_mbps': 1000,
                  'discount': 7700, 'source_order': 25,
                  'notes': '모바일 월정액 합계 22,000원 미만 기준 · 인터넷 청구 7,700원 할인 · 500M과 동일 할인액 · 패밀리 1G 포함',
              },
              'KT-TOTAL-1G-L2': {
                  'provider_id': 'KT', 'kind': 'mobile',
                  'name': '총액결합 · 22,000원 이상 · 1G 11,000원 할인',
                  'minimum_speed_mbps': 1000, 'maximum_speed_mbps': 1000,
                  'discount': 11000, 'source_order': 26,
                  'notes': '모바일 월정액 합계 22,000원 이상 기준 · 인터넷 청구 11,000원 할인 · 500M과 동일 할인액 · 패밀리 1G 포함',
              },
          }

          for rid, values in expected.items():
              if rid not in by_id:
                  rules.append({'id': rid, **values})
                  by_id[rid] = rules[-1]
              else:
                  by_id[rid].clear()
                  by_id[rid].update({'id': rid, **values})

          data['bundle_rules'] = rules
          data.setdefault('meta', {})['updated_at'] = '2026-09-21'
          data['meta']['mobile_bundle_note'] = (
              'KT 총액결합 할인은 속도별 두 구간으로 자동 계산한다. '
              '100M은 모바일 월정액 합계 22,000원 미만 1,650원 할인, 22,000원 이상 3,300원 할인. '
              '500M과 1G(패밀리 상품 포함)는 22,000원 미만 7,700원 할인, 22,000원 이상 11,000원 할인.'
          )
          path.write_text(json.dumps(data, ensure_ascii=False, separators=(',', ':')) + '\n', encoding='utf-8')

          src_path = Path('src/rates.js')
          src = src_path.read_text(encoding='utf-8')
          src, count = re.subn(r'data/internet\.json\?v=\d{8}-\d+', 'data/internet.json?v=20260921-5', src, count=1)
          if count != 1:
              raise SystemExit('internet cache marker not found or duplicated')
          src_path.write_text(src, encoding='utf-8')

          rates_path = Path('rates.html')
          html = rates_path.read_text(encoding='utf-8')
          html, count = re.subn(r'assets/rates\.min\.js\?v=\d{8}-\d+', 'assets/rates.min.js?v=20260921-5', html, count=1)
          if count != 1:
              raise SystemExit('rates asset cache marker not found or duplicated')
          rates_path.write_text(html, encoding='utf-8')

          assert 38500 - 7700 == 30800
          assert 38500 - 11000 == 27500
          assert 27500 - 7700 == 19800
          assert 27500 - 11000 == 16500
          PY

      - name: Rebuild production rates asset
        run: python .github/scripts/build_rates_asset.py

      - name: Validate site
        shell: bash
        run: |
          python -m json.tool data/internet.json >/dev/null
          node --check src/rates.js
          node --check assets/rates.min.js
          python .github/scripts/build_rates_asset.py --check
          python .github/scripts/validate_site.py
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('data/internet.json').read_text(encoding='utf-8'))
          rules={r['id']:r for r in data['bundle_rules']}
          assert rules['KT-TOTAL-1G-L1']['discount']==7700
          assert rules['KT-TOTAL-1G-L2']['discount']==11000
          assert rules['KT-TOTAL-1G-L1']['minimum_speed_mbps']==1000
          assert rules['KT-TOTAL-1G-L1']['maximum_speed_mbps']==1000
          assert rules['KT-TOTAL-1G-L2']['minimum_speed_mbps']==1000
          assert rules['KT-TOTAL-1G-L2']['maximum_speed_mbps']==1000
          products={p['id']:p for p in data['internet_products']}
          assert products['INT-KT-INTERNET_GIGA_PLUS']['speed_mbps']==1000
          assert products['INT-KT-INTERNET_GIGA_FAM_PLUS']['speed_mbps']==1000
          assert products['INT-KT-INTERNET_GIGA_PLUS']['monthly_fee']-rules['KT-TOTAL-1G-L1']['discount']==30800
          assert products['INT-KT-INTERNET_GIGA_PLUS']['monthly_fee']-rules['KT-TOTAL-1G-L2']['discount']==27500
          assert products['INT-KT-INTERNET_GIGA_FAM_PLUS']['monthly_fee']-rules['KT-TOTAL-1G-L1']['discount']==19800
          assert products['INT-KT-INTERNET_GIGA_FAM_PLUS']['monthly_fee']-rules['KT-TOTAL-1G-L2']['discount']==16500
          print('KT 1G bundle checks OK')
          PY

      - name: Commit update and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/kt-1g-mobile-bundle-once.yml
          git config user.name 'woongbts'
          git config user.email 'swb3301@gmail.com'
          git add -A
          git commit -m 'Apply KT 1G mobile bundle discounts'
          git push origin HEAD:tmp-kt-corrected-20260921-work
