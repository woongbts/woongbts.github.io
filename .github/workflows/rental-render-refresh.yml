name: Render refresh rental catalog

on:
  push:
    paths:
      - 'rental/.render-refresh-trigger'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser parser
        run: |
          python -m pip install --disable-pip-version-check beautifulsoup4 playwright
          python -m playwright install --with-deps chromium
      - name: Render and import public catalog facts
        run: python .github/scripts/import_clover_playwright.py
      - name: Commit refreshed catalog
        run: |
          git config user.name "woongbi-catalog-bot"
          git config user.email "actions@users.noreply.github.com"
          git add rental/data/products.json rental/data/clover-import-report.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh rendered rental catalog data"
          git pull --rebase origin main
          git push
