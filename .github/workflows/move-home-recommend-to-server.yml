name: Move homepage recommendations to server

on:
  push:
    branches:
      - hardening/home-server-recommend
    paths:
      - '.github/scripts/move_home_recommend_to_server.mjs'
      - '.github/workflows/move-home-recommend-to-server.yml'

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/home-server-recommend
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Move homepage recommendation source behind server bridge
        run: node .github/scripts/move_home_recommend_to_server.mjs
      - name: Validate transformed homepage
        run: |
          node --check assets/home-recommend-api.min.js
          node --check assets/site-pro.min.js
          node --check sw.js
          grep -q '/recommend/purpose' assets/home-recommend-api.min.js
          grep -q 'WoongbiRecommendationV2' assets/home-recommend-api.min.js
          grep -q 'home-recommend-api.min.js' index.html
          grep -q 'home-recommend-api.min.js' sw.js
          ! grep -q 'recommendation-engine-v2.js' index.html
          test ! -e assets/recommendation-engine-v2.js
      - name: Commit transformed homepage
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js
          git diff --cached --quiet && exit 0
          git commit -m 'Use private server recommendations on homepage'
          git push origin HEAD:hardening/home-server-recommend
