name: Skylife marked products only

on:
  push:
    branches: [tmp-skylife-prune-20260921-work]
    paths:
      - '.github/workflows/skylife-prune-once.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Keep only marked Skylife TV product
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re

          path = Path('data/internet.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          remove_tv = {'TV-SKYLIFE-TV_IPIT_PLUS', 'TV-SKYLIFE-TV_IPIT_CHOICE'}
          data['tv_products'] = [x for x in data.get('tv_products', []) if x.get('id') not in remove_tv]
          data['settop_products'] = [x for x in data.get('settop_products', []) if x.get('tv_product_id') not in remove_tv]
          data.setdefault('meta', {})['skylife_note'] = (
              '스카이라이프는 사용자 표시 상품만 반영. '
              '다이렉트 단독요금은 100M 24,200원, 200M 25,300원, 500M 30,800원, 1G 36,300원. '
              '일반 IPTV 베이직 결합은 100M 34,100원, 200M 35,200원, 500M 40,700원, 1G 46,200원. '
              '30% 요금할인 번들은 IPTV 베이직 100M 25,300원, 200M 26,400원이며 고객사은품은 미지급. '
              'IPTV 플러스/초이스는 이번 고객용 선택지에서 제외.'
          )
          path.write_text(json.dumps(data, ensure_ascii=False, separators=(',', ':')) + '\n', encoding='utf-8')

          src_path = Path('src/rates.js')
          src = src_path.read_text(encoding='utf-8')
          src, count = re.subn(r'data/internet\.json\?v=\d{8}-\d+', 'data/internet.json?v=20260921-7', src, count=1)
          if count != 1:
              raise SystemExit('internet cache marker not found or duplicated')
          src_path.write_text(src, encoding='utf-8')

          rates_path = Path('rates.html')
          html = rates_path.read_text(encoding='utf-8')
          html, count = re.subn(r'assets/rates\.min\.js\?v=\d{8}-\d+', 'assets/rates.min.js?v=20260921-7', html, count=1)
          if count != 1:
              raise SystemExit('rates asset cache marker not found or duplicated')
          rates_path.write_text(html, encoding='utf-8')
          PY

      - name: Rebuild production rates asset
        run: python .github/scripts/build_rates_asset.py

      - name: Validate site
        shell: bash
        run: |
          python -m json.tool data/internet.json >/dev/null
          node --check src/rates.js
          node --check assets/rates.min.js
          python .github/scripts/build_rates_asset.py --check
          python .github/scripts/validate_site.py
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('data/internet.json').read_text(encoding='utf-8'))
          ids={x['id'] for x in data['tv_products']}
          assert 'TV-SKYLIFE-TV_IPIT_BASIC' in ids
          assert 'TV-SKYLIFE-TV_IPIT_PLUS' not in ids
          assert 'TV-SKYLIFE-TV_IPIT_CHOICE' not in ids
          p={x['id']:x for x in data['internet_products']}
          assert p['INT-SKYLIFE-INTERNET_100M_REGULAR']['monthly_fee']==24200
          assert p['INT-SKYLIFE-INTERNET_GIGA_200M_REGULAR']['monthly_fee']==25300
          assert p['INT-SKYLIFE-INTERNET_GIGA_500M']['monthly_fee']==30800
          assert p['INT-SKYLIFE-INTERNET_GIGA_1G']['monthly_fee']==36300
          assert p['INT-SKYLIFE-INTERNET_100M']['monthly_fee']==15400
          assert p['INT-SKYLIFE-INTERNET_GIGA_200M']['monthly_fee']==16500
          print('Skylife marked-product cleanup OK')
          PY

      - name: Commit update and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/skylife-prune-once.yml
          git config user.name 'woongbts'
          git config user.email 'swb3301@gmail.com'
          git add -A
          git commit -m 'Keep only marked Skylife TV products'
          git push origin HEAD:tmp-skylife-prune-20260921-work
