name: Refresh rental catalog

on:
  push:
    paths:
      - 'rental/.catalog-refresh-trigger'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser
        run: python -m pip install --disable-pip-version-check beautifulsoup4
      - name: Refresh catalog data
        run: python .github/scripts/import_clover_recursive_v2.py
      - name: Normalize imported product links
        run: python .github/scripts/fix_clover_pages.py
      - name: Commit catalog
        run: |
          git config user.name "woongbi-catalog-bot"
          git config user.email "actions@users.noreply.github.com"
          git add rental/data/products.json rental/data/clover-import-report.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh rental catalog data"
          git pull --rebase origin main
          git push
