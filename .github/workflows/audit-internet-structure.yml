name: audit-internet-structure

on:
  push:
    paths:
      - '.github/workflows/audit-internet-structure.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Print Internet structure
        run: |
          python - <<'PY'
          import json
          d=json.load(open('data/internet.json',encoding='utf-8'))
          print('PROVIDERS')
          print(json.dumps(d.get('providers',[]),ensure_ascii=False,indent=2))
          print('TV_PRODUCTS')
          print(json.dumps(d.get('tv_products',[]),ensure_ascii=False,indent=2))
          print('SETTOP_PRODUCTS')
          print(json.dumps(d.get('settop_products',[]),ensure_ascii=False,indent=2))
          print('BUNDLE_RULES')
          print(json.dumps(d.get('bundle_rules',[]),ensure_ascii=False,indent=2))
          print('INTERNET_COUNTS')
          from collections import Counter
          print(Counter(x.get('provider_id') for x in d.get('internet_products',[])))
          PY
