name: Temporary header cache bump

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-header-cache-bump.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump storefront readability stylesheet cache key
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'assets/readability-20260921.css?v=1'
          new = 'assets/readability-20260921.css?v=2'
          if old not in s:
              raise SystemExit('expected stylesheet cache key not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit cache bump
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Bump storefront header style cache'
          git push
