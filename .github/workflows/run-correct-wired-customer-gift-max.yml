name: run-correct-wired-customer-gift-max

on:
  push:
    paths:
      - '.github/workflows/run-correct-wired-customer-gift-max.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Correct customer gift maxima
        run: python scripts/correct-wired-customer-gift-max.py
      - name: Commit changes
        run: |
          git config user.name 'woongbts-ui-sync'
          git config user.email 'actions@users.noreply.github.com'
          git add assets/rates.js rates.html
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'Use policy guide maxima for wired customer gifts'
          git pull --rebase origin main
          git push origin main
