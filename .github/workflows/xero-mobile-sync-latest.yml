name: xero-mobile-sync-latest

on:
  push:
    paths:
      - '.github/workflows/xero-mobile-sync-latest.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Build wireless data from latest main
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p probe
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          text=Path('.github/workflows/xero-mobile-probe.yml').read_text(encoding='utf-8')
          marker="python3 - <<'PY'\n"
          first=text.index(marker)+len(marker)
          end=text.index('\n          PY',first)
          code=textwrap.dedent(text[first:end])
          exec(compile(code,'xero-mobile-builder','exec'),{})
          PY
          cp probe/catalog-generated.json data/catalog.json
          cp probe/plans-generated.json data/plans.json
          cp probe/supports-generated.json data/supports.json
          cp probe/devices-extra-generated.json data/devices-extra.json
          cp probe/iphone18-generated.json data/iphone18.json
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          text=Path('.github/workflows/xero-mobile-probe.yml').read_text(encoding='utf-8')
          marker="python3 - <<'PY'\n"
          first=text.index(marker)+len(marker)
          end=text.index('\n          PY',first)
          second_start=text.index(marker,end)+len(marker)
          second_end=text.index('\n          PY',second_start)
          code=textwrap.dedent(text[second_start:second_end])
          exec(compile(code,'xero-mobile-wiring','exec'),{})
          PY
      - name: Commit and push latest wireless data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'woongbts-data-sync'
          git config user.email 'actions@users.noreply.github.com'
          git add data/catalog.json data/plans.json data/supports.json data/devices-extra.json data/iphone18.json assets/rates.js rates.html
          if git diff --cached --quiet; then
            echo 'No data changes'
            exit 0
          fi
          git commit -m 'Populate full wireless calculator data'
          git pull --rebase origin main
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xero-mobile-latest-build
          path: probe/
          retention-days: 1
