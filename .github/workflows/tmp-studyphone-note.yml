name: Temporary studyphone note patch

on:
  push:
    branches: [main]
    paths:
      - 'tmp_add_studyphone_limit_note.py'
      - '.github/workflows/tmp-studyphone-note.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply patch
        run: python tmp_add_studyphone_limit_note.py
      - name: Validate note
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('rates.html').read_text(encoding='utf-8')
          expected='카카오톡 X · 인터넷 X · 전화·메시지·카메라·사전 등 기본 기능만 제공됩니다.'
          assert expected in s
          assert s.count(expected)==1
          print('studyphone note validation passed')
          PY
      - name: Commit changes
        run: |
          if git diff --quiet -- rates.html; then
            echo "No changes"
            exit 0
          fi
          git config user.name "woongbts"
          git config user.email "swb3301@gmail.com"
          git add rates.html
          git commit -m "Clarify studyphone available functions"
          git push origin main
