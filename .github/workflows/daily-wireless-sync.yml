name: Daily wireless data refresh

on:
  schedule:
    - cron: '10 2 * * *' # around 11:10 Asia/Seoul; GitHub may run late
  workflow_dispatch:
  # Also exercises the full live import when this workflow configuration is
  # edited; ordinary site/content edits do not trigger extra source requests.
  push:
    branches: [main]
    paths: ['.github/workflows/daily-wireless-sync.yml']

permissions:
  contents: write

concurrency:
  group: daily-wireless-data-refresh
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      WIRELESS_SOURCE_BASE_URL: ${{ secrets.WIRELESS_SOURCE_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Snapshot current verified wireless data
        shell: bash
        run: |
          set -euo pipefail
          cp data/catalog.json "$RUNNER_TEMP/catalog-before.json"
          cp data/plans.json "$RUNNER_TEMP/plans-before.json"
          cp data/supports.json "$RUNNER_TEMP/supports-before.json"

      - name: Validate Zeronote and public-support handling
        run: |
          python3 .github/scripts/test_daily_wireless_sync.py
          python3 .github/scripts/test_support_notice.py

      - name: Refresh verified Zeronote wireless data (skip unavailable carrier checks)
        run: python3 .github/scripts/daily_wireless_sync.py

      - name: Validate website data and JavaScript
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          for path in ('data/catalog.json','data/plans.json','data/supports.json'):
              data=json.loads(Path(path).read_text(encoding='utf-8'))
              if not isinstance(data,dict):
                  raise SystemExit(f'invalid json root: {path}')
          print('JSON validation OK')
          PY
          node --check assets/rates.min.js
          node --check assets/site-pro.min.js
          python3 .github/scripts/build_rates_asset.py --check
          python3 .github/scripts/validate_site.py

      - name: Report verified wireless changes
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/report_wireless_changes.py \
            --old-catalog "$RUNNER_TEMP/catalog-before.json" \
            --old-plans "$RUNNER_TEMP/plans-before.json" \
            --old-supports "$RUNNER_TEMP/supports-before.json" \
            --new-catalog data/catalog.json \
            --new-plans data/plans.json \
            --new-supports data/supports.json \
            --output "$RUNNER_TEMP/wireless-changes.md" \
            --step-summary "$GITHUB_STEP_SUMMARY"

      - name: Preserve full verified change report
        uses: actions/upload-artifact@v4
        with:
          name: wireless-changes-${{ github.run_id }}
          path: ${{ runner.temp }}/wireless-changes.md
          retention-days: 90
          if-no-files-found: error

      - name: Build customer support notice
        run: |
          python3 .github/scripts/test_support_notice.py
          python3 .github/scripts/build_support_notice.py --old-supports "$RUNNER_TEMP/supports-before.json"

      - name: Commit only verified changes
        shell: bash
        run: |
          set -euo pipefail
          git add data/catalog.json data/plans.json data/supports.json data/support-notice.json
          if git diff --cached --quiet; then
            echo 'No verified wireless data changes'
            exit 0
          fi
          git config user.name 'woongbts-data-sync'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m "Daily wireless data refresh $(TZ=Asia/Seoul date +%F)"
          git pull --rebase origin main
          git push origin HEAD:main
