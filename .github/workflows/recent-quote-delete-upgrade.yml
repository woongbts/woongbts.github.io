name: Recent quote delete upgrade

on:
  push:
    branches: [main]
    paths:
      - 'scripts/recent-quote-delete-upgrade.py'
      - '.github/workflows/recent-quote-delete-upgrade.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply recent quote delete upgrade
        run: python scripts/recent-quote-delete-upgrade.py
      - name: Commit updated calculator
        run: |
          if git diff --quiet -- rates.html assets/rates.js assets/rates.css; then
            echo "No calculator changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rates.html assets/rates.js assets/rates.css
          git commit -m "Add saved quote delete controls"
          git push
