name: Temporary CRM rate plan retry

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-rate-plan-retry.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run existing verified patch on latest main
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess, textwrap
          workflow = Path('.github/workflows/temp-rate-plan-upgrade.yml').read_text(encoding='utf-8')
          marker = "          python3 - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY", start)
          patch = textwrap.dedent(workflow[start:end])
          Path('/tmp/rate_plan_patch.py').write_text(patch, encoding='utf-8')
          subprocess.run(['python3', '/tmp/rate_plan_patch.py'], check=True)
          PY
      - name: Verify CRM
        working-directory: .github/crm
        run: |
          npm install --ignore-scripts
          npm run check
          npm run build
      - name: Commit on top of latest main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/readability-20260921.css index.html privacy.html .github/crm
          git commit -m 'Add encrypted CRM rate plan history'
          git pull --rebase origin main
          git push
