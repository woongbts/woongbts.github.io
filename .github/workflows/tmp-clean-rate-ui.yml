name: Clean rate UI
on:
  push:
    paths:
      - 'tmp_remove_beta_total.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply cleanup
        run: python tmp_remove_beta_total.py
      - name: Check JavaScript
        run: |
          node --check assets/rates.js
          node --check assets/ai-chat.js
      - name: Validate customer UI
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path('rates.html').read_text(encoding='utf-8')
          js=Path('assets/rates.js').read_text(encoding='utf-8')
          ai=Path('assets/ai-chat.js').read_text(encoding='utf-8')
          idx=Path('index.html').read_text(encoding='utf-8')
          for text in ['24개월 총 예상비용','24개월 총비용','24개월 약정 총비용','explain-total24','compare-support-total','compare-contract-total']:
              assert text not in html+js, text
          assert '새 기능 · BETA' not in ai
          assert 'assets/rates.js?v=20260916-30' in html
          assert 'assets/ai-chat.js?v=20260916-2' in idx
          assert 'total24' in js
          print('validation ok')
          PY
      - name: Commit changes
        run: |
          git config user.name "woongbts"
          git config user.email "swb3301@gmail.com"
          git add rates.html assets/rates.js assets/ai-chat.js index.html
          git commit -m "Simplify rate calculator customer view"
          git push
