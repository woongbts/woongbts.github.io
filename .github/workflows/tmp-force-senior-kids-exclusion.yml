name: Force exclude kids phones from senior recommendations

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-force-senior-kids-exclusion.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply hard exclusion
        run: python tmp_force_exclude_kids_from_senior.py
      - name: Check JavaScript syntax
        run: node --check assets/rates.js
      - name: Verify exclusion guards
        run: |
          grep -q "if(category==='senior'&&purposeIsKidsOnlyDevice(d))return null;" assets/rates.js
          grep -q "if(purposeIsKidsOnlyDevice(d))return 99;" assets/rates.js
          grep -q "assets/rates.js?v=20260916-22" rates.html
      - name: Commit result
        run: |
          git config user.name "woongbts"
          git config user.email "swb3301@gmail.com"
          git add assets/rates.js rates.html
          git commit -m "Harden senior recommendation kids phone exclusion" || exit 0
          git push
