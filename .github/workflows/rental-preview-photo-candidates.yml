name: Preview rental alternate product photos
on:
  push:
    branches: [main]
    paths:
      - 'scripts/preview-rental-image-candidates.py'
      - '.github/workflows/rental-preview-photo-candidates.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow requests
      - run: python scripts/preview-rental-image-candidates.py
      - name: Save visual evidence
        run: |
          git config user.name "woongbi-photos-bot"
          git config user.email "actions@users.noreply.github.com"
          git add rental/assets/product-image-audit/alternate-photo-preview.jpg*
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Review alternate rental photo candidates"
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
            sleep $((attempt*2))
          done
          exit 1
