name: fix-wired-calculator

on:
  push:
    paths:
      - '.github/workflows/fix-wired-calculator.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch calculator logic
        shell: bash
        run: |
          echo '    ' | base64 -d | python3
      - name: Commit wired calculator fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'woongbts-calculator'
          git config user.email 'actions@users.noreply.github.com'
          git add assets/rates.js rates.html
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m 'Include default settop and internet TV bundle discounts'
            git push origin HEAD:main
          fi
