name: Fix kids three models and premium families

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-fix-kids-three-premium-families.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python tmp_fix_kids_three_premium_families.py
      - name: Check JavaScript syntax
        run: node --check assets/rates.js
      - name: Verify recommendation rules
        run: |
          grep -q "SKT ZEM폰 포켓피스·LGU+ 춘식이2·KT 폼폼푸린 키즈폰 3종" assets/rates.js
          grep -q "purposePremiumFamilyKey" assets/rates.js
          grep -q "purposePremiumFamilyRank" assets/rates.js
          grep -q "purposeKidsDeviceRank(d)<99" assets/rates.js
          grep -q "assets/rates.js?v=20260916-25" rates.html
      - name: Validate current catalog targets
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          data=json.loads(Path('data/catalog.json').read_text(encoding='utf-8'))
          devices=data.get('devices',[])
          plans={p.get('id'):p for p in data.get('mobile_plans',[])}
          supports=data.get('mobile_supports',[])
          def txt(d): return f"{d.get('name','')} {d.get('model','')} {d.get('model_code','')}"
          targets={
            'SKT 포켓피스':[d for d in devices if d.get('carrier')=='SKT' and re.search(r'포켓피스|pocketpiece',txt(d),re.I)],
            'LGU+ 춘식이2':[d for d in devices if d.get('carrier')=='LGU+' and re.search(r'춘식이\s*2|춘식이키즈2|choonsik2',txt(d),re.I)],
            'KT 폼폼푸린':[d for d in devices if d.get('carrier')=='KT' and re.search(r'폼폼푸린|pompompurin',txt(d),re.I)],
          }
          for k,v in targets.items():
            print(k,[d.get('name') for d in v[:10]])
            assert v, f'{k} not found'
          fam_patterns={
            's26':r'갤럭시\s*S26(?!\+|\s*Ultra|\s*FE)|Galaxy\s*S26(?!\+|\s*Ultra|\s*FE)',
            's26plus':r'S26\+|S26 Plus',
            's26ultra':r'S26\s*Ultra',
          }
          for fam,pat in fam_patterns.items():
            ds=[d for d in devices if re.search(pat,txt(d),re.I) and re.search(r'256GB|512GB',txt(d),re.I)]
            print(fam,[d.get('name') for d in ds[:12]])
            assert ds, f'{fam} 256/512 not found'
            ids={d.get('id') for d in ds}
            fit=[]
            for s in supports:
              if s.get('device_id') not in ids or s.get('join_type')!='기기변경': continue
              amount=s.get('public_support')
              p=plans.get(s.get('plan_id'))
              if isinstance(amount,(int,float)) and 400000<=amount<=500000 and p and (p.get('monthly_fee') or 0)>=80000:
                fit.append((s.get('device_id'),p.get('name'),amount))
            print(fam,'direct support fits',fit[:8])
          PY
      - name: Commit result
        run: |
          git config user.name "woongbts"
          git config user.email "swb3301@gmail.com"
          git add assets/rates.js rates.html
          git commit -m "Pin kids recommendations and diversify premium lineup" || exit 0
          git push
