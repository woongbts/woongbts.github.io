name: xero-prepaid-probe

on:
  push:
    paths:
      - '.github/workflows/xero-prepaid-probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe prepaid and MVNO conditions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p probe
          python3 - <<'PY'
          import json, urllib.parse, urllib.request
          from pathlib import Path
          ROOT='https://www.xeronote.co.kr'
          REF=ROOT+'/consult/mobile.php?consult_mode=NONE_DEVICE'
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36'
          def get(path,params):
              u=ROOT+path+'?'+urllib.parse.urlencode(params)
              req=urllib.request.Request(u,headers={'User-Agent':UA,'Accept':'application/json,text/plain,*/*','Referer':REF})
              with urllib.request.urlopen(req,timeout=25) as r:
                  return json.loads(r.read().decode('utf-8-sig'))
          telecom=get('/api/data/get_telecom_list.php',{}).get('data',[])
          out={'providers':[]}
          for t in telecom:
              tid=t.get('telecom_id','')
              rows=get('/api/data/get_mobile_plan_list.php',{
                  'telecom_id':tid,'device_idx':'','plan_group':'PREPAY','sort_type':'','join_type':'MNP',
                  'join_flag':'ABLE','plan_idx':'','keyword':''
              }).get('data',[]) or []
              if rows:
                  out['providers'].append({'telecom':t,'rows':rows})
          Path('probe/prepaid.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          dbg={}
          for flag in ['ABLE','MAIN']:
              for net in ['', 'LTE', '5G']:
                  params={'telecom_id':'MOBINGSKT','device_idx':'','plan_group':'USIM','sort_type':'','join_type':'MNP','join_flag':flag,'plan_idx':'','keyword':''}
                  if net: params['network_type']=net
                  rows=get('/api/data/get_mobile_plan_list.php',params).get('data',[]) or []
                  target=[r for r in rows if str(r.get('plan_idx'))=='1837']
                  dbg[f'{flag}-{net or "NONE"}']={'count':len(rows),'target':target}
          Path('probe/mvno-debug.json').write_text(json.dumps(dbg,ensure_ascii=False,indent=2),encoding='utf-8')
          print('prepaid providers',len(out['providers']))
          print(json.dumps(dbg,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: xero-prepaid-probe
          path: probe/
          retention-days: 1
