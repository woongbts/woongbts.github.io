name: Temporary add SIM import support

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-add-sim-import.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply patch
        run: python .github/crm/temp_patch_sim.py
      - name: Validate CRM
        working-directory: .github/crm
        run: npm install --ignore-scripts && npm run check && npm run build
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/crm/web/import-utils.js .github/crm/web/app.js .github/crm/web/index.html .github/crm/src/worker.js .github/crm/tests/import-utils.test.mjs .github/crm/tests/worker-schema.test.mjs
          git commit -m 'Import wireless and SIM sales sheets'
          git push
