name: One-shot site analytics updater

on:
  push:
    branches:
      - tmp-site-analytics-20260924
    paths:
      - '.github/workflows/tmp-site-analytics.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-site-analytics-20260924
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch visitor analytics
        run: python .github/scripts/tmp_site_analytics.py
      - name: Fix generated analytics asset newline
        run: python -c "from pathlib import Path; p=Path('assets/site-analytics.min.js'); s=p.read_text(); p.write_text(s[:-2]+'\n' if s.endswith('\\\\n') else s)"
      - name: Validate CRM and site
        shell: bash
        run: |
          set -euo pipefail
          cd .github/crm
          npm install --ignore-scripts
          npm run check
          npm run build
          cd ../..
          node --check assets/site-analytics.min.js
          python .github/scripts/validate_site.py
          python -c "from pathlib import Path; assert 'siteAnalyticsCollect' in Path('.github/crm/src/worker.js').read_text(); assert '/api/site-analytics' in Path('.github/crm/src/consent-public.js').read_text(); assert 'stat-site-today-visits' in Path('.github/crm/web/index.html').read_text(); assert 'site-analytics.min.js?v=20260924-1' in Path('index.html').read_text(); assert 'site-analytics.min.js?v=20260924-1' in Path('rates.html').read_text(); assert 'site-analytics.min.js?v=20260924-1' in Path('links.html').read_text(); assert 'IP 주소는 방문통계 DB에 저장하지 않습니다' in Path('privacy.html').read_text()"
          git diff --check
      - name: Commit patched files
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-site-analytics.yml
          rm .github/scripts/tmp_site_analytics.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add private first-party site visitor analytics [skip ci]'
          git push origin HEAD:tmp-site-analytics-20260924
