name: One-shot site analytics updater

on:
  push:
    branches:
      - tmp-site-analytics-20260924
    paths:
      - '.github/workflows/tmp-site-analytics.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-site-analytics-20260924
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch visitor analytics
        run: python .github/scripts/tmp_site_analytics.py
      - name: Finalize public analytics assets
        shell: bash
        run: |
          python -c "from pathlib import Path; p=Path('assets/site-analytics.min.js'); s=p.read_text(); p.write_text(s[:-2]+'\n' if s.endswith('\\\\n') else s)"
          if ! grep -q 'analytics-config.js?v=20260924-1' links.html; then
            sed -i 's#<script src="/assets/site-analytics.min.js?v=20260924-1" defer></script>#<script src="/assets/analytics-config.js?v=20260924-1" defer></script><script src="/assets/site-analytics.min.js?v=20260924-1" defer></script>#' links.html
          fi
          python .github/scripts/tmp_preserve_eol.py
      - name: Validate CRM and site
        shell: bash
        run: |
          set -euo pipefail
          cd .github/crm
          npm install --ignore-scripts
          npm run check
          npm run build
          cd ../..
          node --check assets/site-analytics.min.js
          node --check assets/analytics-config.js
          python .github/scripts/validate_site.py
          grep -q 'siteAnalyticsCollect' .github/crm/src/worker.js
          grep -q '/api/site-analytics' .github/crm/src/consent-public.js
          grep -q 'stat-site-today-visits' .github/crm/web/index.html
          grep -q 'site_analytics' .github/crm/web/app.js
          for p in index.html rates.html links.html; do
            grep -q 'analytics-config.js?v=20260924-1' "$p"
            grep -q 'site-analytics.min.js?v=20260924-1' "$p"
          done
          grep -q '방문 통계 DB에는 이름·전화번호·IP 주소를 저장하지 않습니다' privacy.html
          git diff --check
      - name: Commit patched files
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-site-analytics.yml
          rm .github/scripts/tmp_site_analytics.py
          rm .github/scripts/tmp_preserve_eol.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add private first-party site visitor analytics [skip ci]'
          git push origin HEAD:tmp-site-analytics-20260924
