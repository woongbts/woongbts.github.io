name: Audit rental hero image quality

on:
  push:
    branches: [main]
    paths:
      - 'rental/.image-quality-trigger'
      - 'scripts/audit-rental-hero-images.py'
      - '.github/workflows/rental-hero-image-quality.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rental-hero-image-quality
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image verification packages
        run: python -m pip install --disable-pip-version-check pillow numpy opencv-python-headless
      - name: Inspect entire catalog and build visual review sheets
        run: python scripts/audit-rental-hero-images.py
      - name: Save audit results
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "woongbi-image-quality-bot"
          git config user.email "actions@users.noreply.github.com"
          git add rental/data/hero-image-quality-audit.json rental/assets/product-image-audit/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Audit rental product hero images and flag marketing photos"
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
            sleep $((attempt * 3))
          done
          exit 1
