name: xero-mobile-probe

on:
  push:
    paths:
      - '.github/workflows/xero-mobile-probe.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Build audited public wireless dataset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p probe
          python3 - <<'PY'
          import json, urllib.parse, urllib.request, pathlib, time, collections
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from datetime import datetime
          from zoneinfo import ZoneInfo

          ROOT='https://www.xeronote.co.kr'
          REF=ROOT+'/consult/mobile.php'
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36'
          OUT=pathlib.Path('probe')
          CARRIERS=[('SKT','SKT','SKT'),('KT','KT','KT'),('LGUPLUS','LGU+','LG')]
          JOIN_QUERIES=[('기기변경','CHANGE','support_money_change'),('번호이동','MNP','support_money_mnp'),('신규가입','NEW','support_money')]

          def get_json(path, params, attempts=4):
              url=ROOT+path+'?'+urllib.parse.urlencode(params)
              last=None
              for n in range(attempts):
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':UA,'Accept':'application/json,text/plain,*/*','Referer':REF})
                      with urllib.request.urlopen(req,timeout=30) as r:
                          return json.loads(r.read().decode('utf-8-sig'))
                  except Exception as e:
                      last=e
                      time.sleep(.7*(n+1))
              raise last

          def money(v):
              if v is None: return None
              s=str(v).replace(',','').replace('원','').strip()
              return int(s) if s.lstrip('-').isdigit() else None

          def clean(v):
              return ' '.join(str(v or '').replace('\t',' ').split())

          def eligible_rows(rows):
              return [p for p in (rows or []) if str(p.get('join_yn','')).upper()!='N' and str(p.get('except_yn','')).upper()!='Y']

          today=datetime.now(ZoneInfo('Asia/Seoul')).date().isoformat()
          base=json.loads(pathlib.Path('data/catalog.json').read_text(encoding='utf-8'))
          all_devices=[]
          all_plans={}
          per_device_support={}
          carrier_stats={}
          audit={'date':today,'carriers':{},'missing_support_samples':[],'wide9_check':None}

          for api_carrier,carrier,prefix in CARRIERS:
              raw=get_json('/api/data/get_device_list.php',{
                  'telecom_id':api_carrier,'manufacturer_id':'','sort_type1':'PHONE','sort_type2':'RELEASE_DT_DESC',
                  'keyword':'','search_group':'','search_support_mnp':''
              }).get('data',[]) or []
              candidates=[]
              for order,d in enumerate(raw,1):
                  price=money(d.get('factory_price'))
                  release=clean(d.get('release_dt'))
                  if price is None or price<=0 or release in ('','0000-00-00'):
                      continue
                  candidates.append((order,d))

              def fetch_device(item):
                  order,d=item
                  did=str(d.get('device_idx'))
                  init=get_json('/api/data/get_consult_init.php',{
                      'telecom_id':api_carrier,'device_idx':did,'consult_mode':'','plan_idx':''
                  }).get('data',{}) or {}
                  network=clean(init.get('network_type'))
                  by_join={}
                  for join_label,join_code,_field in JOIN_QUERIES:
                      params={
                          'telecom_id':api_carrier,'device_idx':did,'plan_group':'','sort_type':'','join_type':join_code,
                          'join_flag':'ABLE','plan_idx':'','keyword':''
                      }
                      if network and network!='ALL': params['network_type']=network
                      by_join[join_label]=eligible_rows(get_json('/api/data/get_mobile_plan_list.php',params).get('data',[]) or [])
                  return order,d,init,by_join

              results=[]
              with ThreadPoolExecutor(max_workers=8) as ex:
                  futs=[ex.submit(fetch_device,x) for x in candidates]
                  for fut in as_completed(futs):
                      results.append(fut.result())
              results.sort(key=lambda x:x[0])

              included=0; eligible_cells=0; known_cells=0; missing_cells=0
              for order,d,init,by_join in results:
                  union_by_idx={}
                  eligible_by_join={}
                  support_by_join={}
                  for join_label,_join_code,field in JOIN_QUERIES:
                      rows=by_join.get(join_label,[])
                      ids=[]; amounts={}
                      for po,p in enumerate(rows,1):
                          raw_pid=str(p.get('plan_idx') or '')
                          if not raw_pid: continue
                          pid=f'{prefix}-XP-{raw_pid}'
                          ids.append(pid); union_by_idx.setdefault(raw_pid,(po,p))
                          amt=money(p.get(field))
                          eligible_cells+=1
                          if amt is not None:
                              amounts[pid]=amt; known_cells+=1
                          else:
                              missing_cells+=1
                              if len(audit['missing_support_samples'])<30:
                                  audit['missing_support_samples'].append({'carrier':carrier,'device':clean(d.get('model_name')),'device_idx':str(d.get('device_idx')),'join_type':join_label,'plan':clean(p.get('plan_name')),'plan_idx':raw_pid})
                      eligible_by_join[join_label]=ids
                      support_by_join[join_label]=amounts
                  if not union_by_idx: continue
                  included+=1
                  did=str(d.get('device_idx'))
                  device_id=f'{prefix}-XD-{did}'
                  eligible_union=[]
                  for join_label,_,_ in JOIN_QUERIES:
                      for pid in eligible_by_join[join_label]:
                          if pid not in eligible_union: eligible_union.append(pid)
                  for raw_pid,(po,p) in union_by_idx.items():
                      pid=f'{prefix}-XP-{raw_pid}'
                      price=money(p.get('price'))
                      if pid not in all_plans:
                          all_plans[pid]={
                              'id':pid,'carrier':carrier,'name':clean(p.get('plan_name')),'monthly_fee':price,
                              'data':clean(p.get('data')),'voice':clean(p.get('voice')),'sms':clean(p.get('sms')),
                              'video':clean(p.get('video')),'age_limit':clean(p.get('age_limit')),
                              'network_type':clean(init.get('network_type')),'source_order':po,
                              'xero_plan_idx':raw_pid
                          }
                      else:
                          q=all_plans[pid]
                          q['source_order']=min(int(q.get('source_order') or po),po)
                          for k,val in [('monthly_fee',price),('data',clean(p.get('data'))),('voice',clean(p.get('voice'))),('sms',clean(p.get('sms'))),('video',clean(p.get('video'))),('age_limit',clean(p.get('age_limit')))]:
                              if q.get(k) in (None,'') and val not in (None,''): q[k]=val
                  all_devices.append({
                      'id':device_id,'carrier':carrier,'name':clean(d.get('model_name')),'model':'',
                      'model_code':clean(d.get('device_name')),'manufacturer':clean(d.get('manufacturer_name')),
                      'release_date':clean(d.get('release_dt')),'retail_price':money(d.get('factory_price')),
                      'factory_price_date':clean(d.get('factory_price_dt')),'announce_date':clean(d.get('announce_dt')),
                      'network_type':clean(init.get('network_type')),'source_order':order,'installment_months':[24,30,36],
                      'eligible_plan_ids':eligible_union,'eligible_plan_ids_by_join_type':eligible_by_join,'xero_device_idx':did
                  })
                  per_device_support[(carrier,device_id)]=support_by_join
                  if carrier=='SKT' and (did=='2896' or 'Wide9' in clean(d.get('model_name'))):
                      target_pid=f'{prefix}-XP-2945'
                      audit['wide9_check']={
                          'device':clean(d.get('model_name')),'device_idx':did,'plan_id':target_pid,
                          '기기변경':support_by_join.get('기기변경',{}).get(target_pid),
                          '번호이동':support_by_join.get('번호이동',{}).get(target_pid),
                          '신규가입':support_by_join.get('신규가입',{}).get(target_pid)
                      }
              carrier_stats[carrier]={'api_devices':len(raw),'candidates':len(candidates),'included_devices':included}
              audit['carriers'][carrier]={'eligible_support_cells':eligible_cells,'known_support_cells':known_cells,'missing_support_cells':missing_cells}

          plans=list(all_plans.values())
          for carrier in ['SKT','KT','LGU+']:
              rows=[p for p in plans if p['carrier']==carrier]
              rows.sort(key=lambda p:(-(p.get('monthly_fee') or 0),p.get('name') or ''))
              for i,p in enumerate(rows,1): p['source_order']=i

          raw_rules=[]
          for carrier in ['SKT','KT','LGU+']:
              for join_type in ['기기변경','번호이동','신규가입']:
                  groups=collections.defaultdict(lambda:{'amounts':None,'devices':[]})
                  for (c,did),joins in per_device_support.items():
                      if c!=carrier: continue
                      amounts=joins.get(join_type,{})
                      sig=json.dumps(amounts,sort_keys=True,separators=(',',':'),ensure_ascii=False)
                      groups[sig]['amounts']=amounts;groups[sig]['devices'].append(did)
                  for g in groups.values():
                      raw_rules.append({'carrier':carrier,'device_ids':sorted(g['devices']),'join_types':[join_type],'amounts':g['amounts']})
          merged={}
          for r in raw_rules:
              key=(r['carrier'],tuple(r['device_ids']),json.dumps(r['amounts'],sort_keys=True,separators=(',',':'),ensure_ascii=False))
              if key not in merged: merged[key]={'carrier':r['carrier'],'device_ids':r['device_ids'],'join_types':[],'amounts':r['amounts']}
              merged[key]['join_types'].extend(r['join_types'])
          support_schedules=list(merged.values())
          order_map={'기기변경':0,'번호이동':1,'신규가입':2}
          for r in support_schedules: r['join_types']=sorted(set(r['join_types']),key=lambda x:order_map.get(x,9))

          catalog={
              'meta':{'updated_at':today,'status':'public-wireless-data-audited','source_basis':'공개 무선상담 상품 데이터에서 가입유형별로 확인된 값만 반영','notice':'출고가·가입가능 요금제·공시지원금은 확인된 값만 표시하며 추가지원금은 매장 문의로 안내합니다.'},
              'rules':base.get('rules',{}),'carriers':['SKT','KT','LGU+'],'devices':all_devices,
              'mobile_plans':[],'mobile_supports':[],'mvno_plans':[],'internet_products':[],
              'welfare_types':base.get('welfare_types',[]),'schema_guide':base.get('schema_guide',{})
          }
          plan_data={'meta':{'updated_at':today,'note':'통신3사 공개 무선상담 화면에서 가입유형별 가입 가능 요금제를 확인해 반영합니다. 월정액은 부가세 포함 표시값입니다.'},'selection_contract_rate':0.25,'mobile_plans':plans}
          supports={'meta':{'updated_at':today,'note':'기종·가입유형·요금제별 공개 공시지원금을 가입유형별로 재검증해 반영합니다. 추가지원금은 매장 문의로 안내합니다.','unknown_behavior':'store_confirm'},'support_schedules':support_schedules}
          extra={'meta':{'updated_at':today,'note':'기종 데이터는 catalog.json의 통합 공개 무선 데이터로 관리합니다.'},'devices':[]}
          iphone={'meta':{'updated_at':today,'note':'아이폰을 포함한 기종 데이터는 catalog.json의 통합 공개 무선 데이터로 관리합니다.'},'devices':[]}
          outputs=[('catalog-generated.json',catalog),('plans-generated.json',plan_data),('supports-generated.json',supports),('devices-extra-generated.json',extra),('iphone18-generated.json',iphone)]
          for fn,obj in outputs: (OUT/fn).write_text(json.dumps(obj,ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          audit['devices']=len(all_devices);audit['plans']=len(plans);audit['support_rules']=len(support_schedules);audit['carrier_stats']=carrier_stats
          audit['sizes']={fn:(OUT/fn).stat().st_size for fn,_ in outputs}
          (OUT/'audit-summary.json').write_text(json.dumps(audit,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(audit,ensure_ascii=False,indent=2))
          PY
      - name: Apply audited data and calculator wiring
        shell: bash
        run: |
          set -euo pipefail
          cp probe/catalog-generated.json data/catalog.json
          cp probe/plans-generated.json data/plans.json
          cp probe/supports-generated.json data/supports.json
          cp probe/devices-extra-generated.json data/devices-extra.json
          cp probe/iphone18-generated.json data/iphone18.json
          python3 - <<'PY'
          from pathlib import Path
          import re
          js_path=Path('assets/rates.js');js=js_path.read_text(encoding='utf-8')
          old="function eligiblePlans(){const d=currentDevice();if(!d)return[];const ids=Array.isArray(d.eligible_plan_ids)?new Set(d.eligible_plan_ids):null;return (catalog?.mobile_plans||[]).filter(p=>p.carrier===carrier.value&&(!ids||ids.has(p.id))).sort(byOrder)}"
          new="function eligiblePlans(){const d=currentDevice();if(!d)return[];const byJoin=d.eligible_plan_ids_by_join_type||{};const source=Array.isArray(byJoin[joinType.value])?byJoin[joinType.value]:d.eligible_plan_ids;const ids=Array.isArray(source)?new Set(source):null;return (catalog?.mobile_plans||[]).filter(p=>p.carrier===carrier.value&&(!ids||ids.has(p.id))).sort(byOrder)}"
          if old in js: js=js.replace(old,new)
          elif new not in js: raise SystemExit('eligiblePlans target not found')
          js=re.sub(r"data/(catalog|plans|supports|devices-extra|iphone18|mvno-postpaid|prepaid|internet)\.json\?v=[^']+",r"data/\1.json?v=20260915-13",js)
          js_path.write_text(js,encoding='utf-8')
          html_path=Path('rates.html');html=html_path.read_text(encoding='utf-8')
          html=html.replace('최신 기종 위주로 표시합니다.','등록된 기종을 최신 출시순으로 표시합니다.')
          html=html.replace('현재 등록된 주요 일반 요금제를 표시합니다.','선택한 가입유형·기종에서 가입 가능한 요금제만 표시합니다.')
          html=html.replace('선택한 기종에서 가입 가능한 요금제만 표시합니다.','선택한 가입유형·기종에서 가입 가능한 요금제만 표시합니다.')
          html=re.sub(r'assets/rates\.js\?v=[^"\']+', 'assets/rates.js?v=20260915-13', html)
          html_path.write_text(html,encoding='utf-8')
          PY
      - name: Commit audited wireless calculator data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'woongbts-data-sync'
          git config user.email 'actions@users.noreply.github.com'
          git add data/catalog.json data/plans.json data/supports.json data/devices-extra.json data/iphone18.json assets/rates.js rates.html
          if git diff --cached --quiet; then echo 'No data changes'; exit 0; fi
          git commit -m 'Repair mobile subsidy coverage by join type'
          git pull --rebase origin main
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-support-audit
          path: probe/
          retention-days: 1
