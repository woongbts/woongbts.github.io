name: Filter phone recommendations

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-phone-recommendation-filter.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply recommendation filters
        run: python tmp_phone_recommendation_filter.py
      - name: Check JavaScript syntax
        run: node --check assets/rates.js
      - name: Verify recommendation filters
        run: |
          grep -q "purposeIsSecondDevicePlan" assets/rates.js
          grep -q "Number(p.monthly_fee)>=33000" assets/rates.js
          grep -q "purposeSalesBrandRank" assets/rates.js
      - name: Commit result
        run: |
          git config user.name "woongbts"
          git config user.email "swb3301@gmail.com"
          git add assets/rates.js
          git commit -m "Filter phone-only recommendation plans" || exit 0
          git push
