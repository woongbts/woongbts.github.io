name: Senior purpose recommendation refresh

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/senior-purpose-refresh.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply focused recommendation patch
        run: python3 tmp_refresh_senior_purpose.py
      - name: Check JavaScript syntax
        run: node --check assets/rates.js
      - name: Validate recommendation guardrails
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          js = Path('assets/rates.js').read_text(encoding='utf-8')
          required = [
              'purposeObsoleteDevice', 'purposeSeniorDeviceRank', 'purposeSeniorPlanRank',
              'Number(p.monthly_fee)>=33000', "name.includes('t플랜세이브')",
              "name.includes('베이직')", "name.includes('데이터플랜')",
              'A17·Wide8·Buddy5'
          ]
          for token in required:
              assert token in js, token
          start = js.index('const PURPOSE_COPY=')
          end = js.index('function purposeCardLine', start)
          purpose = js[start:end]
          for forbidden in ['제로노트', '리베이트', '판매점 수수료', '정산금']:
              assert forbidden not in purpose, forbidden
          data = json.loads(Path('data/mobile-public.json').read_text(encoding='utf-8'))
          print('mobile-public.json parsed:', type(data).__name__)
          print('recommendation guardrails OK')
          PY
      - name: Commit recommendation refresh
        run: |
          git config user.name 'woongbts'
          git config user.email 'swb3301@gmail.com'
          git add assets/rates.js
          if git diff --cached --quiet; then
            echo 'No rates.js changes to commit'
            exit 0
          fi
          git commit -m 'Refresh senior phone recommendations'
          git push origin HEAD:main
