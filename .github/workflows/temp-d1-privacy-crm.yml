name: Temporary D1 privacy CRM patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-d1-privacy-crm.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Finalize D1 privacy and CRM security notice
        shell: python
        run: |
          from pathlib import Path

          privacy_path = Path('privacy.html')
          privacy = privacy_path.read_text(encoding='utf-8')
          old = '''  <section class="card"><h2>5. 개인정보 처리업무의 위탁 및 클라우드 이용</h2><p>고객관리 자료의 안전한 저장·접근통제 및 업무용 파일 보관을 위해 클라우드 서비스를 이용할 수 있습니다. 현재 고객관리 시스템은 접근통제와 암호화 저장을 적용하며, 판매일보 원본 파일은 공개 GitHub 저장소에 저장하지 않습니다.</p><p class="small">클라우드 서비스 제공자의 실제 데이터 처리 위치 및 국외 이전에 관한 사항은 서비스 설정과 계약 내용을 확인하여 필요한 경우 본 방침에 구체적으로 추가 고지합니다. 해당 사항을 최종 확인하기 전에는 CRM에 실제 고객정보를 대량 등록하지 않습니다.</p></section>'''
          new = '''  <section class="card"><h2>5. 개인정보 처리업무의 위탁 및 클라우드 이용</h2><p>웅비통신은 고객관리 시스템 운영을 위해 Cloudflare, Inc.의 Cloudflare Access, Workers 및 D1 서비스를 이용합니다. 위탁 업무는 관리자 인증·접근통제, CRM 백엔드 처리 및 암호화된 고객관리 정보의 데이터베이스 보관입니다.</p><div class="table"><div class="th">수탁자</div><div>Cloudflare, Inc.</div><div class="th">처리 목적</div><div>관리자 인증, CRM 운영, 암호화된 고객관리 정보의 저장·처리</div><div class="th">보안 방식</div><div>이름·연락처·생년월일·단말기 등 주요 정보는 애플리케이션 수준에서 암호화하여 저장하며, 전화번호 중복·정확검색에는 원문 대신 HMAC 값을 사용합니다.</div><div class="th">원본 판매일보</div><div>CRM 브라우저에서 필요한 항목만 추출하며 원본 Excel·CSV 파일 자체는 CRM 서버 또는 공개 GitHub 저장소에 보관하지 않습니다.</div></div><p class="small">Cloudflare D1은 데이터베이스를 서비스 인프라에 배치하며, 위치 힌트는 특정 국가의 저장을 보장하지 않습니다. 따라서 고객관리 정보가 대한민국 외 지역에서 처리·보관될 수 있습니다. 웅비통신은 Cloudflare의 데이터 위치 정책과 관련 고지사항을 확인하고, 법령상 추가 고지 또는 동의가 필요한 경우 이를 반영합니다.</p></section>'''
          assert old in privacy, 'privacy section marker not found'
          privacy = privacy.replace(old, new, 1)
          privacy_path.write_text(privacy, encoding='utf-8')

          index_path = Path('.github/crm/web/index.html')
          index = index_path.read_text(encoding='utf-8')
          index = index.replace('Cloudflare Access 인증 · 암호화 DB · 실문자 발송 잠금 상태를 확인 중입니다.', 'Cloudflare Access 인증 · D1 암호화 저장 · 원본파일 미보관 · 실문자 발송 잠금 상태를 확인 중입니다.', 1)
          index = index.replace('Excel(.xls/.xlsx)/CSV 파일을 여러 개 선택할 수 있습니다. 원본 파일은 서버에 저장하지 않고, 필요한 고객정보만 브라우저에서 추출해 암호화 DB로 전송합니다.', 'Excel(.xls/.xlsx)/CSV 파일을 여러 개 선택할 수 있습니다. 원본 파일은 서버에 저장하지 않고, 필요한 고객정보만 브라우저에서 추출해 Cloudflare D1의 암호화 고객 DB로 전송합니다. 이름·연락처·생년월일·단말기는 암호화 저장하고 전화번호 검색·중복확인은 HMAC을 사용합니다.', 1)
          index_path.write_text(index, encoding='utf-8')

          app_path = Path('.github/crm/web/app.js')
          app = app_path.read_text(encoding='utf-8')
          old_health = "      ? 'Cloudflare Access 인증 · 암호화 DB · 문자 실발송 활성 상태'\n      : 'Cloudflare Access 인증 · 암호화 DB · 문자 실발송은 안전을 위해 잠금 상태';"
          new_health = "      ? 'Cloudflare Access 인증 · D1 + AES-GCM 암호화 저장 · 원본파일 미보관 · 문자 실발송 활성 상태'\n      : 'Cloudflare Access 인증 · D1 + AES-GCM 암호화 저장 · 원본파일 미보관 · 문자 실발송은 안전을 위해 잠금 상태';"
          assert old_health in app, 'app health marker not found'
          app = app.replace(old_health, new_health, 1)
          app_path.write_text(app, encoding='utf-8')

          worker_path = Path('.github/crm/src/worker.js')
          worker = worker_path.read_text(encoding='utf-8')
          old_worker = "    return json({ ok: true, service: 'woongbi-crm', sms_mode: env.SMS_MODE || 'dry_run' });"
          new_worker = "    return json({ ok: true, service: 'woongbi-crm', storage: 'Cloudflare D1', pii_encryption: 'AES-GCM', phone_lookup: 'HMAC-SHA-256', raw_file_storage: false, sms_mode: env.SMS_MODE || 'dry_run' });"
          assert old_worker in worker, 'worker health marker not found'
          worker = worker.replace(old_worker, new_worker, 1)
          worker_path.write_text(worker, encoding='utf-8')

          assert 'Cloudflare, Inc.' in privacy
          assert 'D1 + AES-GCM' in app
          assert "raw_file_storage: false" in worker
      - name: JavaScript syntax check
        run: node --check .github/crm/web/app.js && node --check .github/crm/src/worker.js
      - name: Prevent customer data in commit
        shell: bash
        run: |
          set -euo pipefail
          ! git diff --name-only | grep -E '\.(xlsx?|csv)$' || (echo 'Customer spreadsheet detected' && exit 1)
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add privacy.html .github/crm/web/index.html .github/crm/web/app.js .github/crm/src/worker.js
          git commit -m 'Finalize D1 privacy and CRM security notice'
          git push origin HEAD:main
