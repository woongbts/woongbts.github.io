name: Mobile plan picker upgrade

on:
  push:
    branches: [main]
    paths:
      - 'scripts/plan-picker-upgrade.py'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply mobile plan picker upgrade
        run: python scripts/plan-picker-upgrade.py
      - name: Commit upgraded consultation UI
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rates.html assets/rates.js assets/rates.css
          git commit -m "Improve mobile plan selection UI"
          git push
