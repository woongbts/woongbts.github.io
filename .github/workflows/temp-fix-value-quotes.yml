name: Temporary value quote fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-fix-value-quotes.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact value-phone quotes and scroll fix
        run: python .github/scripts/temp_fix_value_quotes.py
      - name: Validate
        run: |
          node --check assets/rates.min.js
          grep -q '갤럭시 Jump5·A37·퀀텀7의 번호이동 견적' assets/rates.min.js
          grep -q 'carrier:"SKT",deviceId:"X-SKT-2892",name:"갤럭시 A37 5G"' assets/rates.min.js
          grep -q 'support:190000,serviceMonthly:39000,monthly:62340' assets/rates.min.js
          grep -q 'return"번호이동"!==t?\[\]' assets/rates.min.js
          grep -q 'assets/rates.min.js?v=20260918-1' rates.html
      - name: Remove temporary files and commit
        run: |
          rm -f .github/workflows/temp-fix-value-quotes.yml .github/scripts/temp_fix_value_quotes.py .github/workflows/temp-diag-rates.yml .github/scripts/temp_diag_rates.py
          git config user.name 'woongbts-site-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add assets/rates.min.js rates.html .github/workflows/temp-fix-value-quotes.yml .github/scripts/temp_fix_value_quotes.py .github/workflows/temp-diag-rates.yml .github/scripts/temp_diag_rates.py
          git commit -m 'Fix value phone quotes and plan picker scrolling'
          git push origin HEAD:main
