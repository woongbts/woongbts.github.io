name: Temporary rates diagnostics

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-diag-rates.yml'

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print relevant snippets
        run: python .github/scripts/temp_diag_rates.py
