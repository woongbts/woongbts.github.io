name: Move studyphone quotes to server

on:
  push:
    branches:
      - hardening/server-only-studyphone
    paths:
      - '.github/scripts/move_studyphone_to_server.mjs'
      - '.github/workflows/move-studyphone-to-server.yml'

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/server-only-studyphone
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Replace public studyphone math with server state
        run: node .github/scripts/move_studyphone_to_server.mjs
      - name: Validate transformed calculator source
        run: |
          node --check src/rates.js
          node --check assets/rates.min.js
          node --check assets/studyphone-api-bridge.min.js
          python3 .github/scripts/build_rates_asset.py --check
          ! grep -q 'data/studyphone.json' src/rates.js
          ! grep -q 'installment_apr' src/rates.js
          ! grep -q 'public_support' src/rates.js
          ! grep -q 'Math.pow(1+o,t)' src/rates.js
          grep -q 'WoongbiStudyphoneApi?.item' src/rates.js
          grep -q 'wbLoadStudyphone()' src/rates.js
      - name: Commit transformed calculator
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/rates.js assets/rates.min.js
          git diff --cached --quiet && exit 0
          git commit -m 'Move public studyphone quote math behind server API'
          git push origin HEAD:hardening/server-only-studyphone
