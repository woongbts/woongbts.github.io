name: Publish November verified appliance offers
on:
  push:
    branches: [main]
    paths:
      - 'rental/data/november-2026-compare-report.json'
      - '.github/workflows/november-appliance-refresh.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: november-verified-appliances-pages
  cancel-in-progress: false
jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check November report and source coverage
        run: |
          python - <<'PY'
          import json
          r=json.load(open('rental/data/november-2026-compare-report.json',encoding='utf-8'))
          assert r['date']=='2026-11-03'
          assert r['verifiedProducts']>=150
          assert r['totalSourceProducts']==184
          assert r['verifiedProducts']+r['needsReview']==184
          print('verified',r['verifiedProducts'],'exceptions',r['needsReview'])
          PY
      - name: Validate customer-facing product prices and gifts
        run: |
          python scripts/check-rental-data.py
          python .github/scripts/validate_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Publish both connected websites
        id: deployment
        uses: actions/deploy-pages@v4
