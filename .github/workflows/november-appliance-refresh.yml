name: Verify and publish November appliance offers

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/refresh_clover_appliances_nov.py'
      - '.github/workflows/november-appliance-refresh.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: november-appliance-offers
  cancel-in-progress: false

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install public-source HTML parser
        run: python -m pip install --disable-pip-version-check beautifulsoup4
      - name: Verify each existing general-appliance product against November live source
        run: python .github/scripts/refresh_clover_appliances_nov.py
      - name: Validate all rental products and customer gift calculations
        run: |
          python scripts/check-rental-data.py
          python .github/scripts/validate_site.py
      - name: Commit only verified customer-facing changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'woongbi-rental-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add rental/data/products.json rental/data/appliance-gift-options.json rental/data/november-2026-compare-report.json
          if ! git diff --cached --quiet; then
            git commit -m 'Verify 2026-11 general appliance prices and gifts'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          with open('rental/data/november-2026-compare-report.json',encoding='utf-8') as f:r=json.load(f)
          print("### 2026년 11월 종합가전 원본 비교")
          for key in ("total","verified","needsReview","optionsChanged","optionsAdded","optionsNoLongerListed"):
              print("-",key+":",r[key])
          print("실제 배포 결과는 별도 작업 상태로 확인하세요.")
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Publish verified rental and telecom sites
        id: deployment
        uses: actions/deploy-pages@v4
