name: xero-public-scan

on:
  push:
    paths:
      - '.github/workflows/xero-scan.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Build verified calculator data
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, re, time, urllib.parse, urllib.request
          from pathlib import Path

          ROOT='https://www.xeronote.co.kr'
          MOBILE=ROOT+'/consult/mobile.php?consult_mode=NONE_DEVICE'
          INTERNET=ROOT+'/consult/internet.php'
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36'

          def get_json(path, params=None, referer=None):
              url=ROOT+path
              if params is not None: url += '?' + urllib.parse.urlencode(params)
              req=urllib.request.Request(url,headers={'User-Agent':UA,'Accept':'application/json,text/plain,*/*','Referer':referer or ROOT+'/'})
              with urllib.request.urlopen(req,timeout=25) as r:
                  return json.loads(r.read().decode('utf-8-sig'))

          def money(v):
              s=str(v or '').replace(',','').strip()
              return int(s) if re.fullmatch(r'-?\d+',s) else None

          def clean(v):
              return ' '.join(str(v or '').replace('\t',' ').split())

          # 후불 알뜰폰: NONE_DEVICE 공개화면의 기본 상태(번호이동 + 후불USIM + 주력요금제)와 동일하게 수집.
          telecom=get_json('/api/data/get_telecom_list.php',referer=MOBILE).get('data',[])
          network={
            'MOBINGSKT':'SKT','MOBINGKT':'KT','MOBINGLG':'LGU+','SMKT':'KT','SMSKT':'SKT',
            '7MOBILE':'SKT','MMOBILE':'KT','UPLUSE':'LGU+','SKYLIFE':'KT','HELLOSKT':'SKT',
            'HELLOKT':'KT','HELLOUPLUS':'LGU+','FREETSKT':'SKT','FREETKT':'KT','FREETLG':'LGU+',
            'IYAGISKT':'SKT','IYAGIKT':'KT','IYAGILG':'LGU+','tossmobile':'LGU+'
          }
          mvno_providers=[]; mvno_plans=[]; provider_order=0
          for t in telecom:
              tid=t.get('telecom_id','')
              if tid in ('','SKT','KT','LGUPLUS'): continue
              rows=get_json('/api/data/get_mobile_plan_list.php',{
                'telecom_id':tid,'device_idx':'','plan_group':'USIM','sort_type':'','join_type':'MNP',
                'join_flag':'MAIN','plan_idx':'','keyword':''
              },MOBILE).get('data',[])
              if not rows: continue
              provider_order+=1
              mvno_providers.append({'id':tid,'name':clean(t.get('telecom_name')),'network':network.get(tid,''),'source_order':provider_order})
              for i,r in enumerate(rows,1):
                  special=money(r.get('special_price'))
                  mvno_plans.append({
                    'id':f'{tid}-{r.get("plan_idx")}','provider_id':tid,'name':clean(r.get('plan_name')),
                    'network':network.get(tid,''),'regular_monthly_fee':money(r.get('price')),
                    'monthly_fee':special,'special_monthly_fee':special,'voice':clean(r.get('voice')),
                    'sms':clean(r.get('sms')),'data':clean(r.get('data')),'source_order':i
                  })
              time.sleep(.04)
          mvno={
            'meta':{'updated_at':'2026-09-15','pricing_rule':'special_monthly_fee_is_base_fee','plan_scope':'main_postpaid_usim','unknown_price_behavior':'store_confirm','note':'후불 알뜰폰 주력 USIM 요금제. 특별할인가를 고객 계산용 월 기본료로 사용하며 원래 월정액은 별도 보관한다.'},
            'providers':mvno_providers,'plans':mvno_plans
          }
          Path('data/mvno-postpaid.json').write_text(json.dumps(mvno,ensure_ascii=False,separators=(',',':')),encoding='utf-8')

          # 유선: 인터넷/TV/셋톱박스 공개 상품 목록과 월정액·설치비.
          provider_map={'SKB':'SKB','KT':'KT','LGUPLUS':'LGU+','HELLO':'LGHELLO','SKYLIFE':'SKYLIFE'}
          providers=[
            {'id':'SKB','name':'SK브로드밴드','source_order':1},{'id':'KT','name':'KT','source_order':2},
            {'id':'LGU+','name':'LGU+','source_order':3},{'id':'LGHELLO','name':'헬로비전','source_order':4},
            {'id':'SKYLIFE','name':'스카이라이프','source_order':5}
          ]
          groups={
            'SKB':['BASIC','WIFI','FAMILY','WINGS','SMART_SAFE'],
            'KT':['BASIC','WIFI','FAMILY','WI','FAMILY_SAFE','TOTAL_SAFE','SAFE_INTERNET'],
            'LGUPLUS':['BASIC','PREMIUM_SAFE','PREMIUM_GUARANTEE','SMART_GIGA'],
            'HELLO':['BASIC','WIFI','FAMILY'],'SKYLIFE':['BASIC','WIFI','FAMILY']
          }
          internet_products=[]; tv_products=[]; settop_products=[]
          all_tv={}
          for xbid in ['SKB','KT','LGUPLUS','HELLO','SKYLIFE']:
              pid=provider_map[xbid]; order=0
              for g in groups[xbid]:
                  rows=get_json('/api/data/get_internet_product_list.php',{'broadband_id':xbid,'product_type':'INTERNET','product_group':g},INTERNET).get('data',[])
                  for r in rows:
                      order+=1
                      internet_products.append({
                        'id':f'INT-{pid}-{r.get("product_key")}','provider_id':pid,'name':clean(r.get('product_name')),
                        'product_key':r.get('product_key'),'product_group':r.get('product_group') or g,
                        'speed_mbps':money(r.get('internet_speed')),'monthly_fee':money(r.get('product_price')),
                        'installation_fee':money(r.get('product_install')),'installation_fee_weekend':money(r.get('product_install_weekend')),
                        'source_order':order
                      })
                  time.sleep(.03)
              tv_groups=['BTV','BTV_POP'] if xbid=='SKB' else ['']
              seen=set(); rows_all=[]
              for g in tv_groups:
                  rows=get_json('/api/data/get_internet_product_list.php',{'broadband_id':xbid,'product_type':'TV','product_group':g},INTERNET).get('data',[])
                  for r in rows:
                      if r.get('product_key') in seen: continue
                      seen.add(r.get('product_key')); rows_all.append(r)
                  time.sleep(.03)
              all_tv[xbid]=rows_all
              for i,r in enumerate(rows_all,1):
                  tv_id=f'TV-{pid}-{r.get("product_key")}'
                  tv_products.append({'id':tv_id,'provider_id':pid,'name':clean(r.get('product_name')),'product_key':r.get('product_key'),'product_group':r.get('product_group') or '','monthly_fee':money(r.get('product_price')),'installation_fee':0,'source_order':i})
                  st_rows=get_json('/api/data/get_internet_sub_product_list.php',{'broadband_id':xbid,'product_type':'SETTOP','product_key':r.get('product_key')},INTERNET).get('data',[])
                  for j,s in enumerate(st_rows,1):
                      settop_products.append({
                        'id':f'STB-{pid}-{r.get("product_key")}-{s.get("product_key")}','provider_id':pid,'tv_product_id':tv_id,
                        'name':clean(s.get('product_name')),'product_key':s.get('product_key'),'monthly_fee':money(s.get('product_price')),
                        'installation_fee':money(s.get('product_install')),'installation_fee_weekend':money(s.get('product_install_weekend')),'source_order':j
                      })
                  time.sleep(.03)
          internet={
            'meta':{'updated_at':'2026-09-15','unknown_price_behavior':'store_confirm','contract_term':'3년 약정 기준','note':'인터넷, TV, 셋톱박스를 별도 상품군으로 관리하며 확인된 월요금과 설치비만 자동 계산한다.'},
            'providers':providers,'internet_products':internet_products,'tv_products':tv_products,'settop_products':settop_products,
            'bundle_rules':[{'id':'LG-TOGETHER-500M','provider_id':'LGU+','kind':'mobile','name':'U+ 투게더 · 500M 이상','minimum_speed_mbps':500,'discount':11000,'notes':'500M 이상 인터넷 결합 시 인터넷 월 11,000원 할인'}]
          }
          Path('data/internet.json').write_text(json.dumps(internet,ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          print('MVNO providers/plans:',len(mvno_providers),len(mvno_plans))
          print('Wired internet/tv/settop:',len(internet_products),len(tv_products),len(settop_products))
          PY
      - name: Commit calculator data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'woongbts-data-sync'
          git config user.email 'actions@users.noreply.github.com'
          git add data/mvno-postpaid.json data/internet.json
          if git diff --cached --quiet; then
            echo 'No data changes'
          else
            git commit -m 'Populate MVNO and wired calculator data'
            git push origin HEAD:main
          fi
