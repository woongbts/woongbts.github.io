name: xero-public-scan

on:
  push:
    paths:
      - '.github/workflows/xero-scan.yml'

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Fetch public wired product lists
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p scan/internet scan/tv scan/settop
          python3 - <<'PY'
          import json, pathlib, time, urllib.parse, urllib.request
          ROOT='https://www.xeronote.co.kr'
          REFERER=ROOT+'/consult/internet.php'
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36'
          root=pathlib.Path('scan')
          def get(url):
              req=urllib.request.Request(url,headers={'User-Agent':UA,'Accept':'*/*','Referer':REFERER})
              with urllib.request.urlopen(req,timeout=20) as r: return r.read()
          groups={
            'SKB':['BASIC','WIFI','FAMILY','WINGS','SMART_SAFE'],
            'KT':['BASIC','WIFI','FAMILY','WI','FAMILY_SAFE','TOTAL_SAFE','SAFE_INTERNET'],
            'LGUPLUS':['PREMIUM_SAFE','PREMIUM_GUARANTEE','BASIC','SMART_GIGA'],
            'HELLO':['BASIC','WIFI','FAMILY'],
            'SKYLIFE':['BASIC','WIFI','FAMILY']
          }
          all_tv={}
          for bid,gs in groups.items():
              for g in gs:
                  qs=urllib.parse.urlencode({'broadband_id':bid,'product_type':'INTERNET','product_group':g})
                  url=ROOT+'/api/data/get_internet_product_list.php?'+qs
                  try:(root/'internet'/f'{bid}__{g}.json').write_bytes(get(url))
                  except Exception as e:(root/'internet'/f'{bid}__{g}.error.txt').write_text(f'{url}\n{e}',encoding='utf-8')
                  time.sleep(.05)
              tv_groups=['BTV','BTV_POP'] if bid=='SKB' else ['']
              for g in tv_groups:
                  qs=urllib.parse.urlencode({'broadband_id':bid,'product_type':'TV','product_group':g})
                  url=ROOT+'/api/data/get_internet_product_list.php?'+qs
                  fn=f'{bid}__{g or "ALL"}.json'
                  try:
                      raw=get(url); (root/'tv'/fn).write_bytes(raw)
                      d=json.loads(raw.decode('utf-8-sig'))
                      rows=d.get('data',[]) if isinstance(d,dict) else []
                      all_tv.setdefault(bid,[]).extend(rows)
                  except Exception as e:(root/'tv'/fn.replace('.json','.error.txt')).write_text(f'{url}\n{e}',encoding='utf-8')
                  time.sleep(.05)
          # Set-top options and rental/install fees for every visible TV product.
          for bid,rows in all_tv.items():
              seen=set()
              for row in rows:
                  key=str(row.get('product_key') or '')
                  if not key or key in seen: continue
                  seen.add(key)
                  qs=urllib.parse.urlencode({'broadband_id':bid,'product_type':'SETTOP','product_key':key})
                  url=ROOT+'/api/data/get_internet_sub_product_list.php?'+qs
                  try:(root/'settop'/f'{bid}__{key}.json').write_bytes(get(url))
                  except Exception as e:(root/'settop'/f'{bid}__{key}.error.txt').write_text(f'{url}\n{e}',encoding='utf-8')
                  time.sleep(.03)
          PY
      - name: Upload scan artifact
        uses: actions/upload-artifact@v4
        with:
          name: xero-public-scan
          path: scan/
          retention-days: 1
