name: run-add-skt-and-customer-gifts

on:
  push:
    paths:
      - '.github/workflows/run-add-skt-and-customer-gifts.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply SKT and customer gift upgrade
        run: python scripts/add-skt-and-customer-gifts.py
      - name: Validate customer page contains no internal policy wording
        run: |
          python - <<'PY'
          from pathlib import Path
          text=Path('rates.html').read_text(encoding='utf-8')
          forbidden=['현금+상품권','최종합계 수수료','경품가이드','차감정책']
          bad=[x for x in forbidden if x in text]
          if bad:
              raise SystemExit('Forbidden customer-facing internal text: '+', '.join(bad))
          print('Customer page policy wording check passed')
          PY
      - name: Validate SKT and gift UI
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.load(open('data/internet.json',encoding='utf-8'))
          assert any(x.get('id')=='SKTNET' for x in d['providers'])
          assert len([x for x in d['internet_products'] if x.get('provider_id')=='SKTNET'])==3
          assert len([x for x in d['tv_products'] if x.get('provider_id')=='SKTNET'])==3
          js=Path('assets/rates.js').read_text(encoding='utf-8')
          html=Path('rates.html').read_text(encoding='utf-8')
          assert 'CUSTOMER_GIFT_MAX' in js and 'internet-customer-gift' in js and 'internet-customer-gift' in html
          print('SKT and customer gift validation passed')
          PY
      - name: Commit changes
        run: |
          if git diff --quiet -- data/internet.json assets/rates.js rates.html; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'woongbts-ui-sync'
          git config user.email 'actions@users.noreply.github.com'
          git add data/internet.json assets/rates.js rates.html
          git commit -m 'Add SK Telecom and customer gift maximums'
          git push origin main
