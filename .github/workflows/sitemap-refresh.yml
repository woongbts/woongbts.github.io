name: Refresh sitemap lastmod

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'rates.html'
      - 'manduk-mobile.html'
      - 'links.html'
      - 'privacy.html'
      - 'rental/index.html'
      - 'rental/product.html'
      - 'rental/assets/catalog.js'
      - 'rental/assets/product-generic.js'
      - 'rental/assets/rental.css'
      - 'rental/data/products.json'
      - 'rental/data/appliance-gift-options.json'
      - 'assets/**'
      - 'data/**'
      - '.github/scripts/update_sitemap.py'

permissions:
  contents: write

concurrency:
  group: sitemap-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update sitemap dates
        run: python .github/scripts/update_sitemap.py
      - name: Commit sitemap only when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- sitemap.xml rental/sitemap.xml; then
            echo 'sitemap files are already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sitemap.xml rental/sitemap.xml
          git commit -m 'Refresh root and rental sitemaps'
          git pull --rebase origin main
          git push
