name: Finalize prepaid plans

on:
  push:
    paths:
      - '.github/workflows/tmp-finalize-prepaid.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Bump prepaid cache and validate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import collections, json
          from pathlib import Path

          data_path=Path('data/prepaid.json')
          data=json.loads(data_path.read_text(encoding='utf-8'))
          expected={'MOBINGSKT':12,'MOBINGKT':13,'MOBINGLG':14,'FREETSKT':7,'FREETKT':6,'FREETLG':9}
          providers=data.get('providers') or []
          plans=data.get('plans') or []
          assert len(providers)==6, len(providers)
          assert len(plans)==61, len(plans)
          counts=collections.Counter(p.get('provider_id') for p in plans)
          assert dict(counts)==expected, counts
          assert {p.get('id') for p in providers}==set(expected)
          assert all(p.get('network') in {'SKT','KT','LGU+'} for p in providers)
          for p in plans:
              assert p.get('provider_id') in expected
              assert p.get('network') in {'SKT','KT','LGU+'}
              assert isinstance(p.get('monthly_fee'), int) and 0 < p['monthly_fee'] <= 100000
              assert p.get('name') and p.get('data') and p.get('voice') and p.get('sms')
          dump=json.dumps(data,ensure_ascii=False).lower()
          for word in ('리베이트','판매점 수수료','정산금','commission','rebate','제로노트','xeronote'):
              assert word.lower() not in dump, word

          js_path=Path('assets/rates.min.js')
          js=js_path.read_text(encoding='utf-8')
          old='data/prepaid.json?v=20260916-1'
          new='data/prepaid.json?v=20260917-2'
          assert old in js or new in js
          js=js.replace(old,new)
          js_path.write_text(js,encoding='utf-8')

          html_path=Path('rates.html')
          html=html_path.read_text(encoding='utf-8')
          old_html='assets/rates.min.js?v=20260917-1'
          new_html='assets/rates.min.js?v=20260917-2'
          assert old_html in html or new_html in html
          html=html.replace(old_html,new_html)
          html_path.write_text(html,encoding='utf-8')

          print('prepaid providers:', len(providers))
          print('prepaid plans:', len(plans))
          print('counts:', dict(counts))
          print('customer-safe validation OK')
          PY
          node --check assets/rates.min.js
          rm -f .github/workflows/tmp-prepaid-plan-probe.yml
          rm -f .github/workflows/tmp-finalize-prepaid.yml

      - name: Commit verified prepaid update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'woongbts'
          git config user.email 'swb3301@gmail.com'
          git add data/prepaid.json assets/rates.min.js rates.html .github/workflows
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'Finalize Mobing and FreeT prepaid plans'
          git pull --rebase origin main
          git push origin HEAD:main
