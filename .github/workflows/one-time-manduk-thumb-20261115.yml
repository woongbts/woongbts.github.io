name: One-time Manduk SEO thumbnail import
on:
  push:
    paths:
      - '.github/workflows/one-time-manduk-thumb-20261115.yml'
permissions:
  contents: write
jobs:
  import-thumbnail:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install image dependency
        run: python -m pip install --quiet pillow
      - name: Fetch approved image and update SEO metadata
        env:
          ASSET_URL: https://at.adobe.com/ImRyKYYdTP8ywf6K
        run: |
          python - <<'PY'
          import io, json, os, re, urllib.request
          from pathlib import Path
          from PIL import Image, ImageOps
          req=urllib.request.Request(os.environ['ASSET_URL'],headers={'User-Agent':'Mozilla/5.0 (compatible; WebsiteAssetImport/1.0)','Accept':'image/png,image/*;q=0.9'})
          with urllib.request.urlopen(req,timeout=45) as res:
              raw=res.read(15_000_000)
              print('Download status:', res.status, 'mime:',res.headers.get('Content-Type'),'size:',len(raw))
          try:
              image=Image.open(io.BytesIO(raw))
              image.load()
          except Exception as ex:
              raise RuntimeError('Adobe image link did not return actual image bytes') from ex
          print('Original image:', image.size,image.format)
          output=Path('assets/manduk-mobile-og-20261115.jpg')
          image=ImageOps.fit(image.convert('RGB'),(1200,630),method=Image.Resampling.LANCZOS)
          image.save(output,'JPEG',quality=90,optimize=True,progressive=True,subsampling=0)
          target=Path('manduk-mobile.html')
          src=target.read_text(encoding='utf-8')
          old='<meta property="og:image" content="https://woongbts.kr/assets/woongbi-og-20260918.jpg">'
          new_url='https://woongbts.kr/'+str(output)
          meta='\n'.join([
             '<meta property="og:image" content="'+new_url+'">',
             '<meta property="og:image:secure_url" content="'+new_url+'">',
             '<meta property="og:image:type" content="image/jpeg">',
             '<meta property="og:image:width" content="1200">',
             '<meta property="og:image:height" content="630">',
             '<meta property="og:image:alt" content="만덕 휴대폰 · 기기변경·번호이동·알뜰폰 요금 비교 · 웅비통신 덕천만덕점">',
             '<meta name="twitter:card" content="summary_large_image">',
             '<meta name="twitter:image" content="'+new_url+'">',
             '<link rel="image_src" href="'+new_url+'">'
          ])
          assert src.count(old)==1, 'Existing OG image tag mismatch'
          src=src.replace(old,meta,1)
          def jsonld(match):
              data=json.loads(match.group(1))
              if data.get('@type') in ('WebPage','LocalBusiness'):
                  data['image']=new_url
                  if data.get('@type')=='WebPage':
                      data['primaryImageOfPage']={'@type':'ImageObject','url':new_url,'width':1200,'height':630}
              return '<script type="application/ld+json">'+json.dumps(data,ensure_ascii=False,separators=(',',':'))+'</script>'
          src=re.sub(r'<script type="application/ld\\+json">([\\s\\S]*?)</script>',jsonld,src)
          assert src.count(new_url)>=4
          target.write_text(src,encoding='utf-8')
          print('Created',output,output.stat().st_size,'bytes; updated',target)
          PY
      - name: Commit approved image and page metadata
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add assets/manduk-mobile-og-20261115.jpg manduk-mobile.html
          git diff --cached --exit-code && { echo "Nothing changed"; exit 1; } || true
          git commit -m "Update Manduk mobile Naver thumbnail and OG metadata"
          git push
