name: Diagnose Clover raw detail

on:
  push:
    paths:
      - 'rental/.clover-raw-diagnostic-trigger'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check beautifulsoup4
      - run: python .github/scripts/diagnose_clover_raw.py
      - run: |
          git config user.name "woongbi-diagnostic-bot"
          git config user.email "actions@users.noreply.github.com"
          git add rental/data/clover-raw-diagnostic.json
          git commit -m "Capture Clover raw detail diagnostic" || exit 0
          git pull --rebase origin main
          git push
