name: Saved quote comparison upgrade

on:
  push:
    branches: [main]
    paths:
      - 'scripts/saved-quote-compare-upgrade.py'
      - '.github/workflows/saved-quote-compare-upgrade.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply saved quote comparison upgrade
        run: python scripts/saved-quote-compare-upgrade.py
      - name: Commit updated calculator
        run: |
          if git diff --quiet -- rates.html assets/rates.js assets/rates.css; then
            echo "No calculator changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rates.html assets/rates.js assets/rates.css
          git commit -m "Add saved mobile quote comparison"
          git push
