name: Temporary pre-approval badge patch
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-precon-badge.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply pre-approval badge patch
        run: |
          python3 .github/scripts/temp_add_precon_badge.py
          python3 -m py_compile .github/scripts/validate_site.py
          python3 .github/scripts/build_rates_asset.py --check
          python3 .github/scripts/validate_site.py
      - name: Commit patch and clean temporary files
        run: |
          set -euo pipefail
          rm -f .github/scripts/temp_add_precon_badge.py .github/workflows/temp-precon-badge.yml
          git config user.name 'woongbts-site-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -u
          git add index.html assets/site-pro.css .github/scripts/validate_site.py
          git commit -m 'Add visible telecom pre-approval badge'
          git push origin HEAD:main
