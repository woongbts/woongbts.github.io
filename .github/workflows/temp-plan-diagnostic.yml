name: Temporary wireless plan diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-plan-diagnostic.yml'

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect plan group metadata and response fields
        shell: bash
        run: |
          python3 - <<'PY'
          import json,re,urllib.request,urllib.parse
          root='https://www.xeronote.co.kr'; ref=root+'/consult/mobile.php'; ua='Mozilla/5.0'
          def text(url):
              req=urllib.request.Request(url,headers={'User-Agent':ua,'Referer':ref,'Accept':'application/json,text/plain,*/*'})
              return urllib.request.urlopen(req,timeout=30).read().decode('utf-8-sig','replace')
          js=text(root+'/inc/js/consult/mobile_popup.js?20260918_2026_07')
          for needle in ('set_plan_group','get_plan_group','plan_group_name'):
              print('\n===',needle,'===')
              pos=0
              while True:
                  i=js.find(needle,pos)
                  if i<0: break
                  print(js[max(0,i-1200):i+4000].replace('\t','    '))
                  pos=i+len(needle)
                  break
          params={'telecom_id':'SKT','device_idx':'2891','plan_group':'','sort_type':'NONE','join_type':'CHANGE','join_flag':'ABLE','plan_idx':'','keyword':'','network_type':'5G'}
          url=root+'/api/data/get_mobile_plan_list.php?'+urllib.parse.urlencode(params)
          rows=json.loads(text(url)).get('data') or []
          for wanted in ('2945','969','797','796','1110','1111','1004','1591'):
              r=next((x for x in rows if str(x.get('plan_idx'))==wanted),None)
              print('\nPLAN',wanted,json.dumps(r,ensure_ascii=False,sort_keys=True))
          PY
