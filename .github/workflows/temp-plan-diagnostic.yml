name: Temporary wireless plan diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-plan-diagnostic.yml'

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect plan group endpoint
        shell: bash
        run: |
          python3 - <<'PY'
          import re,urllib.request
          root='https://www.xeronote.co.kr'; ref=root+'/consult/mobile.php'
          for fn in ('/inc/js/consult/mobile_popup.js?20260918_2026_07','/inc/js/consult/common.js?20260918_2026_07'):
              req=urllib.request.Request(root+fn,headers={'User-Agent':'Mozilla/5.0','Referer':ref})
              txt=urllib.request.urlopen(req,timeout=30).read().decode('utf-8-sig','replace')
              print('\nFILE',fn)
              for pat in ('plan_group','get_plan','set_plan'):
                  print('PAT',pat)
                  for m in re.finditer(r'.{0,400}'+pat+r'.{0,900}',txt,re.I|re.S):
                      s=m.group(0).replace('\t','    ').replace('\n',' ')
                      if 'api/data' in s or 'function' in s:
                          print(s[:1400])
          PY
