name: Temporary wireless plan diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-plan-diagnostic.yml'

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify NORMAL plus ABLE plan results
        shell: bash
        run: |
          python3 - <<'PY'
          import json,urllib.request,urllib.parse
          root='https://www.xeronote.co.kr'
          ref=root+'/consult/mobile.php'
          ua='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36'
          def get(params):
              url=root+'/api/data/get_mobile_plan_list.php?'+urllib.parse.urlencode(params)
              req=urllib.request.Request(url,headers={'User-Agent':ua,'Referer':ref,'Accept':'application/json,text/plain,*/*'})
              return json.loads(urllib.request.urlopen(req,timeout=30).read().decode('utf-8-sig')).get('data') or []
          base={'telecom_id':'SKT','device_idx':'2891','join_type':'CHANGE','join_flag':'ABLE','plan_idx':'','keyword':'','network_type':'5G'}
          for group in ('','NORMAL'):
              for sort in ('','NONE'):
                  p=dict(base,plan_group=group,sort_type=sort)
                  rows=get(p)
                  names=[str(r.get('plan_name') or '').strip() for r in rows]
                  bad=[n for n in names if any(x.lower() in n.lower() for x in ('아웃도어','Tab','워치','태블릿'))]
                  print('\nCASE',repr(group),repr(sort),'count',len(rows),'bad',bad[:20])
                  for i,r in enumerate(rows[:35],1):
                      print(i,r.get('plan_idx'),str(r.get('plan_name') or '').strip(),r.get('price'),r.get('join_yn'),r.get('except_yn'))
          PY
