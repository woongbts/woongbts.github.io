name: Temporary handset plan refresh

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-plan-diagnostic.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply handset plan policy
        run: python3 .github/scripts/temp_apply_handset_plan_policy.py

      - name: Refresh verified wireless data
        run: python3 .github/scripts/daily_wireless_sync.py

      - name: Validate refreshed data
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile .github/scripts/daily_wireless_sync.py
          node --check assets/rates.min.js
          python3 - <<'PY'
          import json
          from pathlib import Path
          catalog=json.loads(Path('data/catalog.json').read_text(encoding='utf-8'))
          plans=json.loads(Path('data/plans.json').read_text(encoding='utf-8')).get('mobile_plans') or []
          blocked=('아웃도어','tab','태블릿','watch','워치','포켓파이','스마트기기','데이터함께쓰기','데이터쉐어링','데이터셰어링','아이패드','ipad','세컨드디바이스','2nddevice')
          leaked=[(p.get('id'),p.get('name')) for p in plans if any(x in ''.join(str(p.get('name') or '').lower().split()) for x in blocked)]
          assert not leaked, leaked[:20]
          ids={p.get('id') for p in plans}
          assert 'SKT-XP-797' not in ids and 'SKT-XP-796' not in ids
          moto=next(d for d in catalog.get('devices',[]) if d.get('id')=='SKT-XD-2891')
          moto_ids=(moto.get('eligible_plan_ids_by_join_type') or {}).get('기기변경') or []
          assert 'SKT-XP-797' not in moto_ids and 'SKT-XP-796' not in moto_ids
          assert all(pid in ids for d in catalog.get('devices',[]) for arr in (d.get('eligible_plan_ids_by_join_type') or {}).values() for pid in arr)
          print('validated plans',len(plans),'moto plans',len(moto_ids))
          PY
          grep -q '"sort_type": "NONE"' .github/scripts/daily_wireless_sync.py
          grep -q '"join_flag": "ABLE"' .github/scripts/daily_wireless_sync.py
          grep -q 'handset_plan_rows' .github/scripts/daily_wireless_sync.py
          grep -q 'data/plans.json?v=20260918-3' assets/rates.min.js
          grep -q 'assets/rates.min.js?v=20260918-3' rates.html

      - name: Commit verified changes and remove temporary files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/scripts/__pycache__
          rm -f .github/workflows/temp-plan-diagnostic.yml .github/scripts/temp_apply_handset_plan_policy.py
          git config user.name 'woongbts-site-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -u
          git add .github/scripts/daily_wireless_sync.py assets/rates.min.js rates.html data/catalog.json data/plans.json data/supports.json
          echo '--- staged status ---'
          git status --short
          git commit -m 'Keep phone plans limited to current handset options'
          git push origin HEAD:main
