name: Temporary wireless plan diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-plan-diagnostic.yml'

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Inspect source plan controls and Moto G86 possible plans
        shell: bash
        run: |
          python3 - <<'PY'
          import json,re,urllib.request,urllib.parse
          root='https://www.xeronote.co.kr'
          ref=root+'/consult/mobile.php'
          ua='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36'
          def get_text(url):
              req=urllib.request.Request(url,headers={'User-Agent':ua,'Referer':ref})
              return urllib.request.urlopen(req,timeout=30).read().decode('utf-8-sig','replace')
          def get_json(path,params):
              url=root+path+'?'+urllib.parse.urlencode(params)
              return json.loads(get_text(url))
          html=get_text(ref)
          scripts=re.findall(r'<script[^>]+src=["\']([^"\']+)',html,re.I)
          print('SCRIPTS',scripts)
          for src in scripts:
              url=urllib.parse.urljoin(ref,src)
              try: txt=get_text(url)
              except Exception as e:
                  print('SCRIPT_FAIL',url,e); continue
              hits=[]
              for pat in ('get_mobile_plan_list.php','join_flag','sort_type','plan_group','가능요금제','최신'):
                  if pat in txt: hits.append(pat)
              if hits:
                  print('\n### SCRIPT',url,'hits',hits)
                  for m in re.finditer(r'.{0,220}(?:get_mobile_plan_list\.php|join_flag|sort_type|plan_group|가능요금제|최신).{0,320}',txt,re.S):
                      print(m.group(0).replace('\n',' ')[:700])
          base={
              'telecom_id':'SKT','device_idx':'2891','plan_group':'','sort_type':'',
              'join_type':'CHANGE','join_flag':'ABLE','plan_idx':'','keyword':''
          }
          init=get_json('/api/data/get_consult_init.php',{'telecom_id':'SKT','device_idx':'2891','consult_mode':'','plan_idx':''}).get('data') or {}
          print('\nINIT',json.dumps({k:init.get(k) for k in ('model_name','device_name','network_type')},ensure_ascii=False))
          if init.get('network_type') and init.get('network_type')!='ALL': base['network_type']=init.get('network_type')
          data=get_json('/api/data/get_mobile_plan_list.php',base).get('data') or []
          print('CURRENT_QUERY_COUNT',len(data))
          for i,row in enumerate(data[:120],1):
              name=str(row.get('plan_name') or '')
              if i<=35 or '아웃도어' in name or 'Tab' in name or '태블릿' in name or '워치' in name:
                  print('ROW',i,json.dumps({k:row.get(k) for k in ('plan_idx','plan_name','price','join_yn','except_yn','reg_dt','announce_dt','start_dt','end_dt','plan_group','network_type')},ensure_ascii=False))
          PY
