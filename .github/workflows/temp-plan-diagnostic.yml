name: Temporary wireless plan diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-plan-diagnostic.yml'

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect source plan popup logic
        shell: bash
        run: |
          python3 - <<'PY'
          import re,urllib.request
          root='https://www.xeronote.co.kr'
          ref=root+'/consult/mobile.php'
          url=root+'/inc/js/consult/mobile_popup.js?20260918_2026_07'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Referer':ref})
          txt=urllib.request.urlopen(req,timeout=30).read().decode('utf-8-sig','replace')
          for needle in ('function set_plan_list','function set_plan_list_sub','function sel_plan_sort','PLAN_SORT','popup_plan_sort','PLAN_JOIN_TYPE','get_mobile_plan_list.php'):
              print('\n===== NEEDLE',needle,'=====')
              pos=0
              found=0
              while True:
                  i=txt.find(needle,pos)
                  if i<0: break
                  found+=1
                  print(txt[max(0,i-1200):i+5000].replace('\t','    '))
                  pos=i+len(needle)
                  if found>=3: break
          PY
