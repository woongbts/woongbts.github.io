name: Temporary CRM D1 count

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-crm-d1-count.yml'

permissions:
  contents: read

jobs:
  count:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install CRM tools
        working-directory: .github/crm
        run: npm install --ignore-scripts
      - name: Query D1 customer count
        working-directory: .github/crm
        shell: bash
        run: |
          set -euo pipefail
          cat > wrangler.temp.toml <<'EOF'
          name = "woongbi-crm"
          main = "src/worker.js"
          compatibility_date = "2026-09-01"
          account_id = "79442ff839ce3fbee6caebe3285c1013"

          [[d1_databases]]
          binding = "DB"
          database_name = "woongbi-crm"
          database_id = "bc27cc13-1a30-44f0-831e-dffdad6a68f6"
          EOF
          npx wrangler d1 execute woongbi-crm --remote --config wrangler.temp.toml --command "SELECT COUNT(*) AS customer_count FROM customers;"
          rm -f wrangler.temp.toml
