name = "woongbi-consent"
main = "src/consent-public.js"
compatibility_date = "2026-09-01"
account_id = "79442ff839ce3fbee6caebe3285c1013"
workers_dev = true
preview_urls = false

[assets]
directory = "./consent-web"
binding = "ASSETS"
run_worker_first = true

[[services]]
binding = "CONSENT"
service = "woongbi-crm"
entrypoint = "ConsentPublic"

[[d1_databases]]
binding = "DB"
database_name = "woongbi-crm"
database_id = "bc27cc13-1a30-44f0-831e-dffdad6a68f6"

[observability]
enabled = false

[[ratelimits]]
name = "INTAKE_LIMITER"
namespace_id = "1001"
simple = { limit = 12, period = 60 }

[[ratelimits]]
name = "ANALYTICS_LIMITER"
namespace_id = "1002"
simple = { limit = 120, period = 60 }
