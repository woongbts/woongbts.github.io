<head>

  <title>신청 상태 확인 | 웅비통신·웅비렌탈</title>
  <link rel="icon" type="image/svg+xml" href="/assets/woongbi-mark.svg">
  <style>
    :root{font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#173f42;background:#f5f9f8}
    *{box-sizing:border-box}body{margin:0}.wrap{width:min(680px,calc(100% - 28px));margin:0 auto}
    header{padding:22px 0;background:#fff;border-bottom:1px solid #dbe7e5}.brand{display:flex;gap:10px;align-items:center;color:#173f42;text-decoration:none;font-weight:900}.brand img{width:42px;height:42px}.brand span{display:block}.brand small{display:block;color:#809092;font-size:.72rem;margin-top:2px}
    main{padding:46px 0 80px}.card{padding:24px;border:1px solid #dbe7e5;border-radius:22px;background:#fff;box-shadow:0 18px 55px rgba(21,59,67,.08)}
    .eyebrow{margin:0;color:#0f766e;font-size:.7rem;font-weight:950;letter-spacing:.08em}.card h1{margin:8px 0 0;font-size:1.7rem;letter-spacing:-.04em}.lead{margin:8px 0 0;color:#718587;line-height:1.65}
    .summary{margin-top:20px;padding:14px;border-radius:14px;background:#f3f8f7}.summary span,.summary strong{display:block}.summary span{font-size:.72rem;color:#7c8e90}.summary strong{margin-top:4px;font-size:1rem}.summary small{display:block;margin-top:5px;color:#829294}
    .steps{list-style:none;margin:22px 0 0;padding:0;display:grid;gap:8px}.steps li{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:center;padding:12px;border:1px solid #e0e9e7;border-radius:13px;color:#849395}.steps li>span{width:34px;height:34px;display:grid;place-items:center;border-radius:50%;background:#edf3f2;font-weight:950}.steps li b,.steps li small{display:block}.steps li b{font-size:.84rem}.steps li small{margin-top:2px;font-size:.68rem}.steps li.done,.steps li.active{border-color:#b9d9d3;color:#285d59;background:#f4fbf9}.steps li.active>span{background:#0f766e;color:#fff}
    .note{margin:18px 0 0;color:#76898b;font-size:.72rem;line-height:1.6}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:20px}.actions a{min-height:44px;display:grid;place-items:center;border-radius:11px;text-decoration:none;font-size:.78rem;font-weight:900}.actions a:first-child{background:#123f46;color:#fff}.actions a:last-child{border:1px solid #cededb;color:#31585b;background:#fff}
    .error{padding:16px;border-radius:12px;background:#fff4f1;color:#9a442f}.loading{color:#718587}.refresh{margin-top:12px;border:0;background:none;color:#0f766e;font-weight:900;cursor:pointer}
    @media(max-width:520px){main{padding-top:28px}.card{padding:18px;border-radius:18px}.card h1{font-size:1.45rem}.actions{grid-template-columns:1fr}}
  </style>
</head>

<header><div class="wrap"><a class="brand" href="/"><img src="/assets/woongbi-mark.svg" alt=""><span>웅비통신 · 웅비렌탈<small>신청 상태 확인</small></span></a></div></header>
<main><div class="wrap"><section class="card">
  <p class="eyebrow">APPLICATION STATUS</p>
  <h1>신청 진행상태를 확인하세요.</h1>
  <p class="lead">이 페이지에는 이름·전화번호 같은 개인정보를 표시하지 않습니다.</p>
  <div id="status-view" class="loading">신청 상태를 확인하는 중입니다.</div>
  <button id="status-refresh" class="refresh" type="button">다시 확인</button>
  <div class="actions"><a href="tel:0513437677">전화 문의</a><a href="http://pf.kakao.com/_nWwNT/chat" target="_blank" rel="noopener noreferrer">카카오톡 문의</a></div>
</section></div></main>
<script src="/assets/application-status.js?v=20261005-1" defer></script>
</body></html>
