<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>상담 동선 테스트 | 웅비통신</title><link rel="icon" href="/assets/woongbi-mark.svg" type="image/svg+xml"><style>
*{box-sizing:border-box}body{margin:0;background:#f4f8f7;color:#153e44;font:16px/1.6 system-ui,-apple-system,sans-serif}main{max-width:790px;margin:0 auto;padding:24px 16px 60px}a{color:#086d66}h1{font-size:28px;letter-spacing:-.035em;margin-bottom:4px}p{color:#597577}section{background:#fff;border:1px solid #dceae5;border-radius:18px;padding:18px;margin-top:16px}h2{font-size:19px;margin:0 0 10px}.stage{display:grid;grid-template-columns:minmax(0,1fr) 58px;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid #edf3f1}.stage:last-child{border-bottom:0}.stage b{font-size:21px;text-align:right}.meter{height:7px;border-radius:10px;background:#e6f1ed;margin-top:5px;overflow:hidden}.meter>i{display:block;background:#0f766e;height:100%;width:0;max-width:100%}.note{background:#fff8e9;border-color:#f0e0bd}.note strong{color:#735322}.small{font-size:13px}.empty{font-size:15px;color:#738784}button{padding:10px 13px;border:1px solid #bdd5ce;background:#fff;border-radius:11px;font:inherit;font-weight:800;cursor:pointer}
</style></head><body><main><a href="/">← 웅비통신 홈페이지</a><h1>상담 동선 점검</h1><p>상품을 고르고 상담을 신청하는 과정을 단계별로 확인합니다.</p><section class="note"><strong>중요: 이 기기에서 발생한 테스트 기록만 표시합니다.</strong><p class="small">모든 고객의 실제 이탈률이나 매출 전환율이 아닙니다. 수치는 중복 클릭을 포함한 이벤트 건수이며, 다른 고객의 방문 기록은 표시되지 않습니다. 고객 전체 분석은 별도의 서버 집계가 필요합니다.</p></section><section><h2>휴대폰·통신 상담 흐름</h2><div id="flow"></div></section><section><h2>방문 예약 흐름</h2><div id="visits"></div></section><section><h2>이 기기 기록 현황</h2><p id="meta" class="small"></p><button type="button" id="refresh">다시 확인</button></section></main><script>
(()=>{'use strict';
const stages=[['home_quick_order_category','첫 화면 상품 선택'],['home_quick_order_continue','상품 세부 선택'],['rate_calculator_start','계산기 조작'],['mobile_quote_result_view','휴대폰 예상 금액 확인'],['internet_compare_view','인터넷 비교 확인'],['store_apply_open','상담 신청창 열기'],['store_apply_submit','상담 접수 요청'],['store_apply_success','접수 완료']];
const visit=[['visit_handoff_start','선택 상품 방문예약 이동'],['booking_click','예약사이트 열기']];
const labels={'home_quick_order_category':'상품 선택','home_quick_order_continue':'상품 세부 선택'};
function read(){try{return JSON.parse(localStorage.getItem('wb_conversion_events_v1')||'[]').filter(x=>x&&typeof x.type==='string')}catch{return []}}
function render(id,items,rows){const counts=items.map(([key,label])=>({label,n:rows.filter(x=>x.type===key).length}));const max=Math.max(1,...counts.map(x=>x.n));const root=document.getElementById(id);root.replaceChildren();counts.forEach(({label,n})=>{const item=document.createElement('div');item.className='stage';const left=document.createElement('div'),text=document.createElement('span');text.textContent=label;const meter=document.createElement('div'),bar=document.createElement('i');meter.className='meter';bar.style.width=(n/max*100)+'%';meter.append(bar);left.append(text,meter);const count=document.createElement('b');count.textContent=n.toLocaleString('ko-KR');item.append(left,count);root.append(item)})}
function refresh(){const rows=read();render('flow',stages,rows);render('visits',visit,rows);document.getElementById('meta').textContent='이 브라우저의 최근 저장 기록 '+rows.length.toLocaleString('ko-KR')+'건 · 마지막 기록 '+(rows.length?new Date(rows[rows.length-1].at).toLocaleString('ko-KR'):'없음')+' · 개인정보는 표시하지 않습니다.'}
document.getElementById('refresh').addEventListener('click',refresh);refresh();
})();
</script></body></html>
